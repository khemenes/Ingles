will Pedro never forget that day?","o":["He won a prize","He met a famous player","It was the day he stopped being afraid"],"a":2}]},{"u":10,"title":"How we used to meet","level":"B1","text":["When my parents were young, they didn't have mobile phones, so they used to write letters to each other. My father used to live in a small town, and my mother used to study in the capital. They would meet only on holidays. In the evenings my father would walk to the post office and send a letter, and then he would wait for two weeks for the answer.","Today people use apps to find a partner, and many couples meet online. My cousin, for instance, met his wife on a dating app. At first she didn't use to like him, because he was always late. But he asked her out again, and they went out for a year before they got engaged. I think my parents' way was more romantic, but my cousin says that apps are more practical. Whatever the method, they all say that good relationships need time and honesty."],"gloss":[{"en":"used to","pt":"costumava"},{"en":"post office","pt":"correios"},{"en":"dating app","pt":"aplicativo de relacionamento"},{"en":"ask someone out","pt":"convidar para sair"},{"en":"get engaged","pt":"ficar noivo"},{"en":"honesty","pt":"honestidade"}],"qs":[{"q":"How did the parents communicate when they were young?","o":["They wrote letters","They used mobile phones","They sent emails"],"a":0},{"q":"How long did the father wait for an answer?","o":["Two hours","About two weeks","One day"],"a":1},{"q":"Where did the cousin meet his wife?","o":["At the post office","At university","On a dating app"],"a":2},{"q":"Why did the wife not like him at first?","o":["He was rude","He lived far away","He was always late"],"a":2},{"q":"What do they say good relationships need?","o":["Money and gifts","Time and honesty","Phones and apps"],"a":1}]},{"u":11,"title":"A film made in two countries","level":"B1+","text":["The film The Last Bridge was made in two countries. It was filmed in Spain and Morocco, and it was directed by a young woman who had never made a feature film before. The story is based on a true event, and the script was written by two journalists. Most of the actors were chosen from local theatres, so many of them were not famous at all.","The film was released last summer, and it was seen by more than two million people in the first month. Some scenes were shot at night, and the lights were powered by solar panels. The soundtrack is performed by a small orchestra, and it has been praised by critics. The film will be shown on TV next month, but I think it should be watched in the cinema, because the landscapes are beautiful."],"gloss":[{"en":"feature film","pt":"longa-metragem"},{"en":"script","pt":"roteiro"},{"en":"release","pt":"lançar"},{"en":"soundtrack","pt":"trilha sonora"},{"en":"critics","pt":"críticos"},{"en":"landscape","pt":"paisagem"}],"qs":[{"q":"Where was the film shot?","o":["In two theatres","In Spain and Morocco","In Spain only"],"a":1},{"q":"Who directed the film?","o":["Two journalists","A young woman who had never made a feature film","A famous actor"],"a":1},{"q":"How were most of the actors chosen?","o":["From local theatres","From famous films","From a TV show"],"a":0},{"q":"How many people saw the film in the first month?","o":["More than two million","About two thousand","Exactly two hundred"],"a":0},{"q":"When will the film be shown on TV?","o":["Tomorrow","Last summer","Next month"],"a":2}]},{"u":12,"title":"Who is the man in the photo?","level":"B1+","text":["My grandmother found an old photo in a box. In it, a tall man with a moustache is standing next to a young woman. He must be my great-grandfather, because he has the same big nose as my father. The woman can't be my great-grandmother, because my grandmother says that she had red hair, and this woman has dark hair. She might be his sister, or she could be a friend.","The man is wearing a uniform, so he might have been a soldier. He looks serious, but the woman is smiling. They must have been close, because they are standing very near each other. The photo was taken in front of a train station, so they may have been waiting for a train. My grandmother isn't sure, but she thinks it must be from 1940. We are going to ask my uncle, who might know more."],"gloss":[{"en":"moustache","pt":"bigode"},{"en":"great-grandfather","pt":"bisavô"},{"en":"soldier","pt":"soldado"},{"en":"serious","pt":"sério"},{"en":"close","pt":"próximos, íntimos"},{"en":"uniform","pt":"uniforme"}],"qs":[{"q":"Why does the writer think the man is the great-grandfather?","o":["He is standing near a train","He is wearing a uniform","He has the same big nose as the writer's father"],"a":2},{"q":"Why can't the woman be the great-grandmother?","o":["She is too young","She has dark hair, and the great-grandmother had red hair","She is smiling"],"a":1},{"q":"What might the man have been?","o":["A teacher","A soldier","A doctor"],"a":1},{"q":"Why does the writer think they were close?","o":["They are standing very near each other","They are looking at the camera","They are wearing the same clothes"],"a":0},{"q":"Where was the photo taken?","o":["At a school","In front of a train station","In a park"],"a":1}]},{"u":13,"title":"Applying for a course","level":"B1+","text":["I want to study English in Dublin next year. If I get a good score in the entry test, the school will offer me a place in the advanced class. As soon as I receive the answer, I will book my flight. If I wait too long, the tickets will be more expensive, so I am checking prices every day.","The course lasts twelve weeks. Unless I find a cheaper room, I will have to share a flat with other students. When I arrive, I will call my host family and tell them my plans. If it rains a lot, I will probably stay at home and study, but if the weather is nice, I will explore the city. After I finish the course, I am going to take an exam so that I can apply to a university."],"gloss":[{"en":"entry test","pt":"teste de entrada"},{"en":"offer a place","pt":"oferecer uma vaga"},{"en":"as soon as","pt":"assim que"},{"en":"unless","pt":"a menos que"},{"en":"host family","pt":"família anfitriã"},{"en":"apply to","pt":"candidatar-se a"}],"qs":[{"q":"What will happen if the writer gets a good score?","o":["The writer will skip the course","The school will offer a place in the advanced class","The writer will get a free flight"],"a":1},{"q":"When will the writer book the flight?","o":["After the course","As soon as the answer arrives","Before the entry test"],"a":1},{"q":"Why is the writer checking prices every day?","o":["Waiting too long will make tickets more expensive","The writer wants to change the date","The writer is looking for a job"],"a":0},{"q":"What will the writer do unless a cheaper room is found?","o":["Stay with a friend","Share a flat with other students","Cancel the course"],"a":1},{"q":"What does the writer plan to do after the course?","o":["Take an exam to apply to a university","Go back home immediately","Work in Dublin"],"a":0}]},{"u":14,"title":"If I had a bigger flat","level":"B1+","text":["I live in a small flat in the city centre. It is cheap, but it only has one bedroom, and the kitchen is tiny. If I had a bigger flat, I would invite my friends for dinner every weekend. If I had a garden, I would grow vegetables and keep a dog. My neighbour has a garden, and she says that if I helped her, she would share her tomatoes with me.","Of course, a bigger place would cost more. If I moved to a house in the suburbs, I would pay twice as much, and I would have to drive for an hour to get to work. I wouldn't like that, so maybe I would rather stay here. If I were rich, I would buy a big house near the sea, but I am not, so I will enjoy my little flat and my neighbour's tomatoes."],"gloss":[{"en":"tiny","pt":"minúsculo"},{"en":"suburbs","pt":"subúrbios"},{"en":"neighbour","pt":"vizinho"},{"en":"grow","pt":"cultivar"},{"en":"twice as much","pt":"o dobro"},{"en":"flat","pt":"apartamento"}],"qs":[{"q":"What is the writer's kitchen like?","o":["Very modern","Tiny","Quite big"],"a":1},{"q":"What would the writer do with a garden?","o":["Build a swimming pool","Sell the flat","Grow vegetables and keep a dog"],"a":2},{"q":"What does the neighbour offer?","o":["To sell her garden","To lend her car","To share her tomatoes if the writer helps her"],"a":2},{"q":"Why would the writer not like to live in the suburbs?","o":["It would cost twice as much and take an hour to get to work","It would be too noisy","There would be no gardens"],"a":0},{"q":"What would the writer do if rich?","o":["Buy a big house near the sea","Stay in the same flat","Travel around the world"],"a":0}]},{"u":15,"title":"Interview day","level":"B1+","text":["I have an interview tomorrow for a job at a travel agency. I'm looking forward to meeting the manager, but I'm also afraid of making mistakes. I enjoy working with people, and I'm good at solving problems, so I think the job is perfect for me. I decided to prepare carefully. This afternoon I will practise answering common questions, and I need to remember to bring my CV.","The agency wants to hire someone who is able to speak two languages. I can speak English and Spanish, and I would like to learn German too. I don't mind working on weekends, but I refuse to work for very low pay. My friend Paula suggested wearing a dark suit and arriving early. I promised to call her after the interview. Wish me luck!"],"gloss":[{"en":"look forward to","pt":"esperar ansiosamente"},{"en":"afraid of","pt":"com medo de"},{"en":"hire","pt":"contratar"},{"en":"refuse","pt":"recusar-se"},{"en":"pay","pt":"salário"},{"en":"suggest","pt":"sugerir"}],"qs":[{"q":"What kind of company is the interview for?","o":["A bank","A travel agency","A hospital"],"a":1},{"q":"What is the writer afraid of?","o":["Speaking English","Making mistakes","Meeting the manager"],"a":1},{"q":"What does the agency want?","o":["Someone who lives nearby","Someone who knows German","Someone who speaks two languages"],"a":2},{"q":"What does the writer refuse to do?","o":["Work for very low pay","Work on weekends","Wear a suit"],"a":0},{"q":"What did Paula suggest?","o":["Wearing a dark suit and arriving early","Bringing a gift","Calling the manager"],"a":0}]},{"u":16,"title":"A return at the shop","level":"B1+","text":["Yesterday I took a pair of shoes back to the shop. I told the assistant that the shoes were too small and asked if I could change them. She said that she was sorry, but she couldn't give me a refund without the receipt. I explained that I had lost it. She asked me when I had bought the shoes, and I said that I had bought them the week before.","Then she told me that she would call her manager. The manager arrived and said that the shop's policy allowed exchanges for ten days. He asked me whether I wanted a bigger size or a different pair. I answered that I wanted the same shoes in a bigger size. He said that they didn't have my size in the shop, but that he would order it, and it would arrive in three days. I was happy with the solution."],"gloss":[{"en":"refund","pt":"reembolso"},{"en":"receipt","pt":"nota fiscal, recibo"},{"en":"exchange","pt":"troca"},{"en":"policy","pt":"política da loja"},{"en":"size","pt":"tamanho"},{"en":"order","pt":"encomendar"}],"qs":[{"q":"What was wrong with the shoes?","o":["They were broken","They were too expensive","They were too small"],"a":2},{"q":"Why could the assistant not give a refund?","o":["The shoes were old","The shop was closed","The writer had no receipt"],"a":2},{"q":"When did the writer buy the shoes?","o":["The day before","Two months before","The week before"],"a":2},{"q":"What did the manager say about the policy?","o":["Exchanges were not allowed","Exchanges were allowed for ten days","Refunds were always allowed"],"a":1},{"q":"How long will the new size take to arrive?","o":["Three days","Ten days","One week"],"a":0}]},{"u":17,"title":"A lucky mistake","level":"B1+","text":["Last year I made a mistake that turned out to be lucky. I was late for a bus because I forgot my keys. If I hadn't forgotten them, I would have caught the bus. Instead I took a taxi, and the driver told me about a new bakery near my house. If I had caught the bus, I wouldn't have met him.","I went to the bakery the next day, and I met a woman who was looking for an assistant. She offered me the job, and I accepted. Now I work there three days a week. If I hadn't been late that morning, I would never have found this job. My sister says that she would have been angry if she had been me, but I think everything happens for a reason. If I could change the past, I wouldn't change anything."],"gloss":[{"en":"turn out","pt":"acabar sendo"},{"en":"bakery","pt":"padaria"},{"en":"assistant","pt":"assistente"},{"en":"offer","pt":"oferecer"},{"en":"for a reason","pt":"por um motivo"},{"en":"catch (a bus)","pt":"pegar (um ônibus)"}],"qs":[{"q":"Why was the writer late?","o":["The bus was full","The writer forgot the keys","The taxi was slow"],"a":1},{"q":"What did the taxi driver tell the writer about?","o":["A new bus line","A new job","A new bakery"],"a":2},{"q":"What would have happened if the writer had caught the bus?","o":["The writer would have lost the keys","The writer would not have met the driver","The writer would have found the job earlier"],"a":1},{"q":"How did the writer get the job?","o":["A woman at the bakery offered it","The taxi driver gave it","A friend recommended it"],"a":0},{"q":"What does the sister say?","o":["She would have taken the bus","She would have been angry","She would have changed the past"],"a":1}]},{"u":18,"title":"A week without my phone","level":"B1+","text":["Last month I tried to spend a week without my phone. At first it was very hard. I used to check it every ten minutes, and I had too many apps. On the first day I felt a little lost, and I didn't know what to do with my free time. Not many people understand how much time they waste on social media.","By the third day I had a lot of energy and I was reading a few pages every night. I also talked to some friends face to face, and we had enough time to have a real conversation. There were still a few problems: I didn't have much information about the weather, and I had no map when I got lost. But overall, I think the week gave me less stress and more time. I won't stay offline forever, but I will use my phone a little less."],"gloss":[{"en":"check","pt":"conferir"},{"en":"waste","pt":"desperdiçar"},{"en":"face to face","pt":"pessoalmente"},{"en":"overall","pt":"no geral"},{"en":"offline","pt":"desconectado"},{"en":"stress","pt":"estresse"}],"qs":[{"q":"How often did the writer check the phone before?","o":["Once a day","Every ten minutes","Every hour"],"a":1},{"q":"What did the writer do in the evenings by the third day?","o":["Watched a film","Played video games","Read a few pages"],"a":2},{"q":"Which problem did the writer have?","o":["The writer missed a flight","There was no map when the writer got lost","The writer lost the phone"],"a":1},{"q":"What did the week give the writer?","o":["Less stress and more time","Less energy and less time","More friends and more money"],"a":0},{"q":"What will the writer do from now on?","o":["Use the phone more","Use the phone a little less","Never use a phone again"],"a":1}]},{"u":19,"title":"A teacher I admire","level":"B1+","text":["The person who I admire most is my old English teacher, Mrs Clark. She is a woman who never gives up on her students. When I was fifteen, I had a problem that made me hate school: I couldn't speak in front of people. Mrs Clark, whose classes were always full of laughter, noticed this and invited me to stay after class.","She gave me small tasks which I could do alone, like reading a short text to her. Little by little, I felt more confident. Today I work in a company where I often speak in meetings. I called her last year to thank her, and she said that she remembers every student who needed help. She retired last year, and she now lives in a small village where she grows flowers."],"gloss":[{"en":"admire","pt":"admirar"},{"en":"give up on","pt":"desistir de"},{"en":"laughter","pt":"risadas"},{"en":"notice","pt":"perceber"},{"en":"confident","pt":"confiante"},{"en":"retire","pt":"se aposentar"}],"qs":[{"q":"Who does the writer admire most?","o":["The writer's mother","A famous actor","An old English teacher"],"a":2},{"q":"What problem did the writer have at fifteen?","o":["The writer could not speak in front of people","The writer was always late","The writer hated English"],"a":0},{"q":"What did Mrs Clark do?","o":["She sent the writer to another school","She invited the writer to stay after class and gave small tasks","She gave the writer extra homework"],"a":1},{"q":"Where does the writer often speak today?","o":["In meetings at a company","In a theatre","In a classroom"],"a":0},{"q":"Where does Mrs Clark live now?","o":["In another country","In a small village where she grows flowers","In the city centre"],"a":1}]},{"u":20,"title":"The missing painting","level":"B1+","text":["Last night, somebody stole a valuable painting from the city museum. The police arrived at eight o'clock. 'You didn't see anything, did you?' the detective asked the guard. 'No, I was in the other room,' he said. 'The alarm worked, didn't it?' 'Yes, but somebody turned it off.'","The detective looked at the camera records. They showed a tall man in a black coat who entered at ten past seven. 'He isn't a visitor, is he?' asked the detective. 'No, he works here,' the director said. 'He's the new cleaner, isn't he?' The director nodded. Later, the police found the painting in a car near the river, and the cleaner was arrested the next morning. The museum was lucky, wasn't it?"],"gloss":[{"en":"steal / stole","pt":"roubar / roubou"},{"en":"valuable","pt":"valioso"},{"en":"guard","pt":"segurança"},{"en":"alarm","pt":"alarme"},{"en":"arrest","pt":"prender"},{"en":"nod","pt":"acenar com a cabeça"}],"qs":[{"q":"What time did the police arrive?","o":["At eight o'clock","At ten past seven","At midnight"],"a":0},{"q":"Where was the guard?","o":["In front of the painting","In a car","In the other room"],"a":2},{"q":"What did the camera records show?","o":["A tall man in a black coat entering at ten past seven","A woman running away","Nothing at all"],"a":0},{"q":"Who was the thief?","o":["A visitor","The guard","The new cleaner"],"a":2},{"q":"Where did the police find the painting?","o":["In the museum garden","In the cleaner's house","In a car near the river"],"a":2}]},{"u":23,"title":"The island that went green","level":"B2","text":["The small island of Samsø, in Denmark, was once a typical rural community that depended on oil and coal for almost everything. In 1997, the government chose it for an experiment: could a whole island produce all its energy from renewable sources within ten years? Most residents thought the idea was unrealistic, and some farmers were openly hostile.","Surprisingly, the project succeeded. Local people were invited to invest in the wind turbines, so they felt the changes belonged to them and not to a distant company. Within a decade, the island's electricity came entirely from wind, and a heating system burning straw from local farms replaced thousands of oil boilers. Today, Samsø produces more clean energy than it uses, and it sells the extra to the mainland. The islanders say the greatest change was not technical but cultural: they stopped thinking that environmental problems were someone else's responsibility."],"gloss":[{"en":"rural","pt":"rural"},{"en":"hostile","pt":"hostil"},{"en":"wind turbine","pt":"turbina eólica"},{"en":"boiler","pt":"caldeira"},{"en":"straw","pt":"palha"},{"en":"mainland","pt":"continente"},{"en":"invest","pt":"investir"}],"qs":[{"q":"What was the government's experiment?","o":["To make the island energy independent with renewable sources","To build a new airport","To close the island's farms","To stop all tourism"],"a":0},{"q":"How did the first reaction of residents compare with the result?","o":["They ignored it completely","They thought it was unrealistic, but it worked","They moved to the mainland","They were enthusiastic and it failed"],"a":1},{"q":"Why did the locals support the turbines in the end?","o":["The government paid everybody","A foreign company owned them","They could invest in them and feel ownership","They were forced to do so"],"a":2},{"q":"What replaced the oil boilers?","o":["Electric cars","Solar panels only","A heating system that burns local straw","Coal"],"a":2},{"q":"What did the islanders say was the biggest change?","o":["New jobs on the mainland","More tourists","A cultural change in responsibility","A drop in electricity prices"],"a":2}]},{"u":24,"title":"Sleeping less, feeling worse","level":"B2","text":["Many adults believe they can function perfectly well on five or six hours of sleep, but researchers disagree. In one well-known study, volunteers who slept six hours a night for two weeks performed as badly in memory and attention tests as people who had stayed awake for two entire nights. The surprising part is that the volunteers themselves thought they were fine. They had simply got used to feeling tired.","Lack of sleep does more than make us irritable. It weakens the immune system, increases the risk of heart disease and makes it harder to control our appetite, which is why tired people often crave sugary food. Doctors suggest some simple habits: going to bed and waking up at the same time every day, avoiding screens an hour before bedtime and keeping the bedroom cool and dark. Caffeine can help in the short term, but it should be avoided after the early afternoon, because its effect lasts for hours."],"gloss":[{"en":"function","pt":"funcionar"},{"en":"attention","pt":"atenção"},{"en":"irritable","pt":"irritável"},{"en":"immune system","pt":"sistema imunológico"},{"en":"crave","pt":"ter muita vontade de"},{"en":"bedtime","pt":"hora de dormir"},{"en":"appetite","pt":"apetite"}],"qs":[{"q":"What did the study find about people who slept six hours?","o":["They felt very tired","They performed better than usual","Nothing changed","Their performance was as poor as after two sleepless nights"],"a":3},{"q":"What was surprising about the volunteers?","o":["They wanted more tests","They thought they were fine","They refused to continue","They fell asleep during the tests"],"a":1},{"q":"Why do tired people often want sugary food?","o":["Lack of sleep makes appetite harder to control","They have no time to cook","Sugar helps them sleep","Sugar is cheaper"],"a":0},{"q":"Which of these is advice from doctors?","o":["Drink coffee at night","Sleep with the lights on","Change bedtime every day","Avoid screens an hour before bed"],"a":3},{"q":"What does the text say about caffeine?","o":["It is always harmful","It replaces sleep","It helps for a while but should be avoided late in the day","It is useful at night"],"a":2}]},{"u":25,"title":"The art of the deal","level":"B2","text":["Professional negotiators often say that the most important part of a deal happens before anyone sits down at the table. Good preparation means knowing exactly what you want, what you would be willing to accept, and what your alternatives are if the talks fail. The last point is called your BATNA, the best alternative to a negotiated agreement. The stronger your alternative, the less desperate you appear, and the more confidently you can negotiate.","Another common mistake is to see negotiation as a battle in which one side wins and the other loses. Experienced negotiators look for solutions that give both parties something valuable. For example, a supplier who cannot lower his price might agree to faster delivery or a longer payment period, which costs him less but is worth a lot to the customer. Finally, they listen more than they talk. Asking questions and staying quiet at the right moment often reveals what the other side really needs, and that information is worth more than any clever argument."],"gloss":[{"en":"negotiator","pt":"negociador"},{"en":"alternative","pt":"alternativa"},{"en":"desperate","pt":"desesperado"},{"en":"supplier","pt":"fornecedor"},{"en":"delivery","pt":"entrega"},{"en":"party","pt":"parte (num acordo)"},{"en":"reveal","pt":"revelar"}],"qs":[{"q":"According to the text, when does the most important part of a negotiation happen?","o":["Before the meeting, during preparation","At the end of the meeting","During lunch","After signing the contract"],"a":0},{"q":"What is a BATNA?","o":["A legal term for payment","The best alternative if the negotiation fails","A type of contract","The first offer"],"a":1},{"q":"Why is a strong alternative useful?","o":["It reduces the price automatically","It makes the other side leave","It ends the talks faster","You seem less desperate and more confident"],"a":3},{"q":"What can a supplier offer when he cannot lower the price?","o":["A bigger discount tomorrow","Faster delivery or longer payment time","A different customer","A refund"],"a":1},{"q":"What do experienced negotiators do a lot?","o":["Avoid silence","Make threats","Listen and ask questions","Talk without stopping"],"a":2}]},{"u":26,"title":"Three seconds to decide","level":"B2","text":["A recent study of online reading habits found that most visitors decide in about three seconds whether to stay on a news page or leave. In that short time, they look at the headline, the picture and the name of the website. Very few read the entire article, and many share a story after reading only the title. Editors know this, and they often write headlines that create curiosity or strong emotion, a technique sometimes called clickbait.","The problem is that the most attractive headline is not always the most accurate. A sentence like 'Scientists say coffee could kill you' might come from a study that found a slightly higher risk in a very small group of people. The article may explain this carefully, but readers who stop at the title go away with the wrong idea. Some newspapers are now testing headlines that are more precise, and a few websites even show a short summary under the title. Whether readers will prefer accuracy to excitement remains to be seen."],"gloss":[{"en":"headline","pt":"manchete"},{"en":"visitor","pt":"visitante"},{"en":"clickbait","pt":"isca de cliques"},{"en":"accurate","pt":"preciso"},{"en":"risk","pt":"risco"},{"en":"precise","pt":"exato"},{"en":"summary","pt":"resumo"}],"qs":[{"q":"What did the study find about online readers?","o":["Most read only advertisements","Most read the whole article","Most decide in about three seconds whether to stay","Most prefer long headlines"],"a":2},{"q":"What do many people do before sharing a story?","o":["Print it","Read only the title","Check three other sources","Call the author"],"a":1},{"q":"What is 'clickbait'?","o":["An advertisement","A reader's comment","A headline designed to create curiosity or emotion","A very accurate summary"],"a":2},{"q":"Why can an attractive headline be a problem?","o":["It is always too long","It costs more money","It hides the author's name","It may not be accurate"],"a":3},{"q":"What are some newspapers trying now?","o":["Longer articles","Deleting headlines","More precise headlines and short summaries","Charging for every click"],"a":2}]},{"u":27,"title":"Slow travel","level":"B2","text":["For years, the tourism industry encouraged people to see as much as possible in as little time as possible: six cities in ten days, three countries in a week. Now a growing number of travellers are choosing the opposite. 'Slow travel' means staying longer in one place, using trains or buses instead of planes, and meeting local people instead of ticking off famous landmarks.","Supporters say it has several advantages. It is usually cheaper, because accommodation costs less when you stay for a week or more, and you spend less on transport. It is also kinder to the environment, since a train journey produces far less carbon than a short flight. Most importantly, they argue that you understand a place better when you shop in its markets, learn a few words of the language and have time to get lost. Critics point out that not everyone has weeks of holiday, and that slow travel can be a luxury. Even so, many people find that a long weekend in one town is more relaxing than a rushed tour."],"gloss":[{"en":"landmark","pt":"ponto turístico"},{"en":"tick off","pt":"marcar (numa lista)"},{"en":"accommodation","pt":"hospedagem"},{"en":"carbon","pt":"carbono"},{"en":"rushed","pt":"apressado"},{"en":"critic","pt":"crítico"},{"en":"luxury","pt":"luxo"}],"qs":[{"q":"What does 'slow travel' mean?","o":["Visiting as many cities as possible","Only travelling by plane","Staying longer in one place and travelling more slowly","Never leaving your country"],"a":2},{"q":"Why can slow travel be cheaper?","o":["Guides are not needed","Planes are cheaper","Accommodation costs less for longer stays","Food is free"],"a":2},{"q":"What is the environmental advantage?","o":["It uses no energy","There are fewer tourists","People walk everywhere","Trains produce much less carbon than short flights"],"a":3},{"q":"What do supporters say you gain from slow travel?","o":["Faster trips","A better understanding of the place","More souvenirs","Lower taxes"],"a":1},{"q":"What do critics say?","o":["It is boring","It is too dangerous","Not everyone has weeks of holiday","It is bad for locals"],"a":2}]},{"u":28,"title":"The smartphone paradox","level":"B2","text":["The smartphone is probably the most useful invention of the last twenty years. It replaces a camera, a map, a diary, a music player and a bank branch, and it fits in your pocket. Yet surveys suggest that many owners feel they are less in control of their time than before they had one. People check their phones an average of more than a hundred times a day, often without any particular reason.","Psychologists explain that apps are designed to be difficult to leave. Notifications, endless scrolling and 'likes' give small rewards at unpredictable moments, which is a powerful way of creating habits. The good news is that the same device can help us break the habit. Most phones now include tools that show how much time you spend on each app and allow you to set limits. Experts also recommend turning off non-essential notifications and keeping the phone out of the bedroom. Technology itself is not the enemy, they say, but we should decide how to use it, instead of letting it decide for us."],"gloss":[{"en":"invention","pt":"invenção"},{"en":"survey","pt":"pesquisa"},{"en":"notification","pt":"notificação"},{"en":"scrolling","pt":"rolagem de tela"},{"en":"reward","pt":"recompensa"},{"en":"limit","pt":"limite"},{"en":"essential","pt":"essencial"}],"qs":[{"q":"What does the text say about the smartphone?","o":["It is useless","It is only for young people","It is very useful but can make us feel less in control of our time","It has replaced all computers"],"a":2},{"q":"How often do people check their phones?","o":["Only at work","More than a hundred times a day on average","Five times a day","Once an hour"],"a":1},{"q":"Why are apps hard to leave?","o":["They are very big","They use bright colours only","They give small rewards at unpredictable moments","They are free"],"a":2},{"q":"What can phone tools do to help?","o":["Block all calls","Delete apps automatically","Increase battery life","Show time per app and set limits"],"a":3},{"q":"What do experts say about technology?","o":["It cannot be controlled","It is the main enemy","We should stop using it","We should decide how to use it"],"a":3}]},{"u":29,"title":"Why meetings take so long","level":"B2","text":["According to a survey of office workers, the average employee spends nearly one-third of the working week in meetings, and a majority say that at least half of that time is wasted. Why do so many meetings fail? The most common reason is the lack of a clear purpose. If nobody knows what decision has to be made, the discussion goes round in circles.","Management experts suggest a few simple rules. First, every meeting should have an agenda sent in advance, with the time allowed for each point. Second, only the people who really need to be there should attend. Third, someone should take brief minutes that list decisions, responsibilities and deadlines. And fourth, if the same topic needs a long discussion every week, perhaps a meeting is not the right tool, and a short email or a shared document would do the job better. Companies that applied these rules reported that their meetings became about 25 per cent shorter, and that employees felt more productive."],"gloss":[{"en":"survey","pt":"pesquisa"},{"en":"purpose","pt":"propósito"},{"en":"agenda","pt":"pauta"},{"en":"minutes","pt":"ata"},{"en":"attend","pt":"comparecer"},{"en":"deadline","pt":"prazo"},{"en":"productive","pt":"produtivo"}],"qs":[{"q":"How much of the week do employees spend in meetings, on average?","o":["Almost none","Nearly one-third","One-tenth","Half"],"a":1},{"q":"What is the most common reason meetings fail?","o":["No clear purpose","Bad coffee","Too few people","Too many emails"],"a":0},{"q":"What should be sent before a meeting?","o":["A list of complaints","An agenda","The minutes","A budget"],"a":1},{"q":"What should the minutes include?","o":["Personal opinions","Every word that was said","Decisions, responsibilities and deadlines","Only the date"],"a":2},{"q":"What happened in companies that applied the rules?","o":["Meetings were about 25 per cent shorter","Employees worked fewer hours","Meetings disappeared","Salaries rose"],"a":0}]},{"u":30,"title":"Why we love sad songs","level":"B2","text":["It seems strange that people choose to listen to sad music when they are already unhappy. Surely it would be better to listen to something cheerful? Researchers who have studied this question found that the answer depends on what the music does for us. Sad songs can act as a kind of company. When we hear a singer expressing feelings similar to our own, we feel that someone understands us, and we feel less alone.","There is also a physical explanation. Some people experience a pleasant mixture of sadness and comfort, and the brain releases a hormone linked to relaxation and calm. Interestingly, the effect is not the same for everyone. People who are naturally empathetic, or who enjoy art and literature, tend to be moved more strongly. Others find sad music simply depressing. The researchers conclude that music works like a mirror: it does not create our emotions, but it helps us understand and accept them, which is perhaps why a good song can feel like a conversation with a friend."],"gloss":[{"en":"cheerful","pt":"alegre"},{"en":"express","pt":"expressar"},{"en":"hormone","pt":"hormônio"},{"en":"calm","pt":"calma"},{"en":"empathetic","pt":"empático"},{"en":"mirror","pt":"espelho"},{"en":"accept","pt":"aceitar"}],"qs":[{"q":"What question do the researchers ask?","o":["Why singers write songs","Why radio is popular","Why music is so expensive","Why people listen to sad music when they are sad"],"a":3},{"q":"How can sad songs act as company?","o":["Singers express feelings similar to ours, so we feel understood","They make us dance","They tell jokes","They teach us to sing"],"a":0},{"q":"What physical effect is mentioned?","o":["A faster heartbeat only","Better eyesight","A hormone linked to relaxation and calm","A loss of memory"],"a":2},{"q":"Who tends to be moved most strongly?","o":["Empathetic people and people who enjoy art","Only musicians","Children","People who dislike music"],"a":0},{"q":"What do the researchers compare music to?","o":["A mirror","A medicine","A clock","A map"],"a":0}]},{"u":31,"title":"The generosity effect","level":"B2","text":["Common sense says that money buys happiness only up to a point. But what happens when we spend it on others? In a famous experiment, researchers gave volunteers an envelope with a small amount of money. Half were told to spend it on themselves before the evening, and the others were told to spend it on someone else. At the end of the day, the second group reported feeling significantly happier, even though the amounts were identical.","Similar results have been found in many countries, rich and poor. Giving seems to create a sense of connection and purpose. It does not have to be money: donating time, giving advice or helping a neighbour has a similar effect. However, researchers warn that generosity must feel voluntary. People who give because of pressure, or only to be admired, do not enjoy the same benefits. They also found that seeing the result of the help, for example meeting the person who benefited, makes the effect stronger."],"gloss":[{"en":"generosity","pt":"generosidade"},{"en":"envelope","pt":"envelope"},{"en":"identical","pt":"idêntico"},{"en":"connection","pt":"conexão"},{"en":"purpose","pt":"propósito"},{"en":"donate","pt":"doar"},{"en":"voluntary","pt":"voluntário"}],"qs":[{"q":"What did the researchers ask half of the volunteers to do?","o":["Spend the money on someone else","Return the money","Save the money","Keep the money"],"a":0},{"q":"What was the result?","o":["Those who gave felt happier","Nobody was affected","Those who kept it felt happier","The amounts were different"],"a":0},{"q":"What do the results suggest about different countries?","o":["Similar results appeared in rich and poor countries","No other country was studied","Only poor countries were affected","Only rich countries were affected"],"a":0},{"q":"What other kinds of giving have a similar effect?","o":["Time, advice or help to a neighbour","Only expensive gifts","Only donations to banks","Only gifts to relatives"],"a":0},{"q":"What do the researchers warn about?","o":["Giving is dangerous","Generosity must feel voluntary","People must always be admired","Money is not important"],"a":1}]},{"u":32,"title":"The myth of the overnight success","level":"B2","text":["We love stories about people who become famous 'overnight'. A singer appears on television, a young entrepreneur sells his company for millions, an unknown writer wins a prestigious prize. What these stories rarely mention are the years of work that came before. Most so-called overnight successes spent a decade or more learning their craft, failing, and trying again.","Researchers who study high achievers have found that talent matters less than persistence and deliberate practice, which means working on exactly the things you find difficult, with feedback from someone more experienced. Another common factor is the ability to recover from setbacks. Successful people are rarely those who never fail, but those who treat failure as information. They ask what went wrong, adjust their approach and continue. This is encouraging, because it suggests that success is not reserved for a lucky few, but depends largely on habits that almost anyone can develop."],"gloss":[{"en":"overnight","pt":"da noite para o dia"},{"en":"prestigious","pt":"prestigiado"},{"en":"craft","pt":"ofício"},{"en":"persistence","pt":"persistência"},{"en":"deliberate","pt":"deliberada"},{"en":"setback","pt":"contratempo"},{"en":"adjust","pt":"ajustar"}],"qs":[{"q":"What do stories about overnight success usually leave out?","o":["The years of work before","The date","The prize money","The name of the winner"],"a":0},{"q":"How long did most 'overnight successes' work on their craft?","o":["A decade or more","One year","A few weeks","They did not work"],"a":0},{"q":"What matters more than talent, according to researchers?","o":["Persistence and deliberate practice","Luck","Money","Having a famous family"],"a":0},{"q":"What is 'deliberate practice'?","o":["Practising only what you enjoy","Reading about success","Working on difficult things with feedback","Practising without a plan"],"a":2},{"q":"How do successful people treat failure?","o":["As someone else's fault","As a secret","As a reason to stop","As information"],"a":3}]}],"WR":[{"u":1,"kind":"E-mail","title":"Convidar um amigo para jantar","sit":"Your English friend Sam is visiting your city. Write an email to invite Sam to dinner at your home.","pts":["Say when and what time the dinner is.","Say what you usually cook on weekends and what you are cooking this time.","Ask if Sam eats any special food."],"min":70,"max":110,"use":"Present simple (hábitos) e present continuous (o que está acontecendo ou planejado).","phr":[{"en":"I would like to invite you to…","pt":"Eu gostaria de convidar você para…"},{"en":"I usually…","pt":"Eu costumo…"},{"en":"This time I am cooking…","pt":"Desta vez eu vou cozinhar…"},{"en":"Do you eat…?","pt":"Você come…?"},{"en":"Let me know.","pt":"Me avise."}]},{"u":2,"kind":"E-mail","title":"Recusar um convite e sugerir outro dia","sit":"Your friend Lisa has invited you to a family party on Saturday, but you cannot go. Write a reply.","pts":["Thank Lisa and say why you cannot come.","Say what you are going to do on Saturday.","Suggest another day and say what you will bring."],"min":70,"max":110,"use":"Formas de futuro: present continuous (planos marcados), going to (intenções) e will (decisões na hora).","phr":[{"en":"Thanks so much for inviting me.","pt":"Muito obrigado por me convidar."},{"en":"I'm afraid I can't…","pt":"Infelizmente não posso…"},{"en":"I'm going to…","pt":"Eu vou…"},{"en":"How about…?","pt":"Que tal…?"},{"en":"I'll bring…","pt":"Eu levo…"}]},{"u":3,"kind":"E-mail","title":"O que você fez para economizar","sit":"A friend asks how you are saving money this year. Write an email to answer.","pts":["Say what you have stopped doing.","Say how much you have saved and when you started.","Say what you will buy with the money."],"min":70,"max":110,"use":"Present perfect (resultado até agora) e past simple (quando aconteceu).","phr":[{"en":"I have saved…","pt":"Eu o de artigos (a, the, nenhum artigo).","phr":[{"en":"People often say that…","pt":"As pessoas costumam dizer que…"},{"en":"Young people tend to…","pt":"Os jovens tendem a…"},{"en":"The elderly…","pt":"Os idosos…"},{"en":"For example, my…","pt":"Por exemplo, meu/minha…"},{"en":"In my experience,","pt":"Pela minha experiência,"}]},{"u":7,"kind":"E-mail","title":"Regras para um novo colega","sit":"A new colleague is starting at your workplace next week. Write an email explaining how things work.","pts":["Say what time the colleague has to arrive and what is not allowed.","Say one thing that is not necessary.","Give one piece of advice."],"min":80,"max":120,"use":"Have to / must (obrigação), mustn't (proibição), don't have to (não é necessário) e should (conselho).","phr":[{"en":"You have to…","pt":"Você tem que…"},{"en":"You mustn't…","pt":"Você não pode…"},{"en":"You don't have to…","pt":"Você não precisa…"},{"en":"You should…","pt":"Você deveria…"},{"en":"Welcome to the team!","pt":"Bem-vindo à equipe!"}]},{"u":8,"kind":"Texto curto","title":"O que você sabe fazer","sit":"Write a short text about your abilities for a language exchange website.","pts":["Say two things you can do well.","Say one thing you could not do as a child but can do now.","Say one thing you would like to be able to do next year."],"min":70,"max":110,"use":"Can / can't, could / couldn't e be able to.","phr":[{"en":"I can…","pt":"Eu consigo…"},{"en":"I couldn't … when I was a child.","pt":"Eu não conseguia … quando era criança."},{"en":"I'm able to…","pt":"Eu sou capaz de…"},{"en":"I'd like to be able to…","pt":"Eu gostaria de conseguir…"},{"en":"I'm good at…","pt":"Sou bom em…"}]},{"u":9,"kind":"História","title":"Uma noite chuvosa","sit":"Write a story. Your story must begin with this sentence: \"It was a rainy night when the phone rang.\"","pts":["Say who was calling and what the person said.","Say what you were doing before and what you did after.","Finish the story."],"min":90,"max":130,"use":"Past simple (ações), past continuous (cenário) e past perfect (o que já tinha acontecido antes).","phr":[{"en":"While I was…, the phone rang.","pt":"Enquanto eu…, o telefone tocou."},{"en":"Suddenly,","pt":"De repente,"},{"en":"Before that, I had…","pt":"Antes disso, eu tinha…"},{"en":"In the end,","pt":"No final,"},{"en":"As soon as…","pt":"Assim que…"}]},{"u":10,"kind":"Carta","title":"Como eram as coisas na infância","sit":"Write a letter to a friend about your childhood and how your life has changed.","pts":["Say where you used to live and what you used to play.","Say one thing you would do every summer.","Say one habit that you no longer have."],"min":80,"max":120,"use":"Used to e would para hábitos do passado (would só para ações, não para estados).","phr":[{"en":"I used to…","pt":"Eu costumava…"},{"en":"Every summer we would…","pt":"Todo verão nós…"},{"en":"I didn't use to…","pt":"Eu não costumava…"},{"en":"Things have changed.","pt":"As coisas mudaram."},{"en":"I miss those days.","pt":"Tenho saudade daqueles dias."}]},{"u":11,"kind":"Resenha","title":"Resenha de um filme","sit":"Write a review of a film you have seen, for a website.","pts":["Say the name of the film and what it is about.","Say who directed it and where it was filmed.","Say what you liked and if you recommend it."],"min":90,"max":140,"use":"Voz passiva (was directed by, was filmed in, was written by).","phr":[{"en":"The film was directed by…","pt":"O filme foi dirigido por…"},{"en":"It was filmed in…","pt":"Foi filmado em…"},{"en":"It's about…","pt":"Fala sobre…"},{"en":"I would recommend it because…","pt":"Eu recomendo porque…"},{"en":"The best part was…","pt":"A melhor parte foi…"}]},{"u":12,"kind":"Descrição","title":"Descrever uma foto","sit":"Write a short description of a photo of a person in your family.","pts":["Say who is in the photo and what the person looks like.","Say what you think the person is doing or thinking.","Say when the photo might have been taken."],"min":80,"max":120,"use":"Dedução com must (certeza), might/may/could (possibilidade) e can't (impossível).","phr":[{"en":"He must be…","pt":"Ele deve ser…"},{"en":"She might be…","pt":"Ela talvez esteja…"},{"en":"It can't be…","pt":"Não pode ser…"},{"en":"He looks…","pt":"Ele parece…"},{"en":"I think it was taken…","pt":"Acho que foi tirada…"}]},{"u":13,"kind":"E-mail","title":"Pedir informações sobre um curso","sit":"You want to join an English course abroad. Write an email to the school.","pts":["Ask when the course starts and how long it lasts.","Ask about the price and what happens if you pay early.","Say what you will do as soon as you get an answer."],"min":80,"max":120,"use":"First conditional (if + presente, will) e time clauses (when, as soon as, before, after).","phr":[{"en":"I would like some information about…","pt":"Eu gostaria de informações sobre…"},{"en":"If I register now, will…?","pt":"Se eu me inscrever agora, vai…?"},{"en":"As soon as I hear from you,","pt":"Assim que eu tiver notícias suas,"},{"en":"Could you tell me…?","pt":"Você poderia me dizer…?"},{"en":"I look forward to your reply.","pt":"Aguardo a sua resposta."}]},{"u":14,"kind":"E-mail","title":"E-mail de reclamação","sit":"You rent a flat and the heating has not worked for a week. Write an email to the landlord.","pts":["Explain the problem and how long it has lasted.","Say what you would like the landlord to do.","Say what you would do if the problem continued."],"min":90,"max":130,"use":"Second conditional (if + passado, would) para situações hipotéticas.","phr":[{"en":"I'm writing to complain about…","pt":"Escrevo para reclamar de…"},{"en":"If you could fix it…,","pt":"Se você pudesse consertar…,"},{"en":"I would be very grateful if…","pt":"Eu ficaria muito grato se…"},{"en":"If it continued, I would…","pt":"Se continuar, eu…"},{"en":"I hope to hear from you soon.","pt":"Espero notícias suas em breve."}]},{"u":15,"kind":"E-mail","title":"Candidatar-se a uma vaga","sit":"You saw a job advert for an assistant at a travel agency. Write an email to apply.","pts":["Say which job you are applying for and why you are interested.","Say what you enjoy doing and what you are good at.","Say that you can come for an interview."],"min":90,"max":130,"use":"Gerúndio (enjoy working, good at solving) e infinitivo (want to work, decided to apply).","phr":[{"en":"I'm writing to apply for…","pt":"Escrevo para me candidatar a…"},{"en":"I enjoy working with…","pt":"Gosto de trabalhar com…"},{"en":"I'm good at…","pt":"Sou bom em…"},{"en":"I'd like to…","pt":"Eu gostaria de…"},{"en":"I'm available for an interview.","pt":"Estou disponível para entrevista."}]},{"u":16,"kind":"Relato","title":"Contar o que o atendente disse","sit":"Read the conversation in a shop. Then write what happened in reported speech. Assistant: \"I'm sorry, we don't have this size.\" You: \"Can you order it for me?\" Assistant: \"Yes, it will arrive on Friday.\"","pts":["Say what the assistant told you.","Say what you asked.","Say what the assistant answered."],"min":60,"max":100,"use":"Reported speech: troque o tempo (will → would, don't → didn't) e os pronomes. Use said, told, asked.","phr":[{"en":"The assistant told me that…","pt":"O atendente me disse que…"},{"en":"I asked if she could…","pt":"Perguntei se ela poderia…"},{"en":"She said it would…","pt":"Ela disse que ia…"},{"en":"She explained that…","pt":"Ela explicou que…"},{"en":"In the end,","pt":"No final,"}]},{"u":17,"kind":"História","title":"Um dia de sorte","sit":"Write a story called \"The luckiest day of my life\".","pts":["Say what almost went wrong.","Say what would have happened if things had been different.","Say how the day ended."],"min":90,"max":140,"use":"Third conditional (if + past perfect, would have + particípio) para o que não aconteceu.","phr":[{"en":"If I hadn't…, I would have…","pt":"Se eu não tivesse…, eu teria…"},{"en":"I was so lucky that…","pt":"Tive tanta sorte que…"},{"en":"It could have been worse.","pt":"Poderia ter sido pior."},{"en":"Luckily,","pt":"Felizmente,"},{"en":"I wish I had…","pt":"Quem me dera ter…"}]},{"u":18,"kind":"Ensaio","title":"Tecnologia: prós e contras","sit":"Your teacher has asked you to write an essay: \"Technology makes our lives easier. Do you agree?\" Write your essay and give your opinion.","pts":["Write about work and study.","Write about relationships and free time.","Add one idea of your own and give your opinion."],"min":130,"max":190,"use":"Quantificadores (a lot of, many, much, a few, a little, enough) e conectores (however, moreover, on the other hand, in conclusion).","phr":[{"en":"On the one hand,… on the other hand,…","pt":"Por um lado,… por outro,…"},{"en":"Moreover,","pt":"Além disso,"},{"en":"However,","pt":"No entanto,"},{"en":"There are many/a few…","pt":"Há muitos/poucos…"},{"en":"In conclusion, I believe…","pt":"Em conclusão, acredito que…"}]},{"u":19,"kind":"Artigo","title":"Uma pessoa que você admira","sit":"Write an article for a magazine about a person you admire.","pts":["Say who the person is and how you know him or her.","Say what makes this person special.","Say what you have learned from this person."],"min":90,"max":140,"use":"Relative clauses com who, which, that, whose e where.","phr":[{"en":"The person who I admire most is…","pt":"A pessoa que eu mais admiro é…"},{"en":"She is someone who…","pt":"Ela é alguém que…"},{"en":"…whose ideas…","pt":"…cujas ideias…"},{"en":"This is the place where…","pt":"Este é o lugar onde…"},{"en":"What I admire most is…","pt":"O que mais admiro é…"}]},{"u":20,"kind":"Depoimento","title":"Depoimento para a polícia","sit":"You saw a robbery in a shop yesterday evening. Write a short statement for the police.","pts":["Say what time and where it happened.","Describe the person you saw and what the person did.","Say what you did after and ask the police a question using a question tag."],"min":90,"max":140,"use":"Past simple e past continuous, descrições de pessoas e question tags (isn't it?, didn't async function wrSend(){
  var s=S.ex,ta=document.getElementById('wrin');if(!s||s.k!=='wr'||s.busy||!S.sample||!ta)return;
  var it=exItem('wr',s.u),text=(ta.value||'').trim();

  S.drafts['wr'+s.u]=text;ta.blur();s.busy=true;s.err='';s.ctl=new AbortController();render();
  var lv=s.u>=23?'B2':s.u<=10?'B1':'B1+';
  try{
    var r=await S.sample([{role:'user',content:wrPrompt(it,text,lv)}],{cache:false,modelTier:'quick',signal:s.ctl.signal});
    var t=String(r.text||''),a=t.indexOf('{'),b=t.lastIndexOf('}'),o=null;
    try{o=JSON.parse(t.slice(a,b+1));}catch(e){o=null;}
    var nr=o&&tryReport(t.slice(a,b+1));

    var rep=normReport(nr);rep.corrigido=String(nr.texto_corrigido||'').slice(0,1500);rep.dica=String(nr.dica||'').slice(0,300);
    var cob=Number(nr.pontos_cobertos);rep.cob=isNaN(cob)?null:Math.max(0,Math.min(3,Math.round(cob)));
    var d={kind:'writing',u:s.u,text:text,rep:rep,at:Date.now()};
    saveQ('w'+pad(s.u),d);exSaveRes('wr',s.u,rep.nota);
    var t0=today();
    rep.erros.forEach(function(e){
      var id='e'+hash(norm(e.escrito)+'|'+norm(e.correto)),old=S.docs.get(id),dd;
      if(old&&old.kind==='error')dd=Object.assign({},old,{count:(old.count||1)+1,streak:0,status:'active',due:addDays(t0,1),why:e.explicacao||old.why,at:Date.now()});
      else dd={kind:'error',unit:s.u,lesson:2,category:e.categoria,point:e.ponto,written:e.escrito,correct:e.correto,why:e.explicacao,count:1,streak:0,status:'active',due:addDays(t0,1),created:Date.now(),at:Date.now()};
      saveQ(id,dd);
    });
    s.busy=false;s.res=d;
  }catch(e){
    s.busy=false;s.err=(e&&e.code==='format')?'Não consegui ler a correção. Tente enviar de novo.':(e&&e.code==='cancelled')?'':chatErr(e&&e.code);
  }
  if(S.ex===s)render();
}

var VINT=[1,2,4,8,16,32,64];
var VPOS={n:'substantivo',v:'verbo',adj:'adjetivo',adv:'advérbio',phr:'phrasal verb',exp:'expressão'};
function vocDoc(){return S.docs.get('voc')||{kind:'voc',w:{}};}
function vcWord(id){var p=String(id).split('.'),u=+p[0],i=+p[1],r=VOC[u-1]&&VOC[u-1][i];return r?{id:id,u:u,w:r[0],pos:r[1],pt:r[2],ex:r[3]}:null;}
function vcCount(u){return VOC[u-1]?VOC[u-1].length:0;}
function vcLearned(u){var w=vocDoc().w,c=0,n=vcCount(u);for(var i=0;i<n;i++){var r=w[u+'.'+i];if(r&&r.b>=3)c++;}return c;}
function vcGoal(u){return Math.ceil(vcCount(u)*0.8);}
function vcStatus(id){var r=vocDoc().w[id];return !r?'nova':r.b>=3?'aprendida':'em estudo';}
function vcDueList(){var w=vocDoc().w,t=today();return Object.keys(w).filter(function(k){var r=w[k];return r&&r.d&&r.d<=t&&vcWord(k);}).sort(function(a,b){return w[a].d<w[b].d?-1:w[a].d>w[b].d?1:0;});}
function vcAll(){if(!vcAll.c){vcAll.c=[];for(var u=1;u<=VOC.length;u++)for(var i=0;i<VOC[u-1].length;i++)vcAll.c.push(vcWord(u+'.'+i));}return vcAll.c;}
function vcTok(pt){return String(pt).toLowerCase().replace(/\(.*?\)/g,'').split(/[,;]/).map(function(x){return x.trim();}).filter(Boolean);}
function vcDistract(wd,field){
  var tk=vcTok(wd.pt),pool=vcAll().filter(function(x){
    if(x.id===wd.id||x.w.toLowerCase()===wd.w.toLowerCase()||x.pt===wd.pt)return false;
    return !vcTok(x.pt).some(function(t){return tk.indexOf(t)>=0;});
  });
  var same=shuffle(pool.filter(function(x){return x.pos===wd.pos;})),other=shuffle(pool.filter(function(x){return x.pos!==wd.pos;})),out=[],seen={};
  seen[wd[field]]=1;
  same.concat(other).forEach(function(x){if(out.length<3&&!seen[x[field]]){seen[x[field]]=1;out.push(x);}});
  return out;
}
function vcRe(w){return new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');}
function vcMake(ids){
  return ids.map(function(id,idx){
    var wd=vcWord(id),kind=['en','pt','cl'][idx%3];
    if(kind==='cl'&&!vcRe(wd.w).test(wd.ex))kind='en';
    var field=kind==='en'?'pt':'w',o=shuffle([wd].concat(vcDistract(wd,field)));
    return {id:id,kind:kind,o:o.map(function(x){return x[field];}),a:o.indexOf(wd)};
  });
}
function vcPickUnit(u){
  var w=vocDoc().w,n=vcCount(u),t=today(),due=[],fresh=[],rest=[];
  for(var i=0;i<n;i++){var id=u+'.'+i,r=w[id];if(!r)fresh.push(id);else if(r.d<=t)due.push(id);else rest.push(id);}
  rest.sort(function(a,b){return w[a].b-w[b].b;});
  return shuffle(due.concat(fresh,rest).slice(0,10));
}
function vcPickRev(){return shuffle(vcDueList().slice(0,10));}
function vcOpen(u,from){try{window.speechSynthesis.cancel();}catch(e){}S.vc={from:from==null?null:from,u:u,qs:null};render();}
function vcBegin(ids){
  var s=S.vc;if(!ids.length){flash('Nenhuma palavra para rever agora.');return;}
  s.qs=vcMake(ids);s.i=0;s.sel=null;s.ok=0;s.miss=[];s.done=false;render();window.scrollTo(0,0);
}
function vcGo(){var s=S.vc;if(s)vcBegin(s.u===-1?vcPickCls(s.cls):s.u?vcPickUnit(s.u):vcPickRev());}
function vcRev(from){S.vc={from:from==null?null:from,u:0,qs:null};vcBegin(vcPickRev());}
function vcBack(){S.vc=null;try{window.speechSynthesis.cancel();}catch(e){}render();window.scrollTo(0,0);}
function vcAnswer(k){
  var s=S.vc;if(!s||!s.qs||s.done||s.sel!=null)return;
  var q=s.qs[s.i],okk=k===q.a,w=Object.assign({},vocDoc().w),r=w[q.id],t=today(),b,d;
  s.sel=k;
  if(okk){
    if(!r){b=1;d=addDays(t,VINT[1]);}
    else if(r.d>t){b=r.b;d=r.d;}
    else{b=Math.min(6,r.b+1);d=addDays(t,VINT[b]);}
    s.ok++;
  }else{b=0;d=addDays(t,1);s.miss.push(q.id);}
  w[q.id]={b:b,d:d,n:(r?r.n:0)+1};
  saveQ('voc',{kind:'voc',w:w,at:Date.now()});
  render();
}
function vcNext(){
  var s=S.vc;if(!s||s.sel==null)return;
  s.i++;s.sel=null;
  if(s.i>=s.qs.length){s.done=true;bump();}
  render();window.scrollTo(0,0);
}
function vcClear(n){
  var doc=vocDoc(),w=Object.assign({},doc.w),ch=false;
  Object.keys(w).forEach(function(k){if(k.indexOf(n+'.')===0){delete w[k];ch=true;}});
  if(ch)saveQ('voc',{kind:'voc',w:w,at:Date.now()});
}
function vcBackLabel(s){return s.from==='rev'?' Revisão':s.from!=null?' Unidade '+dn(s.from):' Treino';}
function vcBar(a,b){return '<div style="height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0"><div style="height:100%;width:'+Math.round(100*a/Math.max(1,b))+'%;background:var(--accent)"></div></div>';}
function vcScreen(){var s=S.vc;return !s.qs?(s.u===-1?vcClsList():vcList()):s.done?vcDone():vcQuiz();}
function vcListOld(){
  var s=S.vc,u=s.u,n=vcCount(u),L=vcLearned(u),U=UNITS[u-1],w=vocDoc().w,items=VOC[u-1];
  var h='<header><button class="btn ghost" data-act="vcback">'+ic(I.back,18)+vcBackLabel(s)+'</button><div class="eyebrow" style="margin-top:8px">Unidade '+dn(u)+' · Palavras</div><h2>'+n+' palavras: '+esc(U.title)+'</h2></header>';
  h+='<section class="card"><p class="small"><strong class="num">'+L+' de '+n+'</strong> aprendidas. Uma palavra conta como aprendida depois de 3 acertos em dias diferentes. As que você erra voltam no dia seguinte.</p>'+vcBar(L,n)+'<button class="btn primary" data-act="vcgo">Praticar 10 palavras</button></section>';
  h+='<section class="card"><div class="list">'+items.map(function(r,i){
    var id=u+'.'+i,st=vcStatus(id);
    return '<div style="padding:10px 0;'+(i?'border-top:1px solid var(--line)':'')+'"><div class="row" style="align-items:center"><span class="grow"><strong>'+esc(r[0])+'</strong> <span class="small muted">'+(VPOS[r[1]]||r[1])+'</span></span><span class="chip'+(st==='aprendida'?' ok':'')+'">'+st+'</span>'+sayBtnM(r[0])+'</div><div>'+esc(r[2])+'</div><div class="row" style="align-items:center"><span class="grow small muted"><em>'+esc(r[3])+'</em></span>'+sayBtnM(r[3])+'</div></div>';
  }).join('')+'</div></section>';
  return h;
}
function vcQuiz(){
  var s=S.vc,q=s.qs[s.i],wd=vcWord(q.id),h='';
  h+='<header><button class="btn ghost" data-act="vcback">'+ic(I.back,18)+vcBackLabel(s)+'</button><div class="eyebrow" style="margin-top:8px">'+vcHdr(s)+'Palavras</div><h2 class="num">Pergunta '+(s.i+1)+' de '+s.qs.length+'</h2>'+vcBar(s.i+(s.sel!=null?1:0),s.qs.length)+'</header>';
  var prompt;
  if(q.kind==='en')prompt='<p class="small muted">O que significa?</p><p style="font-size:22px;margin:6px 0">'+emoW(wd.w)+'<strong>'+esc(wd.w)+'</strong> '+sayBtn(wd.w)+'</p>';
  else if(q.kind==='pt')prompt='<p class="small muted">Como se diz em inglês?</p><p style="font-size:22px;margin:6px 0"><strong>'+esc(wd.pt)+'</strong></p>';
  else prompt='<p class="small muted">Complete a frase:</p><p style="font-size:18px;margin:6px 0">'+esc(wd.ex.replace(vcRe(wd.w),'_____'))+'</p><p class="small muted">Dica: '+esc(wd.pt)+'</p>';
  h+='<section class="card">'+prompt+'<div class="list" style="margin-top:10px">'+q.o.map(function(o,k){
    var cls='opt';if(s.sel!=null)cls='opt'+(k===q.a?' right':k===s.sel?' wrong':'');
    return '<button class="'+cls+'" data-act="vcopt" data-k="'+k+'"'+(s.sel!=null?' disabled':'')+'>'+esc(o)+(s.sel!=null&&k===q.a?' ✓':'')+'</button>';

  if(s.sel!=null){
    var okk=s.sel===q.a;
    h+='<div class="'+(okk?'okbox':'warnbox')+'"><strong>'+(okk?'Certo!':'Não foi dessa vez.')+'</strong><div>'+emoW(wd.w)+'<strong>'+esc(wd.w)+'</strong> = '+esc(wd.pt)+'</div><div class="row" style="align-items:center"><span class="grow small"><em>'+esc(wd.ex)+'</em></span>'+sayBtnM(wd.ex)+'</div></div>';
    h+='<button class="btn primary" data-act="vcnext">'+(s.i+1>=s.qs.length?'Ver resultado':'Próxima')+'</button>';

}
function vcDone(){
  var s=S.vc,n=s.qs.length,h='<header><button class="btn ghost" data-act="vcback">'+ic(I.back,18)+vcBackLabel(s)+'</button><div class="eyebrow" style="margin-top:8px">'+vcHdr(s)+'Palavras</div><h2>Resultado</h2></header>';
  h+='<div class="'+(s.ok>=Math.ceil(n*0.8)?'okbox':'warnbox')+'"><strong class="num">'+s.ok+' de '+n+' certas.</strong>'+(s.miss.length?'<p class="small">As erradas voltam amanhã.</p>':'')+'</div>';
  if(s.miss.length)h+='<section class="card"><h3>Para fixar</h3><div class="list">'+s.miss.map(function(id){var x=vcWord(id);return '<div class="row" style="align-items:center"><span class="grow">'+emoW(x.w)+'<strong>'+esc(x.w)+'</strong> = '+esc(x.pt)+'</span>'+sayBtnM(x.w)+'</div>';}).join('')+'</div></section>';
  var more=s.u?true:vcDueList().length>0;
  h+='<div class="row" style="flex-wrap:wrap">'+(more?'<button class="btn" data-act="vcagain">'+(s.u?'Praticar mais 10':'Rever mais palavras')+'</button>':'')+'<button class="btn ghost" data-act="vcback">Voltar</button></div>';

function vcReviewCard(){
  var due=vcDueList(),seen=Object.keys(vocDoc().w).length;

function vcMenu(){
  var due=vcDueList(),tot=0,lrn=0,h='<h2 style="padding-top:8px">Palavras</h2>';

function vcUnitRow(n){
  if(!VOC[n-1]||!VOC[n-1].length)return '';

}
