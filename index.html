tell you about the worst customer service experience of my life. Two months ago I ordered a sofa online. The company promised to deliver it within ten days, and they told me they would call me the day before to confirm the time."},{"s":0,"t":"Nobody called. On the delivery day I waited at home from eight in the morning until six in the evening, and the sofa never arrived. When I phoned the company, the woman said that she was very sorry, but that there had been a problem with the lorry, and that the driver would come the following day. I asked her if they would send me a message to confirm that, and she said they would. They didn't."},{"s":0,"t":"The next day a man arrived with the sofa, but the box was damaged, and when we opened it, one of the legs was broken. The driver told me that it wasn't his job to check the furniture, and that I would have to contact the shop. I explained that I had taken a day off work for the second time. He just shrugged and said that he had other deliveries to make."},{"s":0,"t":"I called the company again. This time I asked to speak to a manager. The man on the phone said that no manager was available, but that somebody would call me back within two hours. I told him that I would wait, and I wrote down his name and the time of the call."},{"s":0,"t":"Nobody phoned. So I wrote a long, calm email, explaining everything in order: the missed delivery, the broken leg, the three phone calls, and the names of the people I had spoken to. I said that I wanted a replacement leg, a refund of the delivery fee, and an apology. And I added that, if I didn't receive an answer in five working days, I would make a complaint to the consumer authority."},{"s":0,"t":"The reply came the next morning. A manager apologised, said that the company would send the leg within three days, and promised to return the delivery fee. They even offered a small discount on my next purchase."},{"s":0,"t":"What did I learn? That being angry on the phone doesn't help, but writing a clear message with dates and names does. Companies take a written complaint seriously, because it leaves a record. And never accept a promise unless it is in writing."}],"qs":[{"q":"What was Helen promised when she ordered the sofa?","o":["A visit from a manager","A free sofa cover","Delivery within ten days and a call the day before","Delivery the next day"],"a":2,"e":"Prometeram entrega em dez dias e uma ligação no dia anterior."},{"q":"What reason did the woman on the phone give for the missed delivery?","o":["The address was wrong","The driver was ill","There was a problem with the lorry","The sofa was out of stock"],"a":2,"e":"Ela falou de um problema com o caminhão."},{"q":"What was wrong with the sofa when it arrived?","o":["The box was damaged and one leg was broken","It was too big for the room","It was missing the cushions","The sofa was the wrong colour"],"a":0,"e":"A caixa estava danificada e um dos pés estava quebrado."},{"q":"How did the delivery driver react to the problem?","o":["He called a manager","He offered to take it back","He apologised several times","He said it was not his job to check the furniture"],"a":3,"e":"Ele disse que não era trabalho dele verificar os móveis."},{"q":"What did Helen include in her email?","o":["A list of events with dates and names, and a deadline","Only a complaint about the driver","A request for a bigger sofa","A photo of the damaged box only"],"a":0,"e":"Ela explicou tudo em ordem, com nomes e datas, e deu prazo de cinco dias úteis."},{"q":"What is Helen's main advice?","o":["Accept the first offer","Write a clear complaint and get promises in writing","Never buy furniture online","Always call and shout"],"a":1,"e":"Ela diz que raiva ao telefone não ajuda, mas uma mensagem clara com datas e nomes sim."}]},{"id":"privacy","u":18,"title":"Social media and privacy","level":"B2","about":"Entrevista sobre quanto de nossas informações pessoais as redes sociais guardam.","spk":[{"name":"Host","lang":"US","acc":"americano"},{"name":"Meera","lang":"IN","acc":"indiana"}],"lines":[{"s":0,"t":"Today on Tech Talk, we're asking a question that many of us avoid: how much does social media really know about us? My guest is Meera Shah, who works in data protection. Meera, where do we start?"},{"s":1,"t":"With a surprise. Most people think the platforms only know what they publish, like photos and comments. In reality, they also collect what you look at, how long you look at it, where you are, which devices you use, and even how fast you scroll. Very little of that information is visible to you."},{"s":0,"t":"Why do they want all of that?"},{"s":1,"t":"Because it allows them to predict your behaviour and to sell advertising very precisely. If a company knows that you've been reading about running shoes for three nights, it can show you an advert at exactly the moment you are ready to buy. For the platform, your attention is the product."},{"s":0,"t":"Is that illegal?"},{"s":1,"t":"Usually not, provided that users have given their consent. The problem is how that consent is obtained. Long documents, written in complicated language, with a button that says accept. Very few people read them, and, honestly, if you refuse, you often can't use the service at all."},{"s":0,"t":"What can an ordinary person do?"},{"s":1,"t":"There are several simple steps. First, check your privacy settings. By default, many accounts are more public than people want. Second, limit the permissions you give to apps. Does a game really need access to your microphone and your contacts? Third, use different passwords for different services, with a password manager if necessary, so that one leak doesn't open every door."},{"s":0,"t":"And what about children?"},{"s":1,"t":"That's the area where I'm most worried. Children don't understand that something posted today may still exist in twenty years. Parents should talk to them early, and also think about what they publish about their children, because those photos create a digital identity before the child can decide anything."},{"s":0,"t":"Are you optimistic about the future?"},{"s":1,"t":"Cautiously. New laws in Europe and in other countries now give people the right to see and delete their data. Companies are beginning to take it seriously, partly because they have been fined. But the best protection is still an informed user who asks one simple question before every click: what am I giving in exchange for this?"},{"s":0,"t":"Meera, that's a great note to end on. Thank you."}],"qs":[{"q":"What does Meera say about the information platforms collect?","o":["They collect much more than what users publish","They only keep photos and comments","They delete everything after a week","They share it with users every month"],"a":0,"e":"Coletam o que você olha, quanto tempo, onde está, dispositivos e até a velocidade de rolagem."},{"q":"Why do platforms collect this data?","o":["To predict behaviour and sell precise advertising","To improve the speed of the internet","To help users find friends","To protect users from criminals"],"a":0,"e":"Para prever comportamento e vender publicidade bem direcionada."},{"q":"What is the problem with consent, according to Meera?","o":["The documents are too short","Consent is illegal","Users are never asked","Users accept long, complicated documents without reading them"],"a":3,"e":"Os documentos são longos e complicados e quase ninguém lê, e recusar muitas vezes impede de usar o serviço."},{"q":"Which of these does Meera recommend?","o":["Using one password for everything","Giving apps full access to be safe","Never using the internet","Using different passwords for different services"],"a":3,"e":"Ela recomenda senhas diferentes, talvez com gerenciador de senhas."},{"q":"Why is Meera especially worried about children?","o":["They do not like technology","They do not realise that posts can last for decades","They never use passwords","They use the internet too little"],"a":1,"e":"Crianças não entendem que o que se publica hoje pode existir daqui a 20 anos."},{"q":"How does Meera feel about the future?","o":["Certain that nothing will change","Sure that companies will stop collecting data","Completely pessimistic","Cautiously optimistic, because of new laws and informed users"],"a":3,"e":"Ela diz ser cautelosamente otimista: leis novas, multas e usuários informados."}]},{"id":"burglary","u":20,"title":"A break-in","level":"B2","about":"Um policial conta a uma jornalista como investigou um roubo numa casa.","spk":[{"name":"Reporter","lang":"US","acc":"americana"},{"name":"Detective Doyle","lang":"IE","acc":"irlandês"}],"lines":[{"s":0,"t":"Detective Doyle, thank you for joining us. You've been investigating burglaries for more than fifteen years. Can you tell us about a case that stayed with you?"},{"s":1,"t":"Certainly. Some years ago, a family returned from a week's holiday and found their house had been broken into. The back window was smashed, the drawers were open, and about four thousand euros' worth of jewellery and electronics had been taken. You'd expect it to be a simple case."},{"s":0,"t":"But it wasn't?"},{"s":1,"t":"Not entirely. When we examined the house, we noticed that the burglar had ignored a very expensive television, but taken an old watch, which was worth much less. That told us that he knew exactly what he wanted. Either he had been in the house before, or someone had told him what was inside."},{"s":0,"t":"So you suspected somebody who knew the family."},{"s":1,"t":"We considered it. We spoke to neighbours, to the cleaner, and to a man who had repaired the roof a few months earlier. Nobody had seen anything suspicious. But one neighbour mentioned a delivery van that had parked in the street three days in a row, and the driver had not delivered anything."},{"s":0,"t":"A delivery van? That's clever."},{"s":1,"t":"It is, because nobody looks twice at a van. We found a camera on the corner, which recorded the registration number. The van had been rented by a young man who, as it turned out, had worked for the roofing company. He had seen the watch in the family's living room while he was working there."},{"s":0,"t":"Was he arrested?"},{"s":1,"t":"Yes. He was arrested at his flat two weeks later. Most of the jewellery had already been sold, but we recovered the watch, which had great sentimental value for the family. It had belonged to the father's grandfather."},{"s":0,"t":"What advice would you give to people who want to protect their homes?"},{"s":1,"t":"Don't announce your holidays on social media. Ask a neighbour to collect your post and to park a car in your drive. Fit decent locks and, if you can, a simple alarm. And don't invite strangers into your home without thinking about what they can see. Most burglars don't want a fight. They want an easy house."},{"s":0,"t":"Detective, thank you very much."}],"qs":[{"q":"What did the family find when they returned from holiday?","o":["The front door was open and nothing was missing","A letter from the police","A damaged car","The back window was broken and things were missing"],"a":3,"e":"A janela dos fundos quebrada, gavetas abertas e cerca de quatro mil euros em objetos levados."},{"q":"What made the detectives think the burglar knew the house?","o":["He left a message","He broke the front door","He used a key","He ignored an expensive television but took an old watch"],"a":3,"e":"Ele deixou uma TV cara e levou um relógio velho: sabia o que queria."},{"q":"What did a neighbour mention?","o":["A noise at night","A man with a ladder","A broken streetlight","A delivery van that parked there for three days without delivering"],"a":3,"e":"Uma van de entregas ficou estacionada três dias seguidos sem entregar nada."},{"q":"How did the police find the burglar?","o":["A camera recorded the van's registration number","Someone sold the television","The cleaner recognised him","He called them himself"],"a":0,"e":"Uma câmera da esquina gravou a placa da van, alugada por um jovem."},{"q":"What was the connection between the burglar and the family?","o":["He had worked on their roof and seen the watch","He was their neighbour","He was the father's friend","He was the cleaner's son"],"a":0,"e":"Ele trabalhava na empresa que consertou o telhado e viu o relógio na sala."},{"q":"Which of these does the detective recommend?","o":["Keep valuable things near the window","Leave a key under the door mat","Do not announce your holidays on social media","Tell strangers you will be away"],"a":2,"e":"Ele recomenda não anunciar as férias nas redes sociais, pedir a um vizinho para pegar a correspondência etc."}]},{"id":"plastic","u":23,"title":"A year without plastic","level":"B2","about":"Entrevista com uma jornalista que tentou viver um ano sem plástico descartável.","spk":[{"name":"Host","lang":"US","acc":"americano"},{"name":"Maya","lang":"GB","acc":"britânica"}],"lines":[{"s":0,"t":"Welcome to Green Living. My guest today is journalist Maya Collins, who spent a whole year trying to avoid single-use plastic. Maya, why did you decide to do it?"},{"s":1,"t":"Honestly, it started with a photograph. I saw a picture of a beach covered in bottles and bags, and I realised that I had thrown away dozens of similar things that same week without thinking. I wanted to find out whether an ordinary person could really live differently."},{"s":0,"t":"And could you?"},{"s":1,"t":"Mostly, yes, but it was harder than I expected. The first month was the worst. Plastic is everywhere: in the packaging of vegetables, in toothbrushes, in cleaning products. I had to learn to shop in markets, to carry my own bags and containers, and to say no to plastic straws in restaurants, which sometimes made the waiters look at me as if I were strange."},{"s":0,"t":"Was it expensive?"},{"s":1,"t":"That surprised me. Some things cost more, like soap bars or metal bottles. But I stopped buying so many things I didn't need, and by the end of the year I had actually saved about eight per cent of my monthly spending. Buying less turned out to be the biggest change."},{"s":0,"t":"What was the most difficult part?"},{"s":1,"t":"Travelling. Airports and trains sell everything in plastic, and when you are tired and hungry it is very tempting to give up. I failed several times. I don't think anyone can be perfect, and I'd say that is the main lesson. If everyone made small changes, it would matter more than a few people doing everything perfectly."},{"s":0,"t":"Do you think individual action is enough?"},{"s":1,"t":"No, and I want to be clear about that. Companies and governments must do much more. They decide how products are packaged, and a shopper can only choose from what is on the shelf. But I also found that when I asked shops for less packaging, some of them listened. One local bakery changed its bags after only three customers complained."},{"s":0,"t":"So what would you say to someone who wants to start?"},{"s":1,"t":"Choose one habit and keep it for a month. Take a reusable bottle everywhere, for example. Once that becomes automatic, add another. Don't try to change your whole life in a week, because you will probably get discouraged and stop."},{"s":0,"t":"Maya, thank you for sharing your experience."},{"s":1,"t":"Thank you for having me."}],"qs":[{"q":"What made Maya decide to try living without plastic?","o":["A conversation with a friend","An article about recycling","A government campaign","A photograph of a polluted beach"],"a":3,"e":"Foi a foto de uma praia coberta de garrafas e sacolas que a fez perceber quanto jogava fora."},{"q":"What was unexpectedly true about the cost?","o":["Everything became much more expensive","She had to find a second job","She saved money because she bought less","Nothing changed in her spending"],"a":2,"e":"Ela economizou cerca de 8% porque passou a comprar menos coisas."},{"q":"Which situation was the hardest for her?","o":["Shopping in markets","Cooking at home","Going to restaurants","Travelling"],"a":3,"e":"Aeroportos e trens vendem tudo em plástico, e cansada ela cedia."},{"q":"What does Maya think about individual action?","o":["It is enough to solve the problem","It helps, but companies and governments must do more","It is completely useless","Only governments should act"],"a":1,"e":"Ela diz que a ação individual não basta: empresas e governos decidem as embalagens."},{"q":"What happened at the local bakery?","o":["It closed down","It raised its prices","It changed its bags after a few complaints","It stopped selling bread"],"a":2,"e":"A padaria mudou as sacolas depois de apenas três reclamações."},{"q":"What is Maya's advice for beginners?","o":["Wait for the government to act","Buy more expensive products","Choose one habit and keep it for a month","Change everything in one week"],"a":2,"e":"Ela recomenda começar com um hábito só, por um mês, e depois somar outros."}]},{"id":"burnout","u":24,"title":"When work makes you ill","level":"B2","about":"Uma médica explica sinais de burnout e o que fazer para se recuperar.","spk":[{"name":"Dr. Hughes","lang":"AU","acc":"australiana"}],"lines":[{"s":0,"t":"Good evening, everyone. Tonight I want to talk about something I see more and more in my clinic: burnout. Many people think it just means feeling tired after a hard week, but it is much more serious than that. Burnout is a state of physical and mental exhaustion caused by long periods of stress, usually connected to work."},{"s":0,"t":"The first sign is often tiredness that sleep does not fix. You wake up exhausted, even after eight hours. The second sign is a change in attitude. People who used to love their jobs start to feel cynical, and they stop caring about results. The third is a drop in performance. Tasks that were easy become difficult, and mistakes become more frequent."},{"s":0,"t":"Physical symptoms are common too. Patients tell me about headaches, stomach problems, and trouble sleeping. Some of them catch every cold that is going around, because stress weakens the immune system. If you recognise several of these symptoms for more than a few weeks, you should not ignore them."},{"s":0,"t":"Who is at risk? Interestingly, it is not always the people with the hardest jobs. It is often those who set very high standards for themselves, who find it difficult to say no, and who never switch off. A driver who works fourteen hours a day, a manager who answers emails at midnight, a nurse who skips her breaks: they all share the same pattern."},{"s":0,"t":"So what can you do? First, talk to someone. A doctor, a family member, a colleague. Many people feel ashamed and hide their problem, which only makes it worse. Second, protect your sleep and take real breaks. A short walk at lunchtime is more useful than eating at your desk. Third, learn to set limits. You are allowed to refuse extra tasks when you are already overloaded."},{"s":0,"t":"Recovery takes time. Some patients need a few weeks off work, others need to change their routine permanently. What matters is to act early. If you had a broken leg, you wouldn't try to run a marathon, and exhaustion deserves the same respect."},{"s":0,"t":"Finally, remember that you are not weak because you are tired. You are a human being who has been asked to do too much for too long. Thank you for listening, and I'll now take your questions."}],"qs":[{"q":"According to Dr. Hughes, what is the first sign of burnout?","o":["Feeling very happy","Losing weight quickly","Tiredness that sleep does not fix","A big salary increase"],"a":2,"e":"O primeiro sinal é um cansaço que o sono não resolve."},{"q":"How do people with burnout often change at work?","o":["They start arriving earlier","They become more ambitious","They make fewer mistakes","They become cynical and care less about results"],"a":3,"e":"Ficam cínicos e deixam de se importar com os resultados."},{"q":"Who is most at risk, according to the talk?","o":["Young people with no experience","People who sleep too much","Only people with the hardest jobs","People with very high standards who cannot say no"],"a":3,"e":"O risco é maior em quem se cobra muito, não consegue dizer não e nunca desliga."},{"q":"What does the doctor say about taking breaks?","o":["Breaks are a waste of time","Breaks should be taken only on weekends","A short walk is better than eating at the desk","Nobody needs breaks at work"],"a":2,"e":"Uma caminhada curta no almoço é mais útil do que comer na mesa de trabalho."},{"q":"Why does she mention a broken leg?","o":["To show that exhaustion needs the same respect as an injury","To talk about physical exercise","To describe a patient she treated","To explain a sports accident"],"a":0,"e":"Ela compara: ninguém correria uma maratona com a perna quebrada, e a exaustão merece o mesmo respeito."},{"q":"What is her final message to the audience?","o":["Burnout is not a real illness","Being tired does not mean you are weak","Doctors cannot help with stress","You should leave your job at once"],"a":1,"e":"Ela termina dizendo que estar cansado não é fraqueza: foi pedido demais por tempo demais."}]},{"id":"salary","u":25,"title":"Asking for a pay rise","level":"B2","about":"Uma consultora de carreira explica como negociar um aumento de salário.","spk":[{"name":"Host","lang":"GB","acc":"britânico"},{"name":"Laura","lang":"US","acc":"americana"}],"lines":[{"s":0,"t":"Today on Career Talk we have Laura Bennett, who helps people negotiate better salaries. Laura, many people are afraid of asking for a pay rise. Why is that?"},{"s":1,"t":"Because they think the answer will be no, and that the conversation will damage their relationship with the boss. In fact, most managers expect employees to ask at some point. If you prepare properly, it is a normal business discussion, not a fight."},{"s":0,"t":"So how should someone prepare?"},{"s":1,"t":"Start with research. Find out what people with your experience are paid in other companies. Use salary websites, talk to recruiters, ask colleagues in the same sector. Then make a list of your achievements in the last year, with numbers if possible. For example, instead of saying you work hard, say that you reduced customer complaints by thirty per cent."},{"s":0,"t":"What about the timing?"},{"s":1,"t":"Timing matters a lot. Don't ask when the company is having financial trouble or right after a bad quarter. The best moment is after a success, such as finishing an important project, or during the annual review, when budgets are being decided."},{"s":0,"t":"And in the meeting itself?"},{"s":1,"t":"Be calm and specific. Say exactly what you are asking for, and give a reason. Avoid threatening to resign unless you really mean it, because the boss may say, fine, go. Also, don't give the first number too quickly if they ask what you expect. You can say that you would like to hear their range first."},{"s":0,"t":"What if the answer is no?"},{"s":1,"t":"Ask what you would need to do to earn the raise, and agree on a date to talk again. Sometimes the company can't increase your salary but can offer other things: more holiday, flexible hours, training, or a better job title. Those benefits have real value too."},{"s":0,"t":"Any final advice?"},{"s":1,"t":"Remember that the worst result is usually just a no, and then you are exactly where you were before. But the person who never asks almost never gets a raise."},{"s":0,"t":"Laura, thanks for your time."}],"qs":[{"q":"According to Laura, why are people afraid to ask for a raise?","o":["They don't know their salary","They don't need more money","They think it will damage their relationship with the boss","They are afraid of losing holidays"],"a":2,"e":"Elas acham que a resposta será não e que isso prejudicará a relação com o chefe."},{"q":"What should people include when preparing?","o":["A threat to resign","A complaint about colleagues","A copy of the company's budget","A list of achievements, with numbers if possible"],"a":3,"e":"Ela recomenda listar conquistas do ano, de preferência com números."},{"q":"When is a good time to ask?","o":["Just before a holiday","When the company has financial trouble","After a success or during the annual review","Right after a bad quarter"],"a":2,"e":"O melhor momento é depois de um sucesso ou na avaliação anual."},{"q":"What does Laura say about the first number in a negotiation?","o":["Never mention any number","Don't give it too quickly; ask for their range first","Give a very high number to scare them","Always give it immediately"],"a":1,"e":"Ela sugere não dizer o primeiro número rápido e pedir antes a faixa da empresa."},{"q":"What can you ask for if the company refuses a raise?","o":["A transfer to another country","A new boss","Other benefits like more holiday or flexible hours","A longer working week"],"a":2,"e":"Podem oferecer mais férias, horário flexível, treinamento ou um cargo melhor."},{"q":"What is Laura's final point?","o":["You should never ask","The worst result is usually just a no","Only managers can get raises","Asking for a raise always works"],"a":1,"e":"O pior resultado costuma ser um não, e quem nunca pede quase nunca consegue."}]},{"id":"fakenews","u":26,"title":"Can we trust what we read?","level":"B2","about":"Um jornalista e uma professora discutem notícias falsas e como verificar informações.","spk":[{"name":"Tom","lang":"AU","acc":"australiano"},{"name":"Prof. Diaz","lang":"US","acc":"americana"}],"lines":[{"s":0,"t":"Welcome to Media Matters. I'm Tom, and with me is Professor Elena Diaz, who studies how false information spreads online. Professor, is fake news really a new problem?"},{"s":1,"t":"No, rumours have existed for centuries. What is new is the speed. A false story can reach millions of people in a few hours, and the correction usually arrives much later and reaches far fewer people."},{"s":0,"t":"Why do people share false stories?"},{"s":1,"t":"Mostly because of emotion. We share things that make us angry, afraid or surprised, and we do it quickly, often without reading beyond the headline. Studies show that false news tends to be more shocking than real news, which helps it travel."},{"s":0,"t":"Do you think the media also share some responsibility?"},{"s":1,"t":"Yes. Newspapers and websites compete for attention, and some of them choose dramatic headlines that exaggerate the facts. The article may be accurate, but the headline gives the wrong impression, and many readers never go further."},{"s":0,"t":"So what can ordinary people do?"},{"s":1,"t":"I teach my students four habits. First, check the source. Do you know the website? Does it have a history of reliable reporting? Second, read the whole article, not only the title. Third, look for the same story in other places. If only one site reports something extraordinary, be careful. And fourth, pause before sharing, especially when you feel a strong emotion."},{"s":0,"t":"What about photographs and videos?"},{"s":1,"t":"They can be misleading too. A real photo can be used with a false description, or an old video can be presented as recent news. A simple search by image can often show where a picture first appeared."},{"s":0,"t":"Is there a danger that people stop believing anything?"},{"s":1,"t":"That is a real risk. If we decide that everything is false, we are also helping the people who spread lies. The goal is not to distrust everything, but to be a careful reader who asks for evidence."},{"s":0,"t":"Professor Diaz, thank you very much."}],"qs":[{"q":"What is new about fake news, according to Professor Diaz?","o":["The newspapers that print it","The fact that it exists","The people who read it","The speed at which it spreads"],"a":3,"e":"Boatos sempre existiram; o novo é a velocidade com que se espalham."},{"q":"Why do people often share false stories?","o":["Because the stories are boring","Because they want to help the media","Because they check every fact","Because of strong emotions"],"a":3,"e":"Compartilhamos o que nos deixa com raiva, medo ou surpresa, muitas vezes sem ler além da manchete."},{"q":"What problem does she mention about some headlines?","o":["They are always accurate","They exaggerate and give the wrong impression","They are too long","They are written by readers"],"a":1,"e":"Manchetes dramáticas exageram e muita gente não lê o resto."},{"q":"Which of these is one of her four habits?","o":["Trust the first website you see","Share first and check later","Ignore the source","Look for the same story in other places"],"a":3,"e":"Um dos hábitos é buscar a mesma notícia em outras fontes."},{"q":"What can help with doubtful photographs?","o":["A search by image","Reading only the caption","Printing the picture","Asking friends to vote"],"a":0,"e":"Uma busca por imagem mostra onde a foto apareceu primeiro."},{"q":"What risk does she mention at the end?","o":["People may stop believing anything at all","People will read too many newspapers","The media will become too accurate","Everyone will believe the news"],"a":0,"e":"Se decidirmos que tudo é falso, ajudamos quem espalha mentiras; o objetivo é ser um leitor cuidadoso."}]},{"id":"stranded","u":27,"title":"The longest journey home","level":"B2","about":"Uma mulher conta como uma viagem de volta para casa deu errado.","spk":[{"name":"Narrator","lang":"GB","acc":"britânica"}],"lines":[{"s":0,"t":"Last winter I was visiting a friend in Edinburgh, and I was supposed to fly home to London on a Friday evening. I arrived at the airport two hours early, as usual, and everything seemed fine until I looked at the departures board. My flight was marked in red: cancelled."},{"s":0,"t":"There had been heavy snow all afternoon, and the airline had cancelled dozens of flights. The queue at the service desk was enormous, so I decided to use my phone. After forty minutes on hold, a very polite voice told me that the next available seat was on Tuesday. Tuesday! I had an important meeting on Monday morning."},{"s":0,"t":"I decided to take the train instead. Unfortunately, so had thousands of other people. The station was so crowded that I could hardly move, and the last train to London had already left. A man at the information desk suggested taking a bus to Newcastle and trying to find a connection from there."},{"s":0,"t":"The bus left at ten o'clock and drove very slowly through the snow. It was freezing, and the heating didn't work. I sat next to an elderly gentleman who had been travelling since the morning, and we shared his sandwiches and a flask of hot tea. He told me that he had been stranded twice before, and that the secret was never to lose your sense of humour."},{"s":0,"t":"We reached Newcastle at one in the morning, but there were no trains until six. The waiting room was closed, so I found a small café that stayed open all night. I spent five hours there drinking coffee and reading a guidebook that I had bought in Edinburgh. Strangely enough, it was one of the most peaceful nights of my trip."},{"s":0,"t":"The first train finally left at six fifteen. I arrived in London at half past ten, tired, hungry and wearing the same clothes as the day before. But I made it to the meeting on time on Monday, and I even told the story to my colleagues, who found it hilarious."},{"s":0,"t":"Since then I always take a small emergency bag when I travel, with a charger, a bottle of water, snacks and a warm jumper. It's a lesson I learned the hard way."}],"qs":[{"q":"Why was the narrator's flight cancelled?","o":["The airport was closed for repairs","There was a strike","The pilot was ill","There was heavy snow"],"a":3,"e":"A forte nevasca levou a companhia a cancelar dezenas de voos."},{"q":"What did the airline offer her on the phone?","o":["A free hotel in Edinburgh","A refund only","A seat on Tuesday","A seat on Saturday"],"a":2,"e":"O próximo assento disponível era na terça-feira."},{"q":"Who helped her on the bus?","o":["A young student","An elderly man who shared his food and tea","The driver","A police officer"],"a":1,"e":"Um senhor idoso dividiu sanduíches e chá com ela."},{"q":"Where did she spend the night in Newcastle?","o":["In the waiting room","In a friend's flat","In a hotel","In a café that stayed open"],"a":3,"e":"A sala de espera estava fechada, então ela ficou num café aberto a noite toda."},{"q":"How did she feel about the night at the café?","o":["It was too noisy","It was terrifying","It was very boring","It was peaceful"],"a":3,"e":"Ela diz que foi uma das noites mais tranquilas da viagem."},{"q":"What did she start doing after this experience?","o":["Staying home in winter","Flying only on Mondays","Carrying a small emergency bag","Avoiding trains"],"a":2,"e":"Agora ela sempre leva uma bolsa de emergência com carregador, água, lanches e um agasalho."}]},{"id":"aiwork","u":28,"title":"Will AI take our jobs?","level":"B2","about":"Debate de rádio com três pessoas sobre inteligência artificial e o futuro do trabalho.","spk":[{"name":"Host","lang":"AU","acc":"australiano"},{"name":"Karen","lang":"US","acc":"americana"},{"name":"James","lang":"GB","acc":"britânico"}],"lines":[{"s":0,"t":"Welcome to the programme. Tonight's question: will artificial intelligence take our jobs? With me are Karen Lopez, a software engineer, and James Hart, who studies the labour market. Karen, you first."},{"s":1,"t":"I think the fear is exaggerated. Every new technology has destroyed some jobs and created others. When computers arrived, typists disappeared, but millions of people started working as programmers, designers and analysts. AI will probably follow the same pattern."},{"s":2,"t":"I would be more careful. This time the change may be faster. Previous technologies replaced physical work, but AI can write, translate and analyse data, which are tasks that many educated people do. A lot of workers will have to learn new skills in a very short time."},{"s":0,"t":"Which jobs are most at risk?"},{"s":2,"t":"Routine office tasks, like entering data or answering simple customer questions. Those jobs follow clear rules, and software is good at that. Jobs that need empathy, creativity or physical skill in changing situations are safer, for example nurses, electricians and teachers."},{"s":1,"t":"I agree, but I'd add that AI is also a tool. In my company, programmers use it to write simple code, so they have more time for the difficult problems. Nobody has lost a job, and the team has actually grown."},{"s":2,"t":"That's the best case, Karen. But not every company will act that way. Some will simply reduce staff to save money, and the workers may not be able to move easily to a new sector, especially if they are older."},{"s":0,"t":"So who is responsible for helping those workers?"},{"s":1,"t":"Everyone. Companies should pay for training, and governments should make education more flexible, with short courses and support while people study."},{"s":2,"t":"I'd go further. If we don't plan, inequality will grow, because the benefits of the technology will go to a small group of owners."},{"s":0,"t":"A final thought from each of you?"},{"s":1,"t":"Learn to work with the technology, not against it."},{"s":2,"t":"And demand that the benefits are shared. Thank you."}],"qs":[{"q":"Why does Karen think the fear of AI is exaggerated?","o":["AI will never be used in offices","AI is not very powerful","Computers disappeared in the past","New technologies have always created new jobs too"],"a":3,"e":"Para ela, toda nova tecnologia destruiu alguns empregos e criou outros, como aconteceu com os computadores."},{"q":"Why is James more cautious?","o":["Technology never changes","AI can do tasks educated people do, and the change may be faster","AI is too expensive","Workers don't like computers"],"a":1,"e":"A IA faz tarefas de pessoas escolarizadas e a mudança pode ser mais rápida."},{"q":"Which jobs are safer, according to James?","o":["Data entry jobs","Jobs with clear rules","Simple customer service jobs","Jobs that need empathy, creativity or physical skill"],"a":3,"e":"Enfermeiros, eletricistas e professores exigem empatia, criatividade ou habilidade física."},{"q":"What happened in Karen's company?","o":["Programmers refused to use AI","The company stopped using software","Programmers used AI for simple code and the team grew","Everybody was fired"],"a":2,"e":"Os programadores usaram IA para código simples e o time cresceu."},{"q":"What does James say may happen in some companies?","o":["They will pay more","They may reduce staff to save money","They will ban AI","They will train every worker"],"a":1,"e":"Algumas empresas podem simplesmente reduzir a equipe para economizar."},{"q":"What does James warn about if there is no plan?","o":["Everyone will be unemployed","Prices will fall","Schools will close","Inequality will grow"],"a":3,"e":"Sem planejamento, os benefícios irão para um pequeno grupo de donos e a desigualdade crescerá."}]},{"id":"feedback","u":29,"title":"Giving honest feedback","level":"B2","about":"Duas colegas conversam sobre como dar e receber feedback no trabalho.","spk":[{"name":"Nina","lang":"US","acc":"americana"},{"name":"Paul","lang":"IE","acc":"irlandês"}],"lines":[{"s":0,"t":"Paul, do you have a minute? I need some advice. I have to give feedback to one of my team members, and I really don't know how to start."},{"s":1,"t":"Of course. What's the problem?"},{"s":0,"t":"He is very talented, but he is often late with his reports, and the other people on the team are getting frustrated. I don't want to hurt his feelings."},{"s":1,"t":"Well, first of all, do it in private. Nobody likes to be criticised in front of colleagues. And do it soon. If you wait for weeks, the problem gets bigger, and you will feel more nervous."},{"s":0,"t":"That makes sense. What should I say exactly?"},{"s":1,"t":"Be specific. Don't say that he is lazy or disorganised, because that is a judgement about him. Talk about what happened. For example, you can say that the last three reports arrived two days after the deadline, and explain what effect that had on the team."},{"s":0,"t":"Should I start with something positive?"},{"s":1,"t":"Yes, but be sincere. If you only say something nice in order to introduce the criticism, people notice and stop trusting you. Mention a real strength, such as the quality of his analysis, and then move on to the problem."},{"s":0,"t":"And what if he gets defensive?"},{"s":1,"t":"Then listen. Ask him what is making it difficult. Perhaps he has too many tasks, or he doesn't have the information he needs. Often the problem is not what you think. After that, agree on a clear plan together, with a date for a second conversation."},{"s":0,"t":"That sounds much less scary than I imagined."},{"s":1,"t":"It usually is. And remember that you also need feedback. Ask your own manager how you are doing at least once a quarter, and try to accept it without arguing."},{"s":0,"t":"Thanks, Paul. I'll talk to him tomorrow morning."},{"s":1,"t":"Good luck. Let me know how it goes."}],"qs":[{"q":"What is Nina's problem?","o":["She wants to resign","She wants a raise","She has to give difficult feedback to a team member","She is late with her own report"],"a":2,"e":"Ela precisa dar um feedback difícil a alguém da equipe."},{"q":"What does Paul say about where and when to give feedback?","o":["In front of the team and later","In private and soon","During a party","By email only, after a month"],"a":1,"e":"Em particular e logo, para o problema não crescer."},{"q":"What should Nina avoid saying?","o":["That he is lazy or disorganised","That the team is frustrated","That he has a strength","That reports arrived late"],"a":0,"e":"Paul sugere falar de fatos, não fazer julgamentos sobre a pessoa."},{"q":"What does Paul say about starting with something positive?","o":["It should always be a joke","It must be sincere","It is unnecessary","It must be very long"],"a":1,"e":"Se o elogio for só para introduzir a crítica, as pessoas percebem e perdem a confiança."},{"q":"What should Nina do if the man becomes defensive?","o":["Raise her voice","Send him an email","End the meeting","Listen and ask what makes it difficult"],"a":3,"e":"Ela deve ouvir e perguntar o que está dificultando; pode ser excesso de tarefas ou falta de informação."},{"q":"What last advice does Paul give?","o":["Ask for feedback about her own work too","Change jobs","Avoid her own manager","Never give feedback again"],"a":0,"e":"Ele diz que ela também precisa de feedback e deve pedi-lo ao seu gestor."}]},{"id":"filmclub","u":30,"title":"The film club","level":"B2","about":"Dois amigos discutem um filme que acabaram de ver e se vale a pena recomendar.","spk":[{"name":"Chloe","lang":"GB","acc":"britânica"},{"name":"Sam","lang":"AU","acc":"australiano"}],"lines":[{"s":0,"t":"So, what did you think of the film? I'm dying to know, because you were very quiet when we left the cinema."},{"s":1,"t":"I needed time to think. Honestly, I'm still not sure. The first hour was excellent. The photography was beautiful, and the actor who played the father was extraordinary. I really believed in him."},{"s":0,"t":"I agree about the acting. But for me the plot was a little predictable. I guessed the ending after twenty minutes."},{"s":1,"t":"Really? I was surprised by the ending, although I didn't think it was very logical. Why would the daughter go back to the village after everything that had happened?"},{"s":0,"t":"Well, I think the director wanted to show that people can't escape their past, however hard they try. It was a bit obvious, but it was moving."},{"s":1,"t":"Maybe. What I disliked was the music. It was too loud in the emotional scenes, as if the director didn't trust us to feel anything without it."},{"s":0,"t":"That's fair. The soundtrack was a bit heavy-handed. But did you read the book? I heard that the novel is much better."},{"s":1,"t":"I haven't, but a friend told me the same. She said the film leaves out the second half of the story, which explains why the characters behave as they do."},{"s":0,"t":"Then I'd like to read it. Would you recommend the film to other people?"},{"s":1,"t":"Yes, with a warning. It's slow, and it is not for someone who wants action. But if you like thoughtful dramas, it is worth watching, and it gives you plenty to discuss afterwards. Which, in a film club, is exactly what we want."},{"s":0,"t":"I'd give it three and a half stars out of five."},{"s":1,"t":"Three and a half sounds right. Shall we choose a comedy for next month?"},{"s":0,"t":"Definitely. I need to laugh."}],"qs":[{"q":"What did Sam like about the film?","o":["The music","The ending","The photography and the actor who played the father","The action scenes"],"a":2,"e":"Ele elogia a fotografia e o ator que fez o pai."},{"q":"What was Chloe's criticism of the plot?","o":["It had too many characters","It was too funny","It was predictable","It was too fast"],"a":2,"e":"Ela adivinhou o final depois de vinte minutos."},{"q":"Why was Sam surprised by the daughter's decision at the end?","o":["He thought it wasn't very logical","He didn't notice it","He knew it from the book","He loved it"],"a":0,"e":"Ele achou ilógico ela voltar à vila depois de tudo."},{"q":"What did Sam dislike about the music?","o":["It was too loud in the emotional scenes","It was too quiet","It was too short","It was in another language"],"a":0,"e":"A trilha era alta demais nas cenas emocionais, como se o diretor não confiasse que sentiríamos nada sem ela."},{"q":"What did Sam's friend say about the book?","o":["The book is about music","The film leaves out the second half of the story","The book is shorter","The book has no ending"],"a":1,"e":"A amiga disse que o filme corta a segunda metade, que explica o comportamento dos personagens."},{"q":"What is Sam's recommendation?","o":["Perfect for people who like action","Worth watching if you like thoughtful dramas, but it is slow","Only for children","Not worth watching at all"],"a":1,"e":"Ele recomenda com um aviso: é lento, bom para quem gosta de dramas reflexivos."}]},{"id":"volunteer","u":31,"title":"Why volunteer?","level":"B2","about":"Entrevista com uma voluntária que ajuda pessoas em situação de rua.","spk":[{"name":"Host","lang":"US","acc":"americana"},{"name":"Grace","lang":"IE","acc":"irlandesa"}],"lines":[{"s":0,"t":"Today we're talking to Grace Murphy, who has volunteered at a shelter for homeless people for nine years. Grace, how did you start?"},{"s":1,"t":"By accident, really. I was walking home one cold night when I saw a man sleeping outside a shop. I felt terrible because I had a warm house a few minutes away. The next day I phoned a local charity and asked if they needed help."},{"s":0,"t":"And what do you do there?"},{"s":1,"t":"Mostly I serve dinner and talk to the people who come. I also help them fill in forms, because many have lost their documents and can't ask for benefits or look for a job without them. It's not glamorous work, but it matters."},{"s":0,"t":"What have you learned?"},{"s":1,"t":"That homelessness can happen to anyone. I've met engineers, teachers, people who lost their jobs and then their homes within a few months. They are not so different from us. Another thing I've learned is that people don't only need food. They need to be treated with respect, and sometimes the best thing you can give is ten minutes of attention."},{"s":0,"t":"Is there anything people misunderstand about volunteering?"},{"s":1,"t":"Many people think you need a lot of free time. You don't. Our shelter has volunteers who give two hours a week. Others use their professional skills: lawyers give advice, hairdressers cut hair, and one accountant helps people organise their debts."},{"s":0,"t":"Does it ever become too emotionally difficult?"},{"s":1,"t":"Sometimes. There are sad stories, and you cannot solve everyone's problems. I've learned to set limits and to talk to other volunteers after a hard evening. It helps to remember that small actions do make a difference, even when they look small."},{"s":0,"t":"What would you say to someone who is thinking about volunteering?"},{"s":1,"t":"Start with something close to your daily life, and choose a cause you really care about. You'll get much more from it than you give."},{"s":0,"t":"Grace, thank you very much."}],"qs":[{"q":"How did Grace become a volunteer?","o":["She read a newspaper article","She saw a man sleeping outside a shop and called a charity","She lost her job","A friend asked her"],"a":1,"e":"Depois de ver um homem dormindo em frente a uma loja, ela ligou para uma instituição no dia seguinte."},{"q":"Why does she help people fill in forms?","o":["Many have lost their documents and can't get help without them","They can't read","The forms are in another language","It is a legal requirement for volunteers"],"a":0,"e":"Muitos perderam documentos e sem eles não conseguem benefícios nem emprego."},{"q":"What has she learned about homelessness?","o":["It can happen to anyone","It happens only to the unemployed","It is always a personal choice","It affects only older people"],"a":0,"e":"Já conheceu engenheiros e professores que perderam o emprego e depois a casa."},{"q":"What does she say people need besides food?","o":["More money","Respect and attention","New clothes","A phone"],"a":1,"e":"Eles também precisam ser tratados com respeito; às vezes dez minutos de atenção é o melhor presente."},{"q":"What misunderstanding about volunteering does she mention?","o":["That it is dangerous","That it is only for young people","That you need a lot of free time","That it is paid work"],"a":2,"e":"Muitos acham que é preciso muito tempo livre; há quem dê só duas horas por semana."},{"q":"How does Grace deal with emotionally difficult evenings?","o":["She sets limits and talks to other volunteers","She works longer hours","She avoids people's stories","She stops volunteering"],"a":0,"e":"Ela aprendeu a impor limites e conversa com outros voluntários."}]},{"id":"career40","u":32,"title":"Starting again at forty","level":"B2","about":"Um homem conta como mudou de carreira aos quarenta anos e o que aprendeu.","spk":[{"name":"Host","lang":"US","acc":"americana"},{"name":"Daniel","lang":"GB","acc":"britânico"}],"lines":[{"s":0,"t":"My guest today is Daniel Reed, who spent fifteen years as a bank manager before becoming a carpenter at the age of forty. Daniel, that is quite a change."},{"s":1,"t":"It is, and many people thought I was crazy. I had a good salary, a comfortable office and a clear path to promotion. But I was tired. I felt I was spending my life on tasks that didn't mean anything to me."},{"s":0,"t":"What made you finally decide?"},{"s":1,"t":"A small event. My father broke a chair, and I tried to repair it in the garage. I spent the whole Saturday on it, and when I finished I realised I hadn't looked at my phone even once. I felt happier than I had for years."},{"s":0,"t":"So you quit your job the next week?"},{"s":1,"t":"No, I'm not that brave. I kept my job for two more years and studied carpentry in the evenings. I saved enough to live on for a year, and I told my wife everything before I made any decision. Her support was essential."},{"s":0,"t":"What was the hardest part?"},{"s":1,"t":"The first year. I earned about a third of my old salary, and I made lots of mistakes. I once cut a beautiful piece of wood in the wrong place and had to start again. I also missed the status. At parties, people stopped being impressed when I said what I did."},{"s":0,"t":"Do you regret it?"},{"s":1,"t":"Never. My income is still lower, but I choose my projects, and I see the result of my work with my own hands. My customers are pleased, and I have even taught two young apprentices."},{"s":0,"t":"What would you say to someone who is thinking about a big change?"},{"s":1,"t":"Test your idea before you jump. Try it as a hobby, talk to people who do the job, and prepare financially. It is never too late, but it needs a plan and a lot of determination."},{"s":0,"t":"Daniel, thanks for sharing your story."}],"qs":[{"q":"What was Daniel's job before he became a carpenter?","o":["A builder","A lawyer","A bank manager","A teacher"],"a":2,"e":"Ele foi gerente de banco por quinze anos."},{"q":"What event made him realise what he wanted?","o":["He repaired his father's chair and felt very happy","He saw an advertisement","He won an award","He lost his job"],"a":0,"e":"Consertando uma cadeira do pai, passou o sábado sem olhar o celular e se sentiu feliz."},{"q":"What did he do before leaving the bank?","o":["He quit the same week","He opened a bank account","He moved to another country","He studied carpentry in the evenings for two years"],"a":3,"e":"Ficou mais dois anos no emprego, estudando marcenaria à noite e juntando dinheiro."},{"q":"What was difficult in the first year?","o":["Working for a boss","Too many customers","Too much travelling","Low income and many mistakes"],"a":3,"e":"Ele ganhava cerca de um terço do salário anterior e errava muito."},{"q":"What does he miss, in some ways?","o":["His old customers","The long hours","The status of his old job","The commute"],"a":2,"e":"Ele sentiu falta do status: as pessoas deixaram de se impressionar nas festas."},{"q":"What advice does he give?","o":["Quit your job immediately","Ask the bank for a loan","Never change career","Test the idea first and prepare financially"],"a":3,"e":"Ele recomenda testar a ideia antes, conversar com quem faz o trabalho e se preparar financeiramente."}]}];

function speakRaw(text,rate){

  var ss=window.speechSynthesis;try{ss.cancel();}catch(e){}

function ditPool(sel){
  var out=[];
  for(var n=1;n<=20;n++){if(sel==='mix'?!unlocked(n):n!==sel)continue;(DIT[n]||[]).forEach(function(s){out.push({n:n,s:s});});}

function ditTok(s){
  /* devolve palavras originais e seus tokens normalizados (contrações abertas) */
  var words=String(s).replace(/[‘’]/g,"'").split(/\s+/).filter(Boolean),out=[];
  words.forEach(function(w,wi){
    var t=w.toLowerCase().replace(/[.,!?;:"“”]/g,'');
    if(!t)return;
    t=t.replace(/\bwon't\b/,'will not').replace(/\bcan't\b/,'can not').replace(/\bcannot\b/,'can not').replace(/n't\b/,' not').replace(/'m\b/,' am').replace(/'re\b/,' are').replace(/'ve\b/,' have').replace(/'ll\b/,' will');
    out.push({w:w.replace(/^["“]+|["”]+$/g,''),toks:t.split(' '),wi:wi});
  });
  return out;
}
function ditCompare(target,typed){
  var A=ditTok(target),B=ditTok(typed),fa=[],fb=[];
  A.forEach(function(x,k){x.toks.forEach(function(t){fa.push({t:t,k:k});});});
  B.forEach(function(x,k){x.toks.forEach(function(t){fb.push({t:t,k:k});});});
  var n=fa.length,m=fb.length,L=[],i,j;
  for(i=0;i<=n;i++){L.push(new Array(m+1).fill(0));}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)L[i][j]=fa[i].t===fb[j].t?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  var missA={},extraB={};i=0;j=0;
  while(i<n&&j<m){
    if(fa[i].t===fb[j].t){i++;j++;}
    else if(L[i+1][j]>=L[i][j+1]){missA[fa[i].k]=1;i++;}
    else{extraB[fb[j].k]=1;j++;}
  }
  while(i<n){missA[fa[i].k]=1;i++;}
  while(j<m){extraB[fb[j].k]=1;j++;}
  var ok=!Object.keys(missA).length&&!Object.keys(extraB).length;
  return {ok:ok,ratio:A.length?1-Object.keys(missA).length/A.length:0,
    target:A.map(function(x,k){return missA[k]?'<mark class="dmiss">'+esc(x.w)+'</mark>':esc(x.w);}).join(' '),
    typed:B.map(function(x,k){return extraB[k]?'<span class="wrongtxt">'+esc(x.w)+'</span>':esc(x.w);}).join(' ')};
}

var V={st:'idle',msg:'',rec:null,sp:null,gen:0,nos:0,tctl:null};
var R={gen:0,rec:null,ctl:null};
var RPASS=0.8;
function voiceOk(){return !!(window.IC&&IC.mic&&IC.mic.supported());}
function vLevel(rms){var e=document.getElementById('vlev');if(e)e.style.width=Math.min(100,Math.round(rms*900))+'%';}
function vUnlock(){try{if(speechOk()){var u=new window.SpeechSynthesisUtterance(' ');u.volume=0;window.speechSynthesis.speak(u);}}catch(e){}}
function vStopSpeak(){V.sp=null;try{if(speechOk())window.speechSynthesis.cancel();}catch(e){}}
function vChunks(t){
  var m=String(t).match(/[^.!?]+[.!?]*\s*/g)||[String(t)],out=[],cur='';
  m.forEach(function(x){if(cur&&(cur+x).length>200){out.push(cur.trim());cur=x;}else cur+=x;});
  if(cur.trim())out.push(cur.trim());
  return out;
}
/* o que o professor lê em voz alta: a conversa, e a frase corrigida no lugar do aviso em português */
function vSpeechText(t){
  var out=[];
  String(t).split(/(?=Correction:)/).forEach(function(p){
    p=p.trim();if(!p)return;
    if(/^Correction:/.test(p)){
      var fx=/(?:->|→)\s*["“]([^"”]+)["”]/.exec(p),mm=/^(Correction:[^(]*\([^)]*\))\s*([^]*)$/.exec(p),rest=mm?mm[2].replace(/^[.\s]+/,''):'';
      if(fx)out.push('You could say: '+fx[1]+'.');
      if(rest)out.push(rest);
    }else out.push(p);
  });
  return speakText(out.join(' '));
}
function vSay(text,rate,cb){
  if(!speechOk()||!text){if(cb)cb();return;}
  var ss=window.speechSynthesis,tok={};V.sp=tok;
  try{ss.cancel();}catch(e){}
  var ch=vChunks(text),i=0,vo=sayPick();
  function next(){
    if(V.sp!==tok)return;
    if(i>=ch.length){V.sp=null;clearTimeout(tok.t);if(cb)cb();return;}
    var seg=ch[i++],u=new window.SpeechSynthesisUtterance(seg),fired=false;
    if(vo){u.voice=vo;u.lang=vo.lang;}else u.lang='en-US';
    u.rate=rate||0.9;
    function nx(){if(fired)return;fired=true;clearTimeout(tok.t);next();}
    u.onend=nx;u.onerror=nx;
    tok.t=setTimeout(nx,Math.max(4000,seg.length*110+2500));
    try{ss.speak(u);}catch(e){nx();}
  }
  next();
}
function vSet(st,msg){V.st=st;V.msg=msg||'';paintVoice();}
function voiceBarHtml(){
  var c=S.chat;if(!c||c.ended)return '';
  if(!voiceOk()&&!speechOk())return '';
  var h='<div class="vbar">';
  if(voiceOk()){
    var st=V.st,btn;
    if(st==='listening')btn='<button type="button" class="btn vmic rec" data-act="vstop">'+ic(I.stop,18)+' Parar e enviar</button><div class="vlev" aria-hidden="true"><i id="vlev"></i></div>';
    else if(st==='starting'||st==='transcribing')btn='<button type="button" class="btn vmic" disabled>'+(st==='starting'?'Ligando…':'Entendendo…')+'</button>';
    else if(st==='speaking')btn='<button type="button" class="btn vmic" data-act="vstop">'+ic(I.stop,18)+' Parar o áudio</button>';
    else btn='<button type="button" class="btn primary vmic" data-act="vrec"'+(c.busy?' disabled':'')+'>'+ic(I.mic,18)+' Falar</button>';
    h+='<div class="row">'+btn+'</div>';

    (speechOk()?'<button type="button" class="vtog" data-act="vspeak" aria-pressed="'+VP.speak+'">Ouvir as respostas: '+(VP.speak?'sim':'não')+'</button>':'')+
    (voiceOk()?'<button type="button" class="vtog" data-act="vhands" aria-pressed="'+VP.hands+'">Modo voz: '+(VP.hands?'ligado':'desligado')+'</button>':'')+'</div>';
  h+='<p class="small muted" id="vstat" aria-live="polite">'+esc(V.msg||(VP.hands?'Modo voz ligado: o professor fala, depois eu ouço você.':''))+'</p></div>';
  return h;
}

function voiceHalt(){
  V.gen++;
  try{if(V.rec)V.rec.stop();}catch(e){}V.rec=null;
  try{if(V.tctl)V.tctl.abort();}catch(e){}V.tctl=null;
  vStopSpeak();V.st='idle';V.msg='';V.nos=0;paintVoice();
}
function voiceLeave(){voiceHalt();VP.hands=false;if(!S.rp){try{IC.mic.close();}catch(e){}}}
function voiceAfterReply(text){
  var c=S.chat;if(!c||c.ended||!(VP.speak||VP.hands))return;
  var my=++V.gen;
  vSet('speaking','O professor está falando…');
  vSay(vSpeechText(text),0.92,function(){
    if(my!==V.gen)return;
    vSet('idle','');
    if(VP.hands&&S.chat===c&&!c.ended)setTimeout(function(){if(my===V.gen&&VP.hands&&S.chat===c&&V.st==='idle')voiceListen(true);},350);
  });
}
async function voiceListen(auto){
  var c=S.chat;if(!c||c.ended)return;
  if(c.busy){flash('Espere a resposta do professor.');return;}
  if(V.st==='listening'||V.st==='transcribing'||V.st==='starting')return;
  vStopSpeak();
  var my=++V.gen;
  vSet('starting','Ligando o microfone…');
  try{await IC.mic.open();}catch(e){if(my!==V.gen)return;VP.hands=false;vSet('idle',IC.errMsg(e));return;}
  if(my!==V.gen||S.chat!==c)return;
  var rc=IC.mic.record({silenceMs:1600,waitMs:10000,maxMs:40000,onLevel:vLevel});
  V.rec=rc;vSet('listening','Pode falar. Eu envio quando você parar.');
  var r;
  try{r=await rc.done;}catch(e){V.rec=null;if(my!==V.gen)return;VP.hands=false;vSet('idle',IC.errMsg(e));return;}
  V.rec=null;
  if(my!==V.gen||S.chat!==c)return;
  function again(msg){
    if(VP.hands&&V.nos<2){V.nos++;vSet('idle',msg+' Vou ouvir de novo.');setTimeout(function(){if(my===V.gen&&VP.hands&&S.chat===c&&V.st==='idle')voiceListen(true);},500);return;}
    V.nos=0;vSet('idle',msg+(VP.hands?' Modo voz em pausa: toque em Falar para continuar.':' Toque em Falar e tente de novo.'));
  }
  if(!r.speech||!r.blob){again('Não ouvi nada.');return;}
  vSet('transcribing','Entendendo o que você disse…');
  V.tctl=new AbortController();
  var text;
  try{text=await IC.transcribe(r.blob,{signal:V.tctl.signal});}
  catch(e){V.tctl=null;if(my!==V.gen)return;if(e&&(e.code==='bad_key'||e.code==='no_key'))VP.hands=false;vSet('idle',e&&e.code==='cancelled'?'':IC.errMsg(e));return;}
  V.tctl=null;
  if(my!==V.gen||S.chat!==c)return;
  if(!text){again('Não consegui entender.');return;}
  V.nos=0;
  var ta=document.getElementById('cmsg');
  if(!ta||c.ended||c.busy){vSet('idle','');return;}
  vSet('idle','Você disse: “'+text+'”');
  ta.value=text;S.drafts.cmsg=text;chatSend();
}
function voiceAct(a){
  switch(a){
   case 'vrec':vUnlock();voiceListen(false);break;
   case 'vstop':
     if(V.st==='listening'&&V.rec){V.rec.stop();}
     else if(V.st==='speaking'){var wasH=VP.hands;vStopSpeak();V.gen++;vSet('idle','');if(wasH&&S.chat&&!S.chat.busy)voiceListen(true);}
     break;
   case 'vspeak':
     vUnlock();VP.speak=!VP.speak;if(!VP.speak){VP.hands=false;if(V.st==='speaking'){vStopSpeak();V.gen++;V.st='idle';V.msg='';}}
     vpSave();paintVoice();break;
   case 'vhands':
     vUnlock();
     if(VP.hands){VP.hands=false;voiceHalt();break;}
     VP.hands=true;VP.speak=true;vpSave();V.nos=0;
     (async function(){
       var c=S.chat;if(!c)return;
       vSet('starting','Ligando o microfone…');
       try{await IC.mic.open();}catch(e){VP.hands=false;vSet('idle',IC.errMsg(e));return;}
       if(S.chat!==c)return;
       vSet('idle','');
       var last=c.msgs[c.msgs.length-1];
       if(c.busy||!last||last.role==='user'){paintVoice();return;}
       voiceAfterReply(last.content);
     })();
     break;
  }
}

function rpHalt(){
  R.gen++;
  try{if(R.rec)R.rec.stop();}catch(e){}R.rec=null;
  try{if(R.ctl)R.ctl.abort();}catch(e){}R.ctl=null;

}
function rpStart(sel){
  var pool=ditPool(sel);if(!pool.length){flash('Nenhuma frase disponível.');return;}
  rpHalt();
  S.rp={sel:sel,items:shuffle(pool).slice(0,5),i:0,phase:'q',res:[],cur:null,tries:0,err:'',listening:false};

}
function rpAuto(){var d=S.rp;if(d&&d.phase==='q'&&d.items[d.i])speakRaw(d.items[d.i].s,0.85);}

      '<div class="row" style="flex-wrap:wrap"><button class="btn primary vmic" data-act="rprec">'+ic(I.mic,18)+' Gravar minha voz</button><button class="btn ghost" data-act="rpskip">Pular</button></div>';

    h+='<div class="row" style="flex-wrap:wrap"><button class="btn" data-act="sayfull" data-say="'+esc(it.s)+'">'+ic(I.vol,18)+' Ouvir</button><button class="btn" data-act="sayslow" data-say="'+esc(it.s)+'">'+ic(I.vol,18)+' Devagar</button></div>'+

async function rpRec(){
  var d=S.rp;if(!d||d.phase==='rec'||d.phase==='tr'||d.phase==='end')return;
  vStopSpeak();vUnlock();
  var my=++R.gen,it=d.items[d.i];
  d.err='';d.phase='rec';d.listening=false;render();
  try{await IC.mic.open();}catch(e){if(my!==R.gen||S.rp!==d)return;d.phase='q';d.err=IC.errMsg(e);render();return;}
  if(my!==R.gen||S.rp!==d)return;
  var rc=IC.mic.record({silenceMs:1300,waitMs:8000,maxMs:15000,onLevel:vLevel});
  R.rec=rc;d.listening=true;render();
  var r;
  try{r=await rc.done;}catch(e){R.rec=null;if(my!==R.gen||S.rp!==d)return;d.phase='q';d.listening=false;d.err=IC.errMsg(e);render();return;}
  R.rec=null;
  if(my!==R.gen||S.rp!==d)return;
  d.listening=false;
  if(!r.speech||!r.blob){d.phase='q';d.err='Não ouvi nada. Toque em Gravar e fale a frase.';render();return;}
  d.phase='tr';render();
  R.ctl=new AbortController();
  var text;
  try{text=await IC.transcribe(r.blob,{signal:R.ctl.signal});}
  catch(e){R.ctl=null;if(my!==R.gen||S.rp!==d)return;d.phase='q';d.err=e&&e.code==='cancelled'?'':IC.errMsg(e);render();return;}
  R.ctl=null;
  if(my!==R.gen||S.rp!==d)return;
  var cmp=ditCompare(it.s,text||'');
  d.tries++;
  d.cur={ok:cmp.ratio>=RPASS,ratio:cmp.ratio,target:cmp.target,typed:cmp.typed,said:text||''};
  d.phase='a';render();
}
function rpNext(skip){
  var d=S.rp;if(!d)return;
  var it=d.items[d.i];
  d.res.push(skip||!d.cur?{n:it.n,s:it.s,skip:true}:{n:it.n,s:it.s,ok:d.cur.ok,ratio:d.cur.ratio,tries:d.tries});
  d.cur=null;d.tries=0;d.err='';
  if(d.i>=d.items.length-1){
    d.phase='end';
    var dn2=d.res.filter(function(r){return !r.skip;});
    if(dn2.length){var st=rpStats();saveQ('pron',{kind:'pron',total:(st.total||0)+dn2.length,ok:(st.ok||0)+dn2.filter(function(r){return r.ok;}).length,at:Date.now()});bump();}
    rpHalt();render();return;
  }
  d.i++;d.phase='q';render();rpAuto();
}
function rpAct(a,t){
  switch(a){
   case 'rpstart':rpStart(t.dataset.n==='mix'?'mix':+t.dataset.n);break;
   case 'rprec':rpRec();break;
   case 'rpstop':if(R.rec)R.rec.stop();break;
   case 'rpskip':rpNext(true);break;
   case 'rpnext':rpNext(false);break;
   case 'rpback':rpHalt();S.rp=null;render();break;
  }
}

async function psRec(){
  if(!PS.text||PS.phase==='rec'||PS.phase==='tr')return;
  vStopSpeak();vUnlock();
  var my=++PS.gen,target=PS.text;
  PS.err='';PS.phase='rec';PS.listening=false;psPaint();
  try{await IC.mic.open();}catch(e){if(my!==PS.gen)return;PS.phase='q';PS.err=IC.errMsg(e);psPaint();return;}
  if(my!==PS.gen)return;
  var rc=IC.mic.record({silenceMs:1200,waitMs:8000,maxMs:15000,onLevel:vLevel});
  PS.rec=rc;PS.listening=true;psPaint();
  var r;
  try{r=await rc.done;}catch(e){PS.rec=null;if(my!==PS.gen)return;PS.phase='q';PS.listening=false;PS.err=IC.errMsg(e);psPaint();return;}
  PS.rec=null;

function emo(w){var k=String(w).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();return EMO[k]||'';}
function emoW(w){var e=emo(w);return e?'<span class="emo" aria-hidden="true">'+e+'</span>':'';}
function emoCell(c){
  return String(c).split(/(,(?![^(]*\)))/).map(function(p){
    if(p===',')return p;
    var m=/^(\s*)([A-Za-z' -]+?)(\s*(?:\(.*\))?\s*)$/.exec(p);if(!m)return p;
    var e=emo(m[2]);return e?m[1]+e+' '+m[2]+m[3]:p;
  }).join('');
}
var VCL=[{k:'v',t:'Verbos'},{k:'n',t:'Substantivos'},{k:'adj',t:'Adjetivos'},{k:'o',t:'Outros'}];
function vcClsOf(p){return p==='v'||p==='phr'?'v':p==='n'?'n':p==='adj'?'adj':'o';}
function vcClsTitle(k){for(var i=0;i<VCL.length;i++)if(VCL[i].k===k)return VCL[i].t;return '';}
function vcHdr(s){return s.u>0?'Unidade '+dn(s.u)+' · ':s.u===-1?vcClsTitle(s.cls)+' · ':'Revisão · ';}
function vcRow(id,first){

}
function vcClsChips(cur,cnt,total,act){
  var h='<div class="row" style="flex-wrap:wrap">';
  if(act==='vccls')h+='<button type="button" class="vtog" data-act="vccls" data-k="all" aria-pressed="'+(cur==='all')+'">Todas · '+total+'</button>';

function vcList(){
  var s=S.vc,u=s.u,n=vcCount(u),L=vcLearned(u),U=UNITS[u-1],items=VOC[u-1],cur=s.cls||'all';
  var by={v:[],n:[],adj:[],o:[]},cnt={v:0,n:0,adj:0,o:0};
  items.forEach(function(r,i){var k=vcClsOf(r[1]);by[k].push(u+'.'+i);cnt[k]++;});
  var h='<header><button class="btn ghost" data-act="vcback">'+ic(I.back,18)+vcBackLabel(s)+'</button><div class="eyebrow" style="margin-top:8px">Unidade '+dn(u)+' · Palavras</div><h2>'+n+' palavras: '+esc(U.title)+'</h2></header>';
  h+='<section class="card"><p class="small"><strong class="num">'+L+' de '+n+'</strong> aprendidas. Uma palavra conta como aprendida depois de 3 acertos em dias diferentes. As que você erra voltam no dia seguinte.</p>'+vcBar(L,n)+'<button class="btn primary" data-act="vcgo">Praticar 10 palavras</button></section>';
  h+=vcClsChips(cur,cnt,n,'vccls');

    h+='<section class="card"><h3>'+g.t+' <span class="small muted num">'+by[g.k].length+'</span></h3><div class="list">'+by[g.k].map(function(id,i){return vcRow(id,i===0);}).join('')+'</div></section>';
  });
  return h;
}
function vcClsIds(k){
  var ids=[];
  for(var u=1;u<=VOC.length;u++)VOC[u-1].forEach(function(r,i){if(vcClsOf(r[1])===k)ids.push(u+'.'+i);});
  return ids;
}
function vcPickCls(k){
  var w=vocDoc().w,t=today(),due=[],fresh=[],rest=[];
  vcClsIds(k).forEach(function(id){var r=w[id];if(!r)fresh.push(id);else if(r.d<=t)due.push(id);else rest.push(id);});
  rest.sort(function(a,b){return w[a].b-w[b].b;});
  return shuffle(shuffle(due).concat(shuffle(fresh),rest).slice(0,10));
}
function vcClsList(){
  var s=S.vc,k=s.cls,t=vcClsTitle(k),ids=vcClsIds(k),cnt={v:0,n:0,adj:0,o:0},L=0;
  for(var u0=1;u0<=VOC.length;u0++)VOC[u0-1].forEach(function(r){cnt[vcClsOf(r[1])]++;});

  var h='<header><button class="btn ghost" data-act="vcback">'+ic(I.back,18)+vcBackLabel(s)+'</button><div class="eyebrow" style="margin-top:8px">Palavras por classe</div><h2>'+ids.length+' '+t.toLowerCase()+'</h2></header>';
  h+='<section class="card"><p class="small"><strong class="num">'+L+' de '+ids.length+'</strong> aprendidas. Cada rodada traz 10 palavras desta classe, de qualquer unidade, começando pelas que estão vencidas.</p>'+vcBar(L,ids.length)+'<button class="btn primary" data-act="vcgo">Praticar 10 palavras</button></section>';
  h+=vcClsChips(k,cnt,0,'vccopen');
  var first=true;
  for(var u=1;u<=VOC.length;u++){
    var mine=[];VOC[u-1].forEach(function(r,i){if(vcClsOf(r[1])===k)mine.push(u+'.'+i);});
    if(!mine.length)continue;
    h+='<details class="card"'+(first?' open':'')+'><summary><strong>Unidade '+dn(u)+': '+esc(UNITS[u-1].title)+'</strong> <span class="small muted num">'+mine.length+'</span></summary><div class="list">'+mine.map(function(id,i){return vcRow(id,i===0);}).join('')+'</div></details>';
    first=false;
  }
  return h;
}
