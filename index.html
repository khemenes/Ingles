var GRX=[{"g":1,"u":2,"title":"Future continuous e future perfect","level":"B2","explain":["**Future continuous (will be + -ing)**: algo que estará *acontecendo* num momento do futuro. Também serve para perguntar com educação sobre planos.","**Future perfect (will have + particípio)**: algo que já *estará terminado* até um momento do futuro. Palavras comuns: **by**, **by the time**, **before**.","Dica: se a ação está em andamento naquela hora, use *will be -ing*. Se ela já terminou antes daquela hora, use *will have + particípio*."],"ex":[["This time tomorrow I'll be flying to Lisbon.","Amanhã a esta hora eu estarei voando para Lisboa."],["Will you be using the car tonight?","Você vai estar usando o carro hoje à noite?"],["By Friday I'll have finished the report.","Até sexta eu terei terminado o relatório."],["By the time you arrive, we'll have eaten.","Quando você chegar, nós já teremos comido."],["In June she'll have worked here for ten years.","Em junho ela terá dez anos de empresa."]],"mist":[["In 2030 I will live here for ten years.","In 2030 I will have lived here for ten years.","Para um tempo acumulado até uma data futura, use future perfect."],["At eight tomorrow I will sleep.","At eight tomorrow I'll be sleeping.","A ação estará em andamento naquela hora: future continuous."]],"qs":[{"q":"This time next week I ___ on a beach in Bahia.","o":["will be lying","will lie","will have lain","lie"],"a":0,"e":"Ação em andamento num momento futuro: will be lying."},{"q":"By the end of the year, I ___ all my debts.","o":["am paying","will be paying","will have paid","will pay"],"a":2,"e":"Terminado até um ponto no futuro: will have paid."},{"q":"Don't call me at 8. I ___ dinner with my family.","o":["will have had","will have","will be having","have"],"a":2,"e":"Às 8 o jantar estará em andamento: will be having."},{"q":"By the time you arrive, we ___ the meeting.","o":["will finish","will be finishing","finish","will have finished"],"a":3,"e":"By the time + ação já concluída: will have finished."},{"q":"Will you ___ the car tonight? I need it.","o":["be using","using","have used","use"],"a":0,"e":"Pergunta educada sobre planos: Will you be using...?"},{"q":"In June she ___ here for ten years.","o":["will have worked","will work","works","is working"],"a":0,"e":"Tempo acumulado até junho: will have worked."}]},{"g":2,"u":5,"title":"The more… the more","level":"B1+","explain":["Para dizer que duas coisas mudam juntas (*quanto mais..., mais...*), use **the + comparativo, the + comparativo**.","O **the** aparece nas duas partes e há uma vírgula no meio. O comparativo segue a regra normal: curto com **-er** (the *older*), longo com **more** (the *more* patient).","Não use o comparativo duas vezes: *the better*, não *the more better*."],"ex":[["The more you practise, the better you get.","Quanto mais você pratica, melhor você fica."],["The older he gets, the more patient he is.","Quanto mais velho ele fica, mais paciente ele é."],["The sooner we leave, the earlier we arrive.","Quanto antes sairmos, mais cedo chegamos."],["The less you spend, the more you save.","Quanto menos você gasta, mais você economiza."],["The bigger the car, the higher the price.","Quanto maior o carro, mais alto o preço."]],"mist":[["More you study, more you learn.","The more you study, the more you learn.","Faltam os dois the."],["The more you study, the more better you get.","The more you study, the better you get.","Não duplique o comparativo."]],"qs":[{"q":"___ you practise, the better you get.","o":["The more","The most","More","Most"],"a":0,"e":"A estrutura começa com the + comparativo: The more."},{"q":"The ___ the weather, the happier I feel.","o":["more warm","warm","warmer","warmest"],"a":2,"e":"Warm é curto: warmer."},{"q":"The more expensive the hotel, ___ the service.","o":["the better","the best","better","the more good"],"a":0,"e":"Segunda parte também leva the: the better."},{"q":"Qual frase está correta?","o":["More I eat, the more I want.","The more I eat, the more I want.","The more I eat, more I want.","The most I eat, the most I want."],"a":1,"e":"The more..., the more... com os dois the."},{"q":"'Quanto mais cedo, melhor' é:","o":["The more early, the more better","The early, the good","The earlier, the better","Earlier, better"],"a":2,"e":"Comparativos irregulares e curtos: earlier, better."},{"q":"The less you sleep, ___ tired you feel.","o":["most","the more","more","the most"],"a":1,"e":"The less..., the more..."}]},{"g":3,"u":6,"title":"Palavras com -ever (whatever, whenever...)","level":"B2","explain":["As palavras com **-ever** significam *não importa quem / o quê / quando / onde / como*: **whoever, whatever, whenever, wherever, however, whichever**.","Elas aparecem no meio da frase e substituem expressões como *any time that* ou *no matter what*. Muito úteis para generalizar, o tema desta unidade.","**However** + adjetivo significa *por mais ... que*: However hard I try..."],"ex":[["You can eat whatever you want.","Você pode comer o que quiser."],["Call me whenever you need help.","Me ligue sempre que precisar de ajuda."],["Wherever you go, I'll find you.","Onde quer que você vá, eu te encontro."],["Whoever wins gets a prize.","Quem ganhar leva um prêmio."],["However hard I try, I can't remember her name.","Por mais que eu tente, não lembro o nome dela."]],"mist":[["Anywhere that you go, call me.","Wherever you go, call me.","Use wherever para 'onde quer que'."],["However I try hard, I fail.","However hard I try, I fail.","However vem junto do adjetivo ou advérbio."]],"qs":[{"q":"You can sit ___ you like.","o":["however","whoever","whatever","wherever"],"a":3,"e":"Lugar: wherever."},{"q":"___ you need help, just call me.","o":["Wherever","Whichever","Whoever","Whenever"],"a":3,"e":"Tempo: whenever."},{"q":"___ wins the race will get a medal.","o":["Whatever","However","Whenever","Whoever"],"a":3,"e":"Pessoa: whoever."},{"q":"I'll do ___ it takes to finish this project.","o":["whatever","whenever","wherever","however"],"a":0,"e":"Coisa: whatever."},{"q":"___ hard I try, I can't remember her name.","o":["Whoever","Whatever","However","Wherever"],"a":2,"e":"However + adjetivo: por mais que."},{"q":"Here are two cakes. Take ___ you prefer.","o":["whoever","wherever","whichever","whenever"],"a":2,"e":"Escolha entre opções: whichever."}]},{"g":4,"u":7,"title":"Needn't (não precisa)","level":"B1+","explain":["**Needn't + verbo** significa *não precisa* e tem o mesmo sentido de *don't need to* e *don't have to*. Não leva **to** depois: *You needn't come.*","Cuidado: **mustn't** é *proibido*, e **needn't** é *não é necessário*. São coisas bem diferentes.","**Needn't have + particípio** fala de algo que a pessoa fez, mas era desnecessário: *You needn't have bought flowers.*"],"ex":[["You needn't come early; the show starts at nine.","Você não precisa chegar cedo; o show começa às nove."],["You mustn't park here. It's forbidden.","Você não pode estacionar aqui. É proibido."],["She needn't worry.","Ela não precisa se preocupar."],["You needn't have bought flowers!","Você não precisava ter comprado flores!"],["We needn't hurry. We have plenty of time.","Não precisamos correr. Temos bastante tempo."]],"mist":[["You mustn't come tomorrow, it's optional.","You needn't come tomorrow, it's optional.","Se não é obrigatório, use needn't, não mustn't."],["She needn't to go.","She needn't go.","Needn't é seguido de verbo sem to."]],"qs":[{"q":"You ___ come early; the show starts at nine.","o":["can't","mustn't","needn't","shouldn't"],"a":2,"e":"Não é necessário: needn't."},{"q":"You ___ park here. It's forbidden.","o":["mustn't","needn't","don't need","needn't to"],"a":0,"e":"Proibição: mustn't."},{"q":"She needn't ___ so much.","o":["worries","worrying","to worry","worry"],"a":3,"e":"Needn't + verbo sem to."},{"q":"You ___ have bought flowers! (era desnecessário)","o":["needn't","don't","can't","mustn't"],"a":0,"e":"Needn't have + particípio."},{"q":"'Shall I bring a dessert?' 'No, you ___.'","o":["don't have","mustn't","needn't to","needn't"],"a":3,"e":"Resposta curta: No, you needn't."},{"q":"O que significa 'You needn't wait'?","o":["You mustn't wait.","You don't have to wait.","You shouldn't wait.","You can't wait."],"a":1,"e":"Needn't = don't have to."}]},{"g":5,"u":9,"title":"Posição dos advérbios","level":"B1+","explain":["**Frequência** (always, usually, never, often): antes do verbo principal e *depois* do verbo to be: *She always arrives early. He is never late.* Com auxiliar, vai depois dele: *I have never seen it.*","**Modo** (well, quickly, fluently): depois do verbo ou do objeto. Nunca entre o verbo e o objeto: *He speaks English fluently.*","**Lugar e tempo**: o lugar vem antes do tempo no fim da frase: *I'll see you at the station tomorrow.* Em histórias, advérbios como **suddenly** e **eventually** abrem a frase: *Suddenly, the lights went out.*"],"ex":[["She always arrives early.","Ela sempre chega cedo."],["He is never late.","Ele nunca se atrasa."],["I have never been to Japan.","Eu nunca fui ao Japão."],["He speaks English fluently.","Ele fala inglês fluentemente."],["We arrived at the airport yesterday.","Chegamos ao aeroporto ontem."]],"mist":[["She arrives always late.","She always arrives late.","Advérbio de frequência vem antes do verbo principal."],["He speaks fluently English.","He speaks English fluently.","Não separe o verbo do objeto."]],"qs":[{"q":"Qual frase está correta?","o":["Always she arrives late.","She arrives always late.","She arrives late always.","She always arrives late."],"a":3,"e":"Frequência antes do verbo principal."},{"q":"Qual frase está incorreta?","o":["She plays tennis well.","She is always happy.","She often plays tennis.","She plays well tennis."],"a":3,"e":"Well vai depois do objeto: plays tennis well."},{"q":"I ___ been to Japan.","o":["never have","have been never","never been have","have never"],"a":3,"e":"Com auxiliar, o advérbio vai depois dele: have never been."},{"q":"He is ___ late.","o":["never is","never","is never","late never"],"a":1,"e":"Depois do verbo to be: is never late."},{"q":"We arrived ___.","o":["the airport at yesterday","yesterday at the airport","at the airport yesterday","at yesterday the airport"],"a":2,"e":"Lugar antes de tempo."},{"q":"I ___ understand this rule.","o":["hardly don't","can hardly","hardly can","can't hardly"],"a":1,"e":"Hardly vai depois do auxiliar: can hardly."}]},{"g":6,"u":11,"title":"Passiva com verbos de opinião (It is said that...)","level":"B2","explain":["Para dizer *dizem que... / acredita-se que...*, use a passiva de verbos como **say, think, believe, know, report, expect, consider**.","Duas formas: **It is said that + frase** ou **Sujeito + is said to + verbo**. Para algo que já aconteceu, use **to have + particípio**: *He is said to have left.*","Essa construção é comum em notícias e textos formais."],"ex":[["It is said that the company will close.","Dizem que a empresa vai fechar."],["He is said to be the best player in the country.","Dizem que ele é o melhor jogador do país."],["The painting is believed to have been stolen in 1990.","Acredita-se que o quadro foi roubado em 1990."],["The president is expected to arrive tomorrow.","Espera-se que o presidente chegue amanhã."],["It is known that smoking is bad for you.","Sabe-se que fumar faz mal."]],"mist":[["It says that the company will close.","It is said that the company will close.","Para 'dizem que', use a passiva."],["He is believed to escaped by car.","He is believed to have escaped by car.","Fato passado: to have + particípio."]],"qs":[{"q":"___ that the company will close. (Dizem que...)","o":["It is said","It says","They are said","Is said"],"a":0,"e":"It is said that + frase."},{"q":"He ___ to be the best player in the country.","o":["says","is saying","is said","said"],"a":2,"e":"Sujeito + is said to + verbo."},{"q":"The painting is believed ___ stolen in 1990.","o":["being","to have been","that","to be"],"a":1,"e":"Fato passado: to have been."},{"q":"'People think she is 90.' → She ___ to be 90.","o":["is thought","is thinking","thinks","thought"],"a":0,"e":"Passiva: is thought to be."},{"q":"The president is expected ___ tomorrow.","o":["arrive","that arrive","to arrive","arriving"],"a":2,"e":"is expected + to + verbo."},{"q":"It is known ___ smoking is bad for you.","o":["what","which","to","that"],"a":3,"e":"It is known that + frase."}]},{"g":7,"u":11,"title":"Have something done","level":"B2","explain":["Para dizer que *outra pessoa fez algo para você*, use **have + objeto + particípio**: *I had my car repaired.* (eu mandei consertar o carro).","Em conversa informal, **get** também funciona: *I got my hair cut.*","Compare: *I cut my hair* (eu mesmo cortei) com *I had my hair cut* (o cabeleireiro cortou). Também serve para coisas ruins que acontecem com você: *He had his wallet stolen.*"],"ex":[["I'm going to have my car washed.","Vou mandar lavar o carro."],["She had her nails done yesterday.","Ela fez as unhas ontem."],["We're having the kitchen painted next week.","Vamos mandar pintar a cozinha semana que vem."],["Where do you have your hair cut?","Onde você corta o cabelo?"],["He had his wallet stolen on the bus.","Roubaram a carteira dele no ônibus."]],"mist":[["I cut my hair at the hairdresser's.","I had my hair cut at the hairdresser's.","Se foi outra pessoa que cortou, use have + particípio."],["I had my hair to cut.","I had my hair cut.","Depois do objeto vem o particípio, sem to."]],"qs":[{"q":"I'm going to ___ my car washed.","o":["put","have","do","make"],"a":1,"e":"Estrutura: have + objeto + particípio."},{"q":"She ___ her nails done yesterday.","o":["having","had","has","have"],"a":1,"e":"Passado: had her nails done."},{"q":"Qual frase diz que OUTRA pessoa cortou o cabelo?","o":["I had my hair cut.","I was cutting hair.","I cut my hair.","I have cut hair."],"a":0,"e":"Have + objeto + particípio."},{"q":"We're having the kitchen ___ next week.","o":["paint","painting","to paint","painted"],"a":3,"e":"Particípio: painted."},{"q":"Where do you ___ your hair cut?","o":["do","cut","have","make"],"a":2,"e":"Where do you have your hair cut?"},{"q":"He had his wallet ___ on the bus.","o":["steal","stole","stolen","stealing"],"a":2,"e":"Particípio de steal: stolen. Aqui é algo ruim que aconteceu com ele."}]},{"g":8,"u":12,"title":"Ordem dos adjetivos","level":"B1+","explain":["Quando há mais de um adjetivo antes do substantivo, existe uma ordem natural: **opinião → tamanho → idade → forma → cor → origem → material → substantivo**.","Exemplos: *a lovely* (opinião) *small* (tamanho) *old* (idade) *round* (forma) *brown* (cor) *Italian* (origem) *wooden* (material) *table*. Na prática, usamos 2 ou 3 adjetivos.","Dica: o adjetivo que fala de opinião vem sempre primeiro, e o de material, o último."],"ex":[["She's wearing a beautiful red silk dress.","Ela está usando um lindo vestido vermelho de seda."],["He has short black hair.","Ele tem cabelo preto e curto."],["We stayed in a small old Spanish hotel.","Ficamos num hotel espanhol pequeno e antigo."],["I bought a round wooden table.","Comprei uma mesa redonda de madeira."],["It's an interesting old French film.","É um filme francês antigo e interessante."]],"mist":[["a red big car","a big red car","Tamanho vem antes da cor."],["a leather brown jacket","a brown leather jacket","Cor vem antes do material."]],"qs":[{"q":"She's wearing a ___ dress.","o":["red beautiful silk","red silk beautiful","beautiful red silk","silk beautiful red"],"a":2,"e":"Opinião, cor, material."},{"q":"He has ___ hair.","o":["black short","short black","blacks short","short blacks"],"a":1,"e":"Tamanho antes da cor."},{"q":"We stayed in a ___ hotel.","o":["Spanish small old","small Spanish old","small old Spanish","old small Spanish"],"a":2,"e":"Tamanho, idade, origem."},{"q":"I bought a ___ table.","o":["wood round","wooden round","round wooden","rounds wooden"],"a":2,"e":"Forma antes do material."},{"q":"Qual está correta?","o":["a black leather jacket","a jacket black leather","a leather black jacket","a black jacket leather"],"a":0,"e":"Cor antes do material."},{"q":"It's a ___ film.","o":["French old interesting","old interesting French","interesting old French","French interesting old"],"a":2,"e":"Opinião, idade, origem."}]},{"g":9,"u":13,"title":"Zero conditional","level":"B1+","explain":["O **zero conditional** fala de verdades gerais, fatos científicos e hábitos: **If + presente simples, presente simples**.","Aqui o resultado é *sempre* verdadeiro, então **não use will**. Muitas vezes *if* pode ser trocado por *when* ou *whenever*.","Diferença para o first conditional: *If it rains tomorrow, I'll take an umbrella* (um caso específico no futuro). *If it rains, the streets get wet* (sempre é assim)."],"ex":[["If you heat ice, it melts.","Se você aquece o gelo, ele derrete."],["If I'm tired, I go to bed early.","Quando estou cansado, vou dormir cedo."],["Water boils if you heat it to 100 °C.","A água ferve se você a aquece a 100 °C."],["If you see Anna, tell her to call me.","Se você vir a Anna, diga para ela me ligar."],["If it rains on Sundays, we stay at home.","Se chove no domingo, ficamos em casa."]],"mist":[["If you heat water, it will boil.","If you heat water, it boils.","Para verdades gerais, use presente nos dois lados."],["If I will be tired, I sleep early.","If I'm tired, I sleep early.","Depois de if, nunca use will."]],"qs":[{"q":"If you mix blue and yellow, you ___ green.","o":["got","will get","would get","get"],"a":3,"e":"Verdade geral: presente."},{"q":"Water ___ if you heat it to 100 °C.","o":["boiled","would boil","will boil","boils"],"a":3,"e":"Fato científico: presente simples."},{"q":"If it ___ on Sundays, we stay at home.","o":["will rain","rained","would rain","rains"],"a":3,"e":"Hábito: presente nos dois lados."},{"q":"Qual frase fala de uma verdade geral?","o":["If it rained, I would stay home.","If it rains tomorrow, I'll take an umbrella.","If it had rained, I would have stayed.","If it rains, the streets get wet."],"a":3,"e":"A segunda é um fato geral (zero conditional)."},{"q":"If you ___ any problems, call me.","o":["would have","have","had","will have"],"a":1,"e":"If + presente simples."},{"q":"If I ___ tired, I usually go to bed early.","o":["will be","was","would be","am"],"a":3,"e":"If + presente simples."}]},{"g":10,"u":14,"title":"Would rather","level":"B1+","explain":["**Would rather + verbo** (sem to) significa *preferir*: *I'd rather stay at home.* No negativo: *I'd rather not go.*","Para comparar, use **than**: *I'd rather walk than take the bus.* Para perguntar: *Would you rather have tea or coffee?*","Quando a preferência é sobre *outra pessoa*, use o passado simples: *I'd rather you stayed.* (eu preferiria que você ficasse)."],"ex":[["I'd rather stay at home tonight.","Eu preferiria ficar em casa hoje à noite."],["She'd rather walk than take a taxi.","Ela prefere andar a pegar táxi."],["I'd rather not talk about it.","Eu prefiro não falar sobre isso."],["Would you rather have tea or coffee?","Você prefere chá ou café?"],["I'd rather you didn't smoke here.","Eu preferiria que você não fumasse aqui."]],"mist":[["I'd rather to stay.","I'd rather stay.","Sem to depois de would rather."],["I'd rather you to come.","I'd rather you came.","Com outra pessoa, use passado simples."]],"qs":[{"q":"I'd rather ___ at home tonight.","o":["stay","staying","to stay","stayed"],"a":0,"e":"Would rather + verbo sem to."},{"q":"She'd rather walk ___ take a taxi.","o":["to","of","that","than"],"a":3,"e":"Comparação: than."},{"q":"I'd rather you ___ here. (agora)","o":["don't smoke","not smoke","won't smoke","didn't smoke"],"a":3,"e":"Preferência sobre outra pessoa: passado simples."},{"q":"Would you rather have tea ___ coffee?","o":["or","to","than","that"],"a":0,"e":"Pergunta de escolha: or."},{"q":"'Shall we go out?' 'I'd rather ___.'","o":["not to","don't","not","no to"],"a":2,"e":"Resposta curta negativa: I'd rather not."},{"q":"Qual está correta?","o":["I'd rather going home.","I'd rather go home.","I'd rather to go home.","I'd rather went home."],"a":1,"e":"Would rather + verbo base."}]},{"g":11,"u":16,"title":"Verbos de reported speech (promise, deny, suggest...)","level":"B2","explain":["Além de *say* e *tell*, muitos verbos já trazem a intenção da frase: **promise, offer, refuse, agree + to + verbo**; **admit, deny, suggest, apologise for + -ing**.","Com um objeto, o padrão é **advise / warn / remind / invite / ask + pessoa + to + verbo**: *He advised me to see a doctor.*","Cuidado com **suggest**: não use *suggest me to*. Diga *suggested going* ou *suggested that I go*."],"ex":[["She promised to call me.","Ela prometeu me ligar."],["He denied taking the money.","Ele negou ter pegado o dinheiro."],["They suggested going out for dinner.","Eles sugeriram sair para jantar."],["He advised me to see a doctor.","Ele me aconselhou a ir ao médico."],["She warned us not to touch the wire.","Ela nos avisou para não tocar no fio."]],"mist":[["He suggested me to leave.","He suggested leaving. / He suggested that I leave.","Suggest não aceita pessoa + to."],["She said me the truth.","She told me the truth.","Tell leva a pessoa; say não."]],"qs":[{"q":"'I'll help you.' → She ___ to help me.","o":["suggested","denied","admitted","promised"],"a":3,"e":"Promise + to + verbo."},{"q":"'I didn't take it.' → He ___ taking it.","o":["agreed","refused","denied","promised"],"a":2,"e":"Deny + -ing."},{"q":"'Why don't we go to the beach?' → She ___ going to the beach.","o":["warned","refused","suggested","told"],"a":2,"e":"Suggest + -ing."},{"q":"'You should see a doctor.' → He ___ me to see a doctor.","o":["admitted","denied","suggested","advised"],"a":3,"e":"Advise + pessoa + to."},{"q":"'Don't touch the wire!' → She ___ us not to touch the wire.","o":["admitted","denied","warned","suggested"],"a":2,"e":"Warn + pessoa + not to."},{"q":"Qual frase está correta?","o":["He suggested me leaving.","He suggested to leave.","He suggested leaving.","He suggested me to leave."],"a":2,"e":"Suggest + -ing (ou that + frase)."}]},{"g":12,"u":17,"title":"I wish / If only","level":"B2","explain":["Use **wish** e **if only** para lamentar ou desejar algo diferente. O verbo recua um tempo:","**Presente (algo que não é como queremos):** wish + passado simples: *I wish I had more time.* Com *be*, o formal usa **were**: *I wish I were taller.*","**Passado (arrependimento):** wish + past perfect: *I wish I had studied more.* *If only I had listened!*","**Reclamação sobre os outros:** wish + would: *I wish you would stop talking.* Não use *would* para você mesmo (I wish I would ✗)."],"ex":[["I wish I had a bigger flat.","Queria ter um apartamento maior."],["I wish I were taller.","Queria ser mais alto."],["I wish I had studied more.","Queria ter estudado mais."],["If only I had listened to you!","Se ao menos eu tivesse te ouvido!"],["I wish you wouldn't talk so loudly.","Queria que você não falasse tão alto."]],"mist":[["I wish I have more time.","I wish I had more time.","Depois de wish, o verbo recua: passado."],["I wish I would be rich.","I wish I were rich.","Para você mesmo, não use would."]],"qs":[{"q":"I wish I ___ a bigger flat. (agora)","o":["have had","would have","have","had"],"a":3,"e":"Desejo no presente: wish + passado."},{"q":"I wish I ___ the exam last week; now I have to retake it.","o":["hadn't failed","don't fail","didn't fail","wouldn't fail"],"a":0,"e":"Arrependimento do passado: past perfect."},{"q":"I wish you ___ so loudly! (me incomoda)","o":["wouldn't talk","hadn't talk","didn't talked","don't talk"],"a":0,"e":"Reclamação sobre o outro: wish + would."},{"q":"If only I ___ the train, I'd be at home now.","o":["don't miss","wouldn't miss","hadn't missed","didn't miss"],"a":2,"e":"Arrependimento do passado: hadn't missed."},{"q":"I wish I ___ taller. (formal)","o":["am","would be","will be","were"],"a":3,"e":"Wish + were."},{"q":"Qual está correta?","o":["I wish I would speak English better.","I wish I spoke English better.","I wish I will speak English better.","I wish I speak English better."],"a":1,"e":"Wish + passado simples."}]},{"g":13,"u":18,"title":"Duplas negativas","level":"B1+","explain":["No inglês padrão, cada frase tem **apenas uma negação**. Em português dizemos *não vi ninguém*, mas em inglês é *I didn't see anybody* (ou *I saw nobody*).","Use palavras com **any-** depois de um verbo negativo: *I don't have any money*. Ou use uma palavra negativa e um verbo afirmativo: *I have no money / Nobody told me.*","**Hardly, barely e scarcely** já são negativas: *I can hardly hear you*, nunca *can't hardly*."],"ex":[["I don't have any money.","Eu não tenho dinheiro."],["Nobody told me about the change.","Ninguém me falou da mudança."],["He never says anything in meetings.","Ele nunca diz nada nas reuniões."],["I can hardly hear you. Speak louder.","Mal consigo te ouvir. Fale mais alto."],["There isn't any milk in the fridge.","Não tem leite na geladeira."]],"mist":[["I don't have nothing.","I don't have anything. / I have nothing.","Só uma negação por frase."],["She can't hardly hear.","She can hardly hear.","Hardly já é negativa."]],"qs":[{"q":"I don't have ___ money.","o":["no","none","any","nothing"],"a":2,"e":"Depois de don't, use any."},{"q":"Nobody ___ me about the change.","o":["told","never told","didn't tell","not told"],"a":0,"e":"Nobody já é negativa: verbo afirmativo."},{"q":"He never says ___ in meetings.","o":["nothing","nowhere","anything","nobody"],"a":2,"e":"Never já nega; use anything."},{"q":"I can ___ hear you. Speak louder.","o":["not hardly","no hardly","never hardly","hardly"],"a":3,"e":"Hardly já tem sentido negativo."},{"q":"Qual está correta no inglês padrão?","o":["I haven't seen nobody.","I never saw nobody.","I didn't see anybody.","I didn't see nobody."],"a":2,"e":"Uma só negação: didn't see anybody."},{"q":"There isn't ___ milk in the fridge.","o":["nothing","no","any","none"],"a":2,"e":"Isn't + any."}]},{"g":14,"u":23,"title":"Quantificadores: fewer/less, a few/a little, enough/too","level":"B2","explain":["**Contáveis x incontáveis**: com substantivos contáveis (plural) use **many, few, fewer, a few**. Com incontáveis use **much, little, less, a little**.","**Few / little** (sem *a*) têm sentido negativo: *quase nenhum*. **A few / a little** têm sentido positivo: *alguns, um pouco*. Compare: *I have a few friends* (tenho alguns) x *I have few friends* (tenho poucos).","**Enough** vem depois do adjetivo (*warm enough*) e antes do substantivo (*enough money*). **Too** vem antes do adjetivo e tem sentido de excesso: *too hot*."],"ex":[["We need fewer cars and more public transport.","Precisamos de menos carros e mais transporte público."],["There is less pollution here than in the city.","Há menos poluição aqui do que na cidade."],["We still have a little time to act.","Ainda temos um pouco de tempo para agir."],["Few people understand how serious the problem is.","Poucas pessoas entendem como o problema é sério."],["The water is not clean enough to drink.","A água não é limpa o bastante para beber."]],"mist":[["There are less trees in the park now.","There are fewer trees in the park now.","Árvores são contáveis: use fewer."],["The water is enough not clean.","The water is not clean enough.","Enough vem depois do adjetivo."]],"qs":[{"q":"We should produce ___ waste.","o":["a few","many","fewer","less"],"a":3,"e":"Waste é incontável: less."},{"q":"There are ___ cars on the road than ten years ago.","o":["fewer","much","less","little"],"a":0,"e":"Cars é contável: fewer."},{"q":"We have ___ time left, so let's hurry.","o":["many","few","fewer","little"],"a":3,"e":"Time é incontável; little = quase nada."},{"q":"I've got ___ good ideas, so let's talk.","o":["much","a few","a little","little"],"a":1,"e":"Ideas é contável e positivo: a few."},{"q":"The project isn't big ___ to need more people.","o":["too","enough","so","very"],"a":1,"e":"Adjetivo + enough."},{"q":"It's ___ expensive to run this old machine.","o":["too","very much","enough","so many"],"a":0,"e":"Too = excesso."}]},{"g":15,"u":24,"title":"Gerúndio ou infinitivo: stop, remember, try, regret","level":"B2","explain":["Alguns verbos mudam de significado conforme o que vem depois. **Stop doing** = parar de fazer. **Stop to do** = parar para fazer algo.","**Remember / forget doing** = lembrar / esquecer algo que já aconteceu. **Remember / forget to do** = lembrar / esquecer de fazer algo que ainda precisa ser feito.","**Try doing** = experimentar para ver o resultado. **Try to do** = tentar fazer algo difícil. **Regret doing** = lamentar o que fez; **regret to say/tell** = lamentar informar."],"ex":[["He stopped smoking last year.","Ele parou de fumar no ano passado."],["We stopped to rest at the top of the hill.","Paramos para descansar no alto do morro."],["Remember to take your medicine at night.","Lembre-se de tomar o remédio à noite."],["I remember seeing the doctor last spring.","Lembro de ter visto o médico na primavera passada."],["Try drinking warm water if you have a sore throat.","Experimente beber água morna se estiver com dor de garganta."]],"mist":[["I forgot locking the door, so I had to go back.","I forgot to lock the door, so I had to go back.","Forget to do = esquecer de fazer algo que ainda precisava ser feito."],["She stopped to eat sugar.","She stopped eating sugar.","Para 'parar de fazer' use stop + -ing."]],"qs":[{"q":"The doctor told him to stop ___.","o":["smoke","smoked","smoking","to smoke"],"a":2,"e":"Stop + -ing = parar de fazer."},{"q":"We stopped ___ some water at the shop.","o":["buy","to buy","buying","bought"],"a":1,"e":"Stop to do = parou para fazer algo."},{"q":"Don't forget ___ your pills before bed.","o":["take","taking","to take","took"],"a":2,"e":"Forget to do: coisa ainda por fazer."},{"q":"I'll never forget ___ the sea for the first time.","o":["to see","saw","seeing","see"],"a":2,"e":"Forget doing: lembrança de algo que já aconteceu."},{"q":"If you can't sleep, try ___ a book.","o":["read","to be read","reading","to reading"],"a":2,"e":"Try doing = experimentar."},{"q":"I regret ___ you that the appointment is cancelled.","o":["telling","to tell","tell","told"],"a":1,"e":"Regret to tell = lamentar informar."}]},{"g":16,"u":25,"title":"Used to, would, be used to, get used to","level":"B2","explain":["**Used to + verbo** fala de hábitos ou estados do passado que não existem mais: *I used to work in a bank.*","**Would + verbo** também fala de hábitos passados, mas só com ações repetidas, não com estados: *We would meet every Friday.* Não diga *I would live in Rome* para um estado.","**Be used to + -ing** = estar acostumado: *I'm used to driving at night.* **Get used to + -ing** = acostumar-se: *You'll get used to it.*"],"ex":[["I used to be afraid of negotiating.","Eu tinha medo de negociar."],["We would talk for hours before closing a deal.","Nós conversávamos por horas antes de fechar um negócio."],["She is used to working under pressure.","Ela está acostumada a trabalhar sob pressão."],["He is getting used to the new system.","Ele está se acostumando com o novo sistema."],["Did you use to work here?","Você trabalhava aqui?"]],"mist":[["I'm used to drive at night.","I'm used to driving at night.","Be used to é seguido de -ing."],["I would have a small car when I was young.","I used to have a small car when I was young.","Would não serve para estados (have = possuir)."]],"qs":[{"q":"When I was a child, I ___ a bike to school.","o":["am used to ride","used to ride","would to ride","get used to ride"],"a":1,"e":"Hábito passado: used to + verbo."},{"q":"I ___ to the heat now; I don't mind it.","o":["get use","would get","am used","used"],"a":2,"e":"Estar acostumado: be used to."},{"q":"It took me a month to get used ___ the new job.","o":["with","to","at","for"],"a":1,"e":"Used to é seguido de preposição to."},{"q":"He ___ be very shy, but now he loves talking.","o":["would to","gets used to","used to","is used to"],"a":2,"e":"Estado passado: used to."},{"q":"My grandmother ___ tell us stories every night.","o":["is used","uses to","gets","would"],"a":3,"e":"Ação repetida no passado: would."},{"q":"Are you used to ___ in a big city?","o":["to live","lived","living","live"],"a":2,"e":"Be used to + -ing."}]},{"g":17,"u":26,"title":"Artigos: a, an, the e sem artigo","level":"B2","explain":["Use **a / an** na primeira vez que fala de algo ou ao classificar: *She is a journalist.* Use **the** quando o ouvinte sabe qual é, ou quando há só um: *the president, the sun*.","**Sem artigo** com plurais e incontáveis em sentido geral: *News travels fast. People trust newspapers.* Também em esportes, idiomas e refeições: *play football, speak English, have lunch*.","**The** com superlativos, ordinais e nomes de rios, oceanos e países no plural: *the best story, the Atlantic, the United States*. Sem **the** com a maioria dos países e cidades."],"ex":[["I read an article about the economy.","Li um artigo sobre a economia."],["The article was very long.","O artigo era muito longo."],["News is spreading fast on social media.","As notícias se espalham rápido nas redes sociais."],["She works for the BBC.","Ela trabalha na BBC."],["He is the best reporter in the city.","Ele é o melhor repórter da cidade."]],"mist":[["The news are bad today.","The news is bad today.","News é incontável: verbo no singular."],["I play the football on Sundays.","I play football on Sundays.","Esportes não levam artigo."]],"qs":[{"q":"She is ___ editor of a local newspaper.","o":["an","a","—","the"],"a":0,"e":"Editor começa com som de vogal: an."},{"q":"We met ___ journalist yesterday. ___ journalist was very friendly.","o":["a / The","the / A","a / A","— / The"],"a":0,"e":"Primeira vez: a. Segunda vez: the."},{"q":"___ information is power.","o":["—","An","A","The"],"a":0,"e":"Incontável em sentido geral: sem artigo."},{"q":"It's ___ most popular news site in Brazil.","o":["the","an","a","—"],"a":0,"e":"Superlativo leva the."},{"q":"They crossed ___ Atlantic by boat.","o":["an","the","—","a"],"a":1,"e":"Oceanos levam the."},{"q":"I usually have ___ lunch at one o'clock.","o":["the","an","a","—"],"a":3,"e":"Refeições não levam artigo."}]},{"g":18,"u":27,"title":"Preposições dependentes: arrive in/at, depend on, complain about","level":"B2","explain":["Muitos verbos, adjetivos e substantivos pedem uma preposição fixa: *depend on, complain about, listen to, wait for, look forward to*. É preciso decorar cada um.","**Arrive in** + cidade ou país; **arrive at** + lugar menor (airport, hotel, station). **Get to** funciona nos dois casos.","Depois de uma preposição, o verbo vai para o gerúndio (-ing): *I'm looking forward to seeing you. She complained about waiting so long.*"],"ex":[["We arrived in Lisbon at midnight.","Chegamos a Lisboa à meia-noite."],["We arrived at the hotel very tired.","Chegamos ao hotel muito cansados."],["It depends on the weather.","Depende do clima."],["I'm looking forward to visiting the old town.","Estou ansioso para visitar a cidade antiga."],["She complained about the noise.","Ela reclamou do barulho."]],"mist":[["I'm looking forward to see you.","I'm looking forward to seeing you.","To é preposição: use -ing."],["We arrived to the airport at six.","We arrived at the airport at six.","Arrive pede at ou in, nunca to."]],"qs":[{"q":"We arrived ___ Madrid after a long flight.","o":["in","on","to","at"],"a":0,"e":"Cidade: arrive in."},{"q":"She was late because she arrived ___ the wrong station.","o":["to","in","at","on"],"a":2,"e":"Lugar pequeno: arrive at."},{"q":"It all depends ___ the price.","o":["on","for","of","from"],"a":0,"e":"Depend on."},{"q":"They complained ___ the slow service.","o":["for","about","to","of"],"a":1,"e":"Complain about."},{"q":"We're looking forward ___ the trip.","o":["for","in","to","at"],"a":2,"e":"Look forward to."},{"q":"He apologised ___ being late.","o":["for","about","to","of"],"a":0,"e":"Apologise for."}]},{"g":19,"u":28,"title":"Comparações avançadas: the more..., twice as ... as, by far","level":"B2","explain":["Para intensificar, use **much / far / a lot / slightly** antes do comparativo: *This phone is far faster.* **By far the** + superlativo reforça: *by far the best battery*.","**As ... as** admite multiplicadores: *twice as fast as, three times as expensive as, half as long as*. Para negar: *not as ... as*.","**The + comparativo, the + comparativo** mostra relação: *The more you practise, the better you get.* (Também visto na unidade 5.)"],"ex":[["This laptop is far lighter than my old one.","Este notebook é muito mais leve que o meu antigo."],["It's by far the fastest computer we have.","É de longe o computador mais rápido que temos."],["The new model is twice as expensive as the old one.","O modelo novo é duas vezes mais caro que o antigo."],["This app isn't as reliable as the other one.","Este aplicativo não é tão confiável quanto o outro."],["The faster the internet is, the more we use it.","Quanto mais rápida a internet, mais a usamos."]],"mist":[["It's more cheaper than the other one.","It's cheaper than the other one.","Não use more com comparativo curto (-er)."],["The phone is very faster than mine.","The phone is much faster than mine.","Com comparativo use much/far/a lot, não very."]],"qs":[{"q":"This tablet is ___ better than the old one.","o":["much","more","very","most"],"a":0,"e":"Com comparativo: much."},{"q":"It's ___ the most useful app I have.","o":["so","very","by far","much"],"a":2,"e":"By far the + superlativo."},{"q":"The new phone costs ___ as much as the old one.","o":["second","two","double times","twice"],"a":3,"e":"Twice as ... as."},{"q":"The battery is not ___ good as before.","o":["than","more","as","so much"],"a":2,"e":"Not as ... as."},{"q":"___ you use the app, the better it works.","o":["The more","Most","More","The most"],"a":0,"e":"The more ..., the better ..."},{"q":"This model is slightly ___ than that one.","o":["cheaper","cheapest","more cheap","most cheap"],"a":0,"e":"Cheap + -er: cheaper."}]},{"g":20,"u":29,"title":"So, such, too, enough com ênfase","level":"B2","explain":["**So** + adjetivo ou advérbio: *so tired, so quickly*. **Such** + (adjetivo +) substantivo: *such a long meeting, such good news*. **So much / so many** + substantivo: *so many emails*.","**So ... that** e **such ... that** indicam consequência: *It was such a stressful week that I needed a holiday.*","**Too** (excesso, sentido negativo) e **enough** (suficiente): *too much work*, *too busy to talk*, *experienced enough to lead the team*."],"ex":[["She is so organised that nothing is ever late.","Ela é tão organizada que nada nunca atrasa."],["It was such a long meeting that we all got tired.","Foi uma reunião tão longa que todos nos cansamos."],["We have so many emails to answer.","Temos tantos e-mails para responder."],["I'm too busy to talk right now.","Estou ocupado demais para conversar agora."],["He is experienced enough to lead the team.","Ele tem experiência suficiente para liderar a equipe."]],"mist":[["It was so a long meeting.","It was such a long meeting.","Antes de a + substantivo use such."],["I'm enough tired to go on.","I'm too tired to go on.","Excesso: too; enough fica depois do adjetivo."]],"qs":[{"q":"It was ___ a stressful week that I couldn't sleep.","o":["very","so","too","such"],"a":3,"e":"Such a + adjetivo + substantivo."},{"q":"The team worked ___ hard that they finished early.","o":["too","such","so","enough"],"a":2,"e":"So + advérbio + that."},{"q":"I have ___ many emails to answer today.","o":["so","too","enough","such"],"a":0,"e":"So many + substantivo."},{"q":"She's ___ shy to speak in meetings.","o":["too","enough","such","so"],"a":0,"e":"Too + adjetivo (excesso)."},{"q":"He wasn't qualified ___ for the job.","o":["so","enough","such","too"],"a":1,"e":"Adjetivo + enough."},{"q":"They gave us ___ good feedback that we felt proud.","o":["very","too","so","such"],"a":3,"e":"Such + adjetivo + incontável."}]},{"g":21,"u":30,"title":"Question tags e perguntas indiretas","level":"B2","explain":["**Question tags** confirmam algo: frase positiva + tag negativa, frase negativa + tag positiva. *It's a great film, isn't it? You haven't seen it, have you?*","Com **I am**, a tag é **aren't I**. Com **let's**, a tag é **shall we**. Com imperativo, **will you**.","**Perguntas indiretas** são mais educadas e não invertem sujeito e verbo: *Could you tell me where the museum is?* (não *where is the museum*)."],"ex":[["The exhibition is amazing, isn't it?","A exposição é incrível, não é?"],["You haven't seen the film, have you?","Você não viu o filme, viu?"],["Let's go to the concert, shall we?","Vamos ao show, está bem?"],["Could you tell me what time the show starts?","Você poderia me dizer a que horas o show começa?"],["I wonder if the tickets are still available.","Será que os ingressos ainda estão disponíveis?"]],"mist":[["Do you know where is the gallery?","Do you know where the gallery is?","Em pergunta indireta, a ordem é de frase afirmativa."],["She likes jazz, isn't she?","She likes jazz, doesn't she?","A tag repete o auxiliar da frase."]],"qs":[{"q":"It's a wonderful painting, ___?","o":["isn't it","is it","doesn't it","wasn't it"],"a":0,"e":"Positiva + tag negativa."},{"q":"You haven't read the book, ___?","o":["have you","do you","haven't you","did you"],"a":0,"e":"Negativa + tag positiva."},{"q":"I'm right, ___?","o":["amn't I","isn't I","aren't I","am I not"],"a":2,"e":"Com I am: aren't I."},{"q":"Could you tell me where ___?","o":["is the cinema","the cinema does","is cinema the","the cinema is"],"a":3,"e":"Pergunta indireta: ordem direta."},{"q":"Let's go to the theatre, ___?","o":["do we","will we","shall we","don't we"],"a":2,"e":"Let's: shall we."},{"q":"Do you know what time ___?","o":["the film does start","the film starts","does the film start","starts the film"],"a":1,"e":"Pergunta indireta: sem do/does."}]},{"g":22,"u":31,"title":"Make, let, allow e force: estruturas com causa","level":"B2","explain":["**Make + pessoa + verbo sem to** = obrigar/fazer alguém fazer: *They made us wait.* **Let + pessoa + verbo sem to** = deixar: *My boss let me leave early.*","**Allow / permit + pessoa + to + verbo** = permitir: *The law allows people to vote at 16.* **Force / require + pessoa + to** = forçar/exigir: *The rules force companies to pay taxes.*","Na voz passiva, **make** passa a usar to: *We were made to wait.* **Let** é substituído por **be allowed to**: *We were allowed to leave.*"],"ex":[["The film made me think about poverty.","O filme me fez pensar sobre a pobreza."],["Parents shouldn't let children work.","Os pais não deveriam deixar crianças trabalharem."],["The law allows citizens to protest.","A lei permite que os cidadãos protestem."],["Poverty forces many families to leave their homes.","A pobreza obriga muitas famílias a deixar suas casas."],["They were made to leave the building.","Eles foram obrigados a deixar o prédio."]],"mist":[["She made me to wait.","She made me wait.","Make + pessoa + verbo sem to (na ativa)."],["They let us to go home.","They let us go home.","Let + pessoa + verbo sem to."]],"qs":[{"q":"The teacher made us ___ the essay again.","o":["write","wrote","to write","writing"],"a":0,"e":"Make + pessoa + verbo sem to."},{"q":"My parents let me ___ out late on weekends.","o":["staying","to stay","stayed","stay"],"a":3,"e":"Let + pessoa + verbo sem to."},{"q":"The law doesn't allow people ___ in the park.","o":["camped","to camp","camp","camping"],"a":1,"e":"Allow + pessoa + to."},{"q":"The company forced him ___ his job.","o":["leave","leaving","left","to leave"],"a":3,"e":"Force + pessoa + to."},{"q":"We were made ___ for two hours.","o":["to wait","waited","waiting","wait"],"a":0,"e":"Make na passiva: to."},{"q":"Visitors aren't ___ to take photos here.","o":["let","permit","allowed","letting"],"a":2,"e":"Be allowed to."}]},{"g":23,"u":32,"title":"Phrasal verbs: separáveis e inseparáveis","level":"B2","explain":["Phrasal verbs **separáveis** aceitam o objeto no meio: *turn the offer down* ou *turn down the offer*. Com pronome, o objeto vai obrigatoriamente no meio: *turn it down* (nunca *turn down it*).","Os **inseparáveis** mantêm o verbo e a partícula juntos: *look after the kids, run into an old friend, get over a problem*. O objeto sempre vem depois.","Alguns têm **três partes** e também são inseparáveis: *look forward to, put up with, get on with, live up to*."],"ex":[["She turned down the job offer.","Ela recusou a oferta de emprego."],["She turned it down.","Ela a recusou."],["I ran into my old boss yesterday.","Encontrei meu antigo chefe por acaso ontem."],["You need to look after your career.","Você precisa cuidar da sua carreira."],["He couldn't live up to their expectations.","Ele não conseguiu corresponder às expectativas deles."]],"mist":[["She turned down it.","She turned it down.","Com pronome, o objeto vai no meio."],["I ran my old boss into.","I ran into my old boss.","Run into é inseparável."]],"qs":[{"q":"He offered me a better job, but I ___.","o":["down turned it","turned down it","turned it off","turned it down"],"a":3,"e":"Pronome fica no meio de verbo separável."},{"q":"I bumped ___ an old colleague at the airport.","o":["by","at","on","into"],"a":3,"e":"Run/bump into = encontrar por acaso."},{"q":"She's looking ___ her sick mother this week.","o":["after","at","out","on"],"a":0,"e":"Look after = cuidar de."},{"q":"Don't give ___; success takes time.","o":["up","on","off","in"],"a":0,"e":"Give up = desistir."},{"q":"I'm really looking forward ___ the new project.","o":["at","on","for","to"],"a":3,"e":"Look forward to."},{"q":"He quickly ___ the problem.","o":["got it over","got on","over got","got over"],"a":3,"e":"Get over = superar (inseparável)."}]}];

var UE_PASS=8;
function ueItem(u){return UEX.filter(function(x){return x.n===u;})[0];}
function ueForms(s){
  var t=norm(s).replace(/\bcan not\b/g,'cannot').replace(/\bcan't\b/g,'cannot').replace(/\bwon't\b/g,'will not').replace(/\bshan't\b/g,'shall not')
    .replace(/n't\b/g,' not').replace(/'ll\b/g,' will').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ve\b/g,' have');
  var out=[t];
  [["'d",['would','had']],["'s",['is','has']]].forEach(function(p){
    var nx=[];out.forEach(function(x){
      if(x.indexOf(p[0])<0){nx.push(x);return;}
      p[1].forEach(function(r){nx.push(x.split(p[0]).join(' '+r));});
    });out=nx;
  });
  return out.map(function(x){return x.replace(/\s+/g,' ').trim();});
}
function ueOk(given,accepted){
  var g=ueForms(given);if(!g[0])return false;
  g=g.concat(g.filter(function(x){return /^(i|you|we|they|he|she|it) /.test(x);}).map(function(x){return x.replace(/^\S+ /,'');}));
  return accepted.some(function(a){var f=ueForms(a);return f.some(function(x){return g.indexOf(x)>=0;});});
}
function ueItems(u){
  var it=ueItem(u);if(!it)return [];
  return it.wf.map(function(x){return {t:'wf',s:x[0],key:x[1],acc:x[2]};}).concat(it.kt.map(function(x){return {t:'kt',o:x[0],key:x[1],s:x[2],acc:x[3]};}));
}

function ueCheck(){
  var s=S.ue;if(!s||s.done)return;
  var items=ueItems(s.u),any=false;
  s.res=items.map(function(it,i){var v=S.drafts[ueDraft(s.u,i)]||'';if(norm(v))any=true;return ueOk(v,it.acc);});

}

  });

}

var LAX=[{"id":"gig","u":2,"title":"The gig economy","level":"B2","about":"Entrevista de rádio sobre trabalho por aplicativo, liberdade e segurança financeira.","spk":[{"name":"Host","lang":"US","acc":"americano"},{"name":"Dr. Nair","lang":"IN","acc":"indiano"}],"lines":[{"s":0,"t":"Welcome back to Money Matters. Today we're talking about the gig economy, which means people who earn their living through apps and short jobs instead of a regular contract. With me is economist Dr. Priya Nair. Dr. Nair, how big is this phenomenon?"},{"s":1,"t":"Bigger than most people realise. In many countries, roughly one worker in six now does some kind of platform work, either as a main income or on the side. And the numbers have been growing every year since the early two thousand tens."},{"s":0,"t":"Why do people choose it? Is it mostly about money?"},{"s":1,"t":"Actually, no. When we ask workers, the first answer is almost always flexibility. They like deciding when to start and when to stop. A mother can work while the children are at school, a student can work at weekends, and a retired person can earn a little extra without a full-time schedule."},{"s":0,"t":"That sounds positive. So where is the problem?"},{"s":1,"t":"The problem is what the flexibility hides. A driver who works whenever he wants also pays for his own car, his own fuel, his own insurance and his own holidays. If he gets sick, nobody pays him. If the app lowers the price per kilometre, he can't negotiate. So the freedom is real, but it comes with a lot of risk that used to belong to the employer."},{"s":0,"t":"Some companies say these workers are independent businesspeople, not employees."},{"s":1,"t":"Which is partly true, and that is why the debate is so difficult. A real businessperson sets his own prices and chooses his own customers. Many platform workers can't do either of those things. Several courts in Europe have already said that, in certain cases, drivers should be treated as employees. Other countries have chosen a middle path, with a special status that gives some protection but not all of it."},{"s":0,"t":"What would you advise someone who depends on this kind of income?"},{"s":1,"t":"Three things. First, keep track of your real costs, because many people only look at what comes in, not at what is left after expenses. Second, build a safety fund of at least three months, because the income can change from week to week. And third, don't depend on a single platform. If one app changes its rules overnight, you need another option."},{"s":0,"t":"Is it all bad news, then?"},{"s":1,"t":"Not at all. For many people the gig economy is a bridge. It helps them pay the bills while they study, start a small business or look for a better job. The mistake is to see it as a bridge and then stay on it for fifteen years without any protection."},{"s":0,"t":"Dr. Nair, thank you very much."},{"s":1,"t":"My pleasure."}],"qs":[{"q":"According to Dr. Nair, what do workers say is the main reason for choosing platform work?","o":["Having a long-term contract","Higher pay than regular jobs","Flexibility over their working hours","Being able to choose their customers"],"a":2,"e":"Ela diz que a primeira resposta é quase sempre flexibilidade, não dinheiro."},{"q":"What does Dr. Nair mean when she says the flexibility 'hides' a problem?","o":["Workers have to work more hours than before","The apps do not allow people to stop working","Workers are not allowed to have other jobs","Workers carry costs and risks that employers used to carry"],"a":3,"e":"O motorista paga carro, combustível, seguro e férias, e ninguém paga se ele ficar doente."},{"q":"Why is the debate about independent workers so difficult?","o":["All courts agree that drivers are employees","Many platform workers cannot set prices or choose customers like real businesspeople","Most workers want to become employees","Companies refuse to talk about the subject"],"a":1,"e":"Ela diz que é em parte verdade: um empresário de verdade define preços e clientes, mas muitos não podem."},{"q":"Which advice does Dr. Nair NOT give?","o":["Do not depend on a single platform","Build a safety fund of about three months","Choose the platform that pays the most per hour","Keep track of real costs after expenses"],"a":2,"e":"Ela dá três conselhos: controlar custos, ter reserva de 3 meses e não depender de uma só plataforma."},{"q":"What happened in several courts in Europe?","o":["They gave drivers a higher fuel allowance","They said that in some cases drivers should be treated as employees","They closed several platforms","They forbade people from working at weekends"],"a":1,"e":"Ela diz que vários tribunais europeus decidiram que, em certos casos, motoristas são empregados."},{"q":"What is Dr. Nair's final opinion about the gig economy?","o":["It is the best system for every worker","It only works for retired people","It can be a useful bridge, but a bad place to stay for many years without protection","It should be forbidden because it is dangerous"],"a":2,"e":"Ela chama de ponte: útil para pagar contas enquanto estuda ou procura algo melhor, mas ruim por 15 anos sem proteção."}]},{"id":"abroad","u":4,"title":"Living abroad","level":"B2","about":"Dois amigos conversam sobre a experiência de morar e trabalhar em outro país.","spk":[{"name":"Lucy","lang":"GB","acc":"britânica"},{"name":"Ben","lang":"AU","acc":"australiano"}],"lines":[{"s":0,"t":"Ben! I haven't seen you since you moved to Canada. How long has it been now, two years?"},{"s":1,"t":"Nearly three, actually. I've been living in Vancouver since March of the year before last, and honestly, it's gone by so quickly."},{"s":0,"t":"So tell me everything. Was it what you expected?"},{"s":1,"t":"Yes and no. The work side was easier than I thought. My company had already arranged my visa, and my new team was really welcoming. What I didn't expect was how lonely the first months would be."},{"s":0,"t":"Really? You're one of the most sociable people I know."},{"s":1,"t":"That's what I thought too. But making friends as an adult is hard everywhere, and it's even harder when you don't share the same jokes or the same history. In Australia I could say a few words and everyone understood. In Canada I kept having to explain myself."},{"s":0,"t":"Did you speak with anyone about it?"},{"s":1,"t":"Not at first. I kept telling my family everything was fantastic, because I didn't want them to worry. Then one day my sister called and said she could hear in my voice that something was wrong. That was the moment I admitted it."},{"s":0,"t":"And what changed?"},{"s":1,"t":"Small things, honestly. I joined a climbing club, which meant I had a reason to see the same people every Tuesday. I started saying yes to every invitation, even when I was tired. And I stopped comparing everything with home. Once I did that, the city began to feel like mine."},{"s":0,"t":"I think that's great advice. I've been thinking about taking a job in Germany, and I'm a bit scared."},{"s":1,"t":"Scared is normal. If you want my opinion, the biggest mistake is to plan everything and wait until you feel ready. You'll never feel completely ready. What helps is learning a little of the language before you arrive, and having a plan for the first three months."},{"s":0,"t":"A plan for what exactly?"},{"s":1,"t":"Where you will live, how you will meet people, and what you'll do on a bad day. Have a list of things that make you feel good, like a favourite café or a phone call with a friend. It sounds silly, but on difficult days you'll be grateful for it."},{"s":0,"t":"Thanks, Ben. I feel better already."},{"s":1,"t":"And if you do go, I'll visit you. I've never seen the Christmas markets in Germany."}],"qs":[{"q":"How long has Ben been in Canada?","o":["About one year","More than five years","Exactly two years","Nearly three years"],"a":3,"e":"Ele diz que faz quase três anos (nearly three)."},{"q":"What was harder than Ben expected?","o":["Understanding his team","Feeling lonely in the first months","Finding a job","Getting a visa"],"a":1,"e":"Visto e trabalho foram fáceis; a solidão dos primeiros meses foi a surpresa."},{"q":"Why did Ben tell his family that everything was fantastic?","o":["He was embarrassed about his job","He had not had time to think about it","He did not want them to worry","He thought his sister would not listen"],"a":2,"e":"Ele não queria preocupar a família."},{"q":"What made Ben admit that something was wrong?","o":["A friend asked him directly","He got sick","He lost his job","His sister noticed it in his voice"],"a":3,"e":"A irmã ligou e percebeu pela voz."},{"q":"Which of these did Ben do to improve his situation?","o":["He stopped calling home","He joined a regular activity and accepted invitations","He moved to another city","He changed company"],"a":1,"e":"Entrou num clube de escalada e passou a dizer sim aos convites."},{"q":"What does Ben think is the biggest mistake when moving abroad?","o":["Having a plan","Learning the language too early","Visiting friends in the first month","Waiting to feel completely ready"],"a":3,"e":"Ele diz que o maior erro é planejar tudo e esperar se sentir pronto, porque nunca se sente."}]},{"id":"tourism","u":6,"title":"Is tourism ruining our cities?","level":"B2","about":"Palestra sobre os efeitos do turismo em massa nas cidades históricas.","spk":[{"name":"Prof. Walsh","lang":"IE","acc":"irlandês"}],"lines":[{"s":0,"t":"Good afternoon, everyone. Let me start with a number. Last year, more than one billion international trips were made around the world. For a small city with a beautiful old centre, that can feel like an invasion."},{"s":0,"t":"Take Venice. It has about fifty thousand permanent residents, but on a busy summer day it can receive more than that number in visitors, all in a space you can cross on foot in forty minutes. Local people tell me they sometimes cannot get on their own bus, because it is full of tourists with suitcases."},{"s":0,"t":"Now, I don't want to say that tourism is simply bad. In many places it provides jobs, pays for restaurants, museums and festivals, and brings new people and new ideas. In some regions, tourism is the only reason young people don't have to leave to find work."},{"s":0,"t":"The difficulty is not tourism itself. It is the speed and the concentration. When thousands of people visit the same three streets, the shops that serve local people disappear. A bakery becomes a souvenir stand. A family home becomes a short-term rental. Rents go up, residents leave, and the city loses exactly the thing the visitors came to see, which is real life."},{"s":0,"t":"So what are cities trying? Some have introduced a daily entrance fee, like a ticket, for day visitors. The idea is to discourage people who only come for a few hours and spend very little. Others have limited the number of days a flat can be rented to tourists, or have forbidden new hotels in the historic centre."},{"s":0,"t":"Do these measures work? The honest answer is that it's too early to say. Entrance fees seem to reduce the biggest crowds on the busiest days, but critics point out that wealthy visitors will happily pay and the problem remains. Restrictions on rentals have helped in some cities, but in others owners simply found new ways around the rules."},{"s":0,"t":"What I find more promising is a different idea: spreading visitors in time and in space. If a city promotes its lesser known neighbourhoods and encourages travel in spring and autumn, the pressure falls on the main attractions and the benefits reach more families."},{"s":0,"t":"As travellers, we can do something too. Stay longer in one place instead of visiting five cities in five days. Eat where local people eat. Ask yourself, before you take a photograph, whether you're behaving the way you would like a visitor to behave in your own street."},{"s":0,"t":"I'd like to finish with a question rather than an answer. If the most beautiful cities in the world become too crowded to live in, who will we be visiting? Thank you. I'm happy to take questions."}],"qs":[{"q":"Why does the speaker mention Venice?","o":["To compare it with a bigger city","To praise its public transport","To show how crowded a small city can become","To say that tourism has ended there"],"a":2,"e":"Ele usa Veneza como exemplo de cidade pequena que recebe mais visitantes por dia do que tem moradores."},{"q":"What positive effect of tourism does the speaker mention?","o":["It always lowers the price of housing","It reduces the number of residents","It can help young people stay and find work locally","It makes local shops grow"],"a":2,"e":"Ele diz que em algumas regiões o turismo é a razão de os jovens não terem de sair para trabalhar."},{"q":"According to the speaker, what is the main difficulty with tourism?","o":["The money it brings","The cost of hotels","The age of the tourists","The speed and concentration of visitors"],"a":3,"e":"Ele diz que o problema não é o turismo em si, mas a velocidade e a concentração."},{"q":"What do critics say about daily entrance fees?","o":["Wealthy visitors may pay and the problem remains","They are too low to matter","They are illegal in most countries","They only affect residents"],"a":0,"e":"Os críticos dizem que visitantes ricos pagam sem problema e o problema continua."},{"q":"Which idea does the speaker find more promising?","o":["Spreading visitors across time and places","Building more hotels","Closing the historic centre","Forbidding all rentals"],"a":0,"e":"Ele prefere espalhar visitantes no tempo (primavera e outono) e no espaço (bairros menos conhecidos)."},{"q":"What is the purpose of the speaker's final question?","o":["To end the lecture quickly","To make the audience think about the long-term consequences","To announce a new law","To criticise the audience"],"a":1,"e":"Ele termina com uma pergunta reflexiva: se as cidades ficarem inabitáveis, o que vamos visitar?"}]},{"id":"language","u":8,"title":"Learning a language as an adult","level":"B2","about":"Podcast sobre por que adultos aprendem idiomas de um jeito diferente das crianças.","spk":[{"name":"Anna","lang":"US","acc":"americana"},{"name":"Tom","lang":"GB","acc":"britânico"}],"lines":[{"s":0,"t":"Hello and welcome to the Study Smarter podcast. I'm Anna, and with me is Tom, who has just passed an advanced exam in Spanish at the age of forty-four. Tom, congratulations."},{"s":1,"t":"Thanks, Anna. It took me five years, so I'm very glad it's finished. Although to be honest, language learning is never really finished."},{"s":0,"t":"A lot of people believe that adults simply cannot learn languages as well as children. Is that true?"},{"s":1,"t":"It's partly true, but not in the way people imagine. Children are better at copying sounds, so they usually get a more natural accent. But adults have advantages that children don't have. We can read, we understand grammar rules, and we know why we are studying, which gives us a stronger reason to continue."},{"s":0,"t":"What was the hardest part for you?"},{"s":1,"t":"Speaking. For years I could read newspaper articles but I froze when a real person asked me a question. I was so afraid of making mistakes that I preferred to say nothing."},{"s":0,"t":"How did you solve that?"},{"s":1,"t":"I paid for two lessons a week with a private teacher, and I made one rule: during the lesson I was not allowed to apologise. If I made a mistake, I corrected it and carried on. It sounds minor, but it completely changed how I felt."},{"s":0,"t":"Did you use apps as well?"},{"s":1,"t":"Yes, but only for short daily practice. Five or ten minutes, mainly vocabulary. The real progress happened when I started doing things in Spanish rather than studying Spanish. I watched football matches, I cooked from recipes written in Spanish, and I even changed the language of my phone."},{"s":0,"t":"Was there a moment when you felt you had really improved?"},{"s":1,"t":"Yes. About three years in, I was on holiday in Seville and the waiter began to answer me in English. I told him politely that I'd prefer to continue in Spanish, and he replied, you speak better than you think. It was a small moment, but I remember it perfectly."},{"s":0,"t":"What advice would you give to somebody who is just starting?"},{"s":1,"t":"Be patient with yourself. Learn the sentences you actually need, not the ones in the textbook. Find one person to speak with regularly, even for ten minutes. And accept that for a long time you will sound like a child. It's not a failure. It's the road."},{"s":0,"t":"Tom, thank you, and good luck with the next language."},{"s":1,"t":"I'm thinking about Italian, but my wife says I should rest first."}],"qs":[{"q":"How long did it take Tom to pass his Spanish exam?","o":["Ten years","Five years","Two years","Three years"],"a":1,"e":"Ele diz: it took me five years."},{"q":"According to Tom, what advantage do adults have over children?","o":["They are less afraid of mistakes","They learn accents more easily","They have more free time","They understand grammar rules and have strong reasons to study"],"a":3,"e":"Adultos entendem regras de gramática e sabem por que estão estudando."},{"q":"What was Tom's main problem?","o":["He was afraid of making mistakes when speaking","He did not know any grammar","He could not read newspapers","He had no time to study"],"a":0,"e":"Ele lia bem, mas travava na hora de falar com medo de errar."},{"q":"What rule did Tom make for his lessons?","o":["He had to speak only in English","He could not apologise for mistakes","He could not use a dictionary","He had to write every word"],"a":1,"e":"Ele não podia pedir desculpas pelos erros: corrigia e seguia em frente."},{"q":"What does Tom say about apps?","o":["He used them instead of lessons","He thinks they are useless","He used them for four hours a day","He used them only for short daily practice"],"a":3,"e":"Ele usou apps só para 5 ou 10 minutos de vocabulário."},{"q":"Why does Tom remember the moment in Seville?","o":["He met his wife","The waiter told him his Spanish was better than he thought","He failed an exam","He lost his wallet"],"a":1,"e":"O garçom começou em inglês, ele pediu para continuar em espanhol e ouviu que falava melhor do que pensava."}]},{"id":"sleep","u":10,"title":"Sleep and productivity","level":"B2","about":"Palestra sobre sono, desempenho no trabalho e hábitos que ajudam a dormir melhor.","spk":[{"name":"Dr. Hughes","lang":"AU","acc":"australiano"}],"lines":[{"s":0,"t":"Thanks for coming. I'd like to start with a confession. For most of my career I was proud of sleeping five hours a night. I thought sleep was a luxury for people with less to do. I was completely wrong, and today I want to explain why."},{"s":0,"t":"Let's begin with what happens when we sleep. During the night the brain doesn't simply switch off. It moves information from short-term to long-term memory, it removes waste products that build up during the day, and it prepares us emotionally for tomorrow. When we cut that process short, we don't just feel tired. We think more slowly, we make more mistakes, and we become irritable."},{"s":0,"t":"One study followed a group of people who slept six hours a night for two weeks. At the end, their performance on attention tests was as bad as people who had been awake for twenty-four hours. And here's the surprising part: they didn't realise it. They said they felt fine. Tired people are poor judges of how tired they are."},{"s":0,"t":"So how much do we need? For most adults, between seven and nine hours. A small number of people genuinely function on less, but they are much rarer than people claim. If you need an alarm clock to wake up every day, and you sleep three hours longer on holiday, that's a sign you're not getting enough."},{"s":0,"t":"What can we do? First, keep regular hours. Going to bed and waking up at the same time, even on weekends, helps the body clock more than almost anything else. Second, watch your caffeine. A coffee at four in the afternoon is still in your body at ten at night. Third, give yourself half an hour without screens before bed. The light from a phone tells the brain it's daytime."},{"s":0,"t":"And what about napping? A short nap of twenty minutes can improve alertness, especially in the early afternoon. But a long nap late in the day can make it harder to fall asleep at night, so it can do more harm than good."},{"s":0,"t":"Finally, a word for people who work at night or have irregular schedules, like drivers or nurses. You can't always choose your hours, but you can protect your sleeping environment. Make the room dark, keep it cool, and tell the people around you that this time is not negotiable."},{"s":0,"t":"I know that sleeping more sounds like a loss of time. But if you can do in six focused hours after a good night what would take you ten tired hours otherwise, then sleep isn't the enemy of productivity. It is its foundation. Thank you."}],"qs":[{"q":"What does the speaker confess at the beginning?","o":["He never slept well","He used to be proud of sleeping very little","He was always tired at work","He has not slept for a week"],"a":1,"e":"Ele se orgulhava de dormir 5 horas e achava sono um luxo."},{"q":"What does the brain do while we sleep?","o":["It prepares food for the body","It stops all activity","It only rests the eyes","It stores memories and removes waste products"],"a":3,"e":"Passa informação para a memória de longo prazo, remove resíduos e prepara emocionalmente."},{"q":"What was surprising about the study of people who slept six hours?","o":["They did not realise how badly they were performing","They performed better than before","They wanted to sleep ten hours","They fell asleep during the tests"],"a":0,"e":"Eles estavam tão mal quanto quem ficou 24 horas acordado, mas diziam estar bem."},{"q":"Which is a sign that someone is not sleeping enough?","o":["Sleeping much longer on holiday than on workdays","Waking up before the alarm","Dreaming every night","Drinking tea in the morning"],"a":0,"e":"Quem precisa de despertador e dorme 3 horas a mais nas férias provavelmente dorme pouco."},{"q":"What does the speaker say about naps?","o":["Naps should be at least two hours","All naps are harmful","Naps are better than a full night","Short naps help, but long late naps can hurt night sleep"],"a":3,"e":"Cochilo de 20 minutos ajuda; um longo e tarde atrapalha o sono da noite."},{"q":"What advice does he give to people with irregular schedules?","o":["Sleep only during the day","Protect the sleeping environment and make that time non-negotiable","Drink more coffee","Avoid sleeping at all"],"a":1,"e":"Quarto escuro e fresco, e avisar quem está por perto que esse horário é inegociável."}]},{"id":"lighthouse","u":12,"title":"The mystery of the lighthouse","level":"B2","about":"Narrativa sobre um caso misterioso real: três faroleiros que desapareceram em 1900.","spk":[{"name":"Narrator","lang":"IE","acc":"irlandês"}],"lines":[{"s":0,"t":"In December 1900, a supply ship arrived at a remote lighthouse on the Flannan Isles, off the coast of Scotland. The captain expected to see the three keepers waiting to welcome him. Instead, nobody came to the landing place. The flag was not flying, and the door of the lighthouse was closed."},{"s":0,"t":"When he finally went inside, he found the beds unmade and a meal half eaten on the table. One chair had been knocked over. The clocks had stopped. The three men had simply disappeared."},{"s":0,"t":"The investigators who arrived later noticed several strange details. Two of the keepers' waterproof coats were missing, but the third coat was still hanging on its hook. This suggested that two men had gone outside, and that the third had left without a coat, perhaps in a hurry."},{"s":0,"t":"The logbook had been written up until the day before. The last entries spoke of a terrible storm, and of one keeper who was unusually quiet and anxious. But the weather records for those days show that the sea was calm. So either the entries were wrong, or the men were seeing something the records didn't show."},{"s":0,"t":"Over the years, many explanations have been suggested. Some people said a giant wave must have swept the men from the rocks. That could be true. The cliff there is high, but in a very strong storm waves can reach incredible heights. Others believed the men might have fought, and that one of them had killed the others before falling into the sea. There is no evidence for this, and the men had worked together for a long time without any known problems."},{"s":0,"t":"A third theory is the most practical. One of the keepers may have gone down to the landing place to secure a box of equipment, and a wave took him. The second tried to rescue him and was also lost. The third man, who had stayed behind, would have run out without his coat when he saw what was happening, and the sea took him too. It's sad, but it explains the missing coats."},{"s":0,"t":"Of course, there are also more dramatic explanations involving sea monsters and ghosts. These can't be proved, and I wouldn't take them seriously. What I find interesting is that, more than a hundred years later, nobody has found any new evidence. The truth may be lying at the bottom of the sea."},{"s":0,"t":"The lighthouse is now automatic, and nobody lives there. But on stormy nights, local fishermen say they can still see its light, shining from the rocks like a warning."}],"qs":[{"q":"What did the captain find when he arrived at the lighthouse?","o":["The ship's crew had already landed","The keepers were sleeping","The lighthouse was on fire","The door was closed and nobody was waiting for him"],"a":3,"e":"Ninguém veio ao cais, a bandeira não estava hasteada e a porta estava fechada."},{"q":"What do the missing coats suggest?","o":["Two men went outside and one left without a coat in a hurry","The coats were stolen by the captain","All three men left for a long journey","The keepers were having a party"],"a":0,"e":"Faltavam dois casacos; o terceiro ficou, sugerindo que alguém saiu com pressa."},{"q":"What is strange about the logbook?","o":["It mentions a ship that did not exist","It was written by someone else","It describes a storm, but the weather records show calm seas","It was completely empty"],"a":2,"e":"O diário falava de tempestade, mas os registros de tempo mostram mar calmo."},{"q":"What does the narrator say about the theory that one keeper killed the others?","o":["It is the most probable explanation","It was confirmed by the logbook","There is no evidence for it","It has been proved"],"a":2,"e":"Ele diz que não há evidência e que os homens trabalhavam juntos sem problemas."},{"q":"Which explanation does the narrator call 'the most practical'?","o":["They escaped on a boat","They left to work at another lighthouse","A wave took the men one after another while they tried to help","They were taken by a monster"],"a":2,"e":"Um foi levado por uma onda, o segundo tentou salvá-lo e o terceiro correu sem casaco."},{"q":"How does the narrator feel about the explanations with sea monsters and ghosts?","o":["He believes them completely","He wants to investigate them","He does not take them seriously","He thinks they are the only answer"],"a":2,"e":"Ele diz que não podem ser provadas e que não as levaria a sério."}]},{"id":"electric","u":14,"title":"Electric cars: are they worth it?","level":"B2","about":"Debate de rádio sobre vantagens e desvantagens dos carros elétricos.","spk":[{"name":"Host","lang":"AU","acc":"australiano"},{"name":"Karen","lang":"US","acc":"americana"},{"name":"James","lang":"GB","acc":"britânico"}],"lines":[{"s":0,"t":"Welcome to the Great Debate. Tonight's question is simple: should ordinary drivers switch to electric cars? With me are Karen, who has driven an electric car for three years, and James, who is not convinced. Karen, you start."},{"s":1,"t":"Thank you. For me, the biggest advantage is the running cost. I charge the car at home overnight, and I spend about a third of what I used to spend on petrol. There are fewer moving parts, so the maintenance is also much cheaper. And of course there's the quiet, smooth drive, which I really enjoy."},{"s":2,"t":"I'm glad it works for you, Karen, but you have a house with a garage. Millions of people live in flats and have nowhere to charge. For them, using public chargers is more expensive, and sometimes you queue for half an hour."},{"s":1,"t":"That's a fair point, and it's the main weakness at the moment. But governments are building chargers quickly, and it's getting better every year."},{"s":2,"t":"Maybe. My other problem is the price. A new electric car can cost a third more than a similar petrol car. If I had that much money, I'd think twice. I'd rather buy a small used petrol car and drive it for ten years."},{"s":1,"t":"The gap is closing, though. Several manufacturers now offer models that cost about the same as a petrol car, and the used market is growing, too."},{"s":0,"t":"What about the environment? Isn't making the battery harmful?"},{"s":2,"t":"Exactly my worry. Producing a battery needs a lot of energy and mining, which has its own social and environmental costs."},{"s":1,"t":"That's true, but studies show that over its whole life an electric car produces much less pollution than a petrol one, even when you include the battery. And batteries can be reused or recycled, which is improving fast."},{"s":0,"t":"James, what would convince you?"},{"s":2,"t":"Honestly? If I could be sure that it would work for long journeys without planning every stop, and if the second-hand price held up. If I buy a car for twenty thousand and after five years it's worth almost nothing, that's a risk."},{"s":1,"t":"I'd say, try one for a week before you decide. Many companies let you rent them. You may be surprised."},{"s":0,"t":"Karen and James, thank you. As always, listeners, you decide. Send us your opinion on our website."}],"qs":[{"q":"What is Karen's main reason for liking her electric car?","o":["It costs much less to run","It is cheaper to buy","It is faster than petrol cars","It has more space"],"a":0,"e":"Ela gasta cerca de um terço do que gastava com gasolina, e a manutenção também é mais barata."},{"q":"Why does James think Karen's situation is not typical?","o":["She lives near a factory","She drives less than most people","She works for an electric car company","She has a house with a garage where she can charge"],"a":3,"e":"Muita gente mora em apartamento e não tem onde carregar."},{"q":"What does James say about the price of electric cars?","o":["They can cost about a third more than similar petrol cars","They are always cheaper than petrol cars","They have no resale value","They are free in some cities"],"a":0,"e":"Ele diz que um carro novo elétrico pode custar um terço a mais."},{"q":"What is Karen's answer about the battery?","o":["Over its whole life, an electric car pollutes less than a petrol car","Batteries cannot be recycled","Nobody has studied the problem","The battery is made without any energy"],"a":0,"e":"Estudos mostram que, no ciclo todo, o elétrico polui menos, mesmo contando a bateria."},{"q":"What would convince James to buy an electric car?","o":["Reliable long journeys and a good second-hand price","A bigger garage","A lower price for petrol","A free charger at work"],"a":0,"e":"Ele quer ter certeza de viagens longas sem planejar cada parada e que o carro mantenha valor."},{"q":"What does Karen suggest at the end?","o":["Build a charger at home","Wait ten years","Rent one for a week before deciding","Buy a used petrol car"],"a":2,"e":"Ela sugere alugar um por uma semana antes de decidir."}]},{"id":"complaint","u":16,"title":"A customer service disaster","level":"B2","about":"Uma mulher conta como resolveu uma reclamação difícil com uma empresa de entregas.","spk":[{"name":"Helen","lang":"GB","acc":"britânica"}],"lines":[{"s":0,"t":"Let me
