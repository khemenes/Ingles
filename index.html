function act(a,t){
  var v=S.view;
  switch(a){
   case 'tab':if(t.dataset.tab==='practice'&&v.tab==='practice'&&!v.chat){if(S.ask&&S.ask.busy&&S.ask.ctl)S.ask.ctl.abort();rpHalt();S.rp=null;S.dit=null;S.lis=null;S.vid=null;S.ex=null;S.vc=null;S.gx=null;S.ue=null;S.la=null;S.ask=null;try{window.speechSynthesis.cancel();}catch(e){}}go({tab:t.dataset.tab,unit:null,step:null});break;
   case 'unit':go({tab:'trail',unit:+t.dataset.n,step:null});break;
   case 'locked':{var ln=+t.dataset.n;if(!b2ok(ln)){flash('Esta unidade ainda está sendo escrita.');break;}flash(ln===33?'Feche as 10 unidades do B2 para abrir a prova final.':ln===23?'Passe no teste de passagem do B1+ para abrir esta unidade.':ln===21?'Feche as 10 unidades do B1 para abrir o teste de passagem.':ln===22?'Feche as 10 unidades do B1+ para abrir o teste de passagem.':ln===11?'Passe no teste de passagem do B1 para abrir esta unidade.':'Feche a unidade '+dn(ln-1)+' para abrir esta.');break;}
   case 'back':go(v.step!=null?{tab:'trail',unit:v.unit,step:null}:{tab:'trail',unit:null,step:null});break;
   case 'step':go({tab:'trail',unit:v.unit,step:+t.dataset.i});break;
   case 'toggle':{var p=Object.assign({},prog(v.unit)),d=(p.done||[]).slice(),k=d.indexOf(v.step);if(k>=0)d.splice(k,1);else d.push(v.step);p.done=d;p.kind='progress';p.n=v.unit;save(pid(v.unit),p);break;}
   case 'score':{var isT=v.step===13,x=parseScore(document.getElementById('score').value,isT?100:10);if(x==null){flash(isT?'Digite um valor de 0 a 100.':'Digite uma nota de 0 a 10.');break;}
     var q=Object.assign({},prog(v.unit),{kind:'progress',n:v.unit});if(isT)q.test=x;else q.final=x;document.getElementById('score').blur();save(pid(v.unit),q);break;}
   case 'clearscore':{var q2=Object.assign({},prog(v.unit),{kind:'progress',n:v.unit});if(v.step===13)q2.test=null;else q2.final=null;save(pid(v.unit),q2);break;}
   case 'exans':S.exAns=+t.dataset.k;render();break;
   case 'aulaend':{var pa=Object.assign({},prog(v.unit),{kind:'progress',n:v.unit}),da=(pa.done||[]).slice();if(da.indexOf(v.step)<0)da.push(v.step);pa.done=da;save(pid(v.unit),pa);go({tab:'trail',unit:v.unit,step:v.step+1});break;}
   case 'check':{var cL=+t.dataset.l,cq=+t.dataset.q,cQ=S.units[v.unit].lessons[cL].exercises[cq],cb='x'+v.unit+'-'+cL+'-'+cq,cv=draftVals(cb,cQ);
     if(!cv.some(function(x){return x.trim();})){flash('Escreva a resposta antes de conferir.');break;}
     setEx(v.unit,cL,cq,gradeQ(cQ,cv)?1:0);break;}
   case 'choose':{var hL=+t.dataset.l,hq=+t.dataset.q,hk=+t.dataset.k,hQ=S.units[v.unit].lessons[hL].exercises[hq];setEx(v.unit,hL,hq,hQ.correct.indexOf(hk)>=0?1:0);break;}
   case 'retry':{var rL=+t.dataset.l,rq=+t.dataset.q,rQ=S.units[v.unit].lessons[rL].exercises[rq];clearDrafts('x'+v.unit+'-'+rL+'-'+rq,rQ);setEx(v.unit,rL,rq,null);break;}
   case 'grade':{var gq=S.units[v.unit].lessons[3].test,gres=[],gok=0;
     gq.forEach(function(q,qi){var r=gradeQ(q,draftVals('t'+v.unit+'-'+qi,q));gres.push(r);if(r)gok++;});
     var gpc=Math.round(gok/gq.length*100);S.testRes={res:gres,ok:gok,pct:gpc};
     save(pid(v.unit),Object.assign({},prog(v.unit),{kind:'progress',n:v.unit,test:gpc}));window.scrollTo(0,0);break;}
   case 'retest':{S.testRes=null;Object.keys(S.drafts).forEach(function(k){if(k.indexOf('t'+v.unit+'-')===0)delete S.drafts[k];});window.scrollTo(0,0);render();break;}
   case 'say':say(t.dataset.say);{var pr0=prFor(t);if(pr0)pr0.hidden=false;}break;
   case 'sayfull':speakRaw(t.dataset.say,0.85);break;
   case 'sayslow':speakRaw(t.dataset.say,0.55);break;
   case 'ditstart':ditStart(t.dataset.n==='mix'?'mix':+t.dataset.n);break;
   case 'ditcheck':ditCheck(false);break;
   case 'ditskip':ditCheck(true);break;
   case 'ditnext':ditNext();break;
   case 'ditback':S.dit=null;try{window.speechSynthesis.cancel();}catch(e){}render();break;
   case 'lisopen':lisOpen(t.dataset.id,t.dataset.from==null?null:+t.dataset.from);window.scrollTo(0,0);break;
   case 'lisplay':lisPlay(t.dataset.id,+t.dataset.r);break;
   case 'lisopt':{var l0=S.lis;if(l0&&!l0.done){l0.ans[+t.dataset.q]=+t.dataset.k;render();}break;}
   case 'lischeck':lisCheck();break;
   case 'listx':S.lis.tx=!S.lis.tx;render();break;
   case 'lisagain':lisOpen(t.dataset.id,S.lis&&S.lis.from);window.scrollTo(0,0);break;
   case 'vidopen':vidOpen(+t.dataset.u,t.dataset.from==null?null:+t.dataset.from);window.scrollTo(0,0);break;
   case 'vidopt':{var v0=S.vid;if(v0&&!v0.done){v0.ans[+t.dataset.q]=+t.dataset.k;render();}break;}
   case 'vidcheck':vidCheck();break;
   case 'vidagain':vidOpen(+t.dataset.u,S.vid&&S.vid.from);window.scrollTo(0,0);break;
   case 'vidback':S.vid=null;render();break;
   case 'exopen':exOpen(t.dataset.k,+t.dataset.u,t.dataset.from==null?null:+t.dataset.from);window.scrollTo(0,0);break;
   case 'exopt':{var e0=S.ex;if(e0&&!e0.done){e0.ans[+t.dataset.q]=+t.dataset.k;render();}break;}
   case 'excheck':exCheck();break;
   case 'exagain':{var f0=S.ex&&S.ex.from;exOpen(t.dataset.k,+t.dataset.u,f0);window.scrollTo(0,0);break;}
   case 'exback':exBack();break;
   case 'gxopen':gxOpen(+t.dataset.g,t.dataset.from==null?null:+t.dataset.from);window.scrollTo(0,0);break;
   case 'gxopt':{var g0=S.gx;if(g0&&!g0.done){g0.ans[+t.dataset.q]=+t.dataset.k;render();}break;}
   case 'gxcheck':gxCheck();break;
   case 'gxagain':{var f1=S.gx&&S.gx.from;gxOpen(+t.dataset.g,f1);window.scrollTo(0,0);break;}
   case 'gxback':gxBack();break;
   case 'ueopen':ueOpen(+t.dataset.u,t.dataset.from==null?null:+t.dataset.from);window.scrollTo(0,0);break;
   case 'uecheck':ueCheck();break;
   case 'ueagain':{var f2=S.ue&&S.ue.from;ueOpen(+t.dataset.u,f2);window.scrollTo(0,0);break;}
   case 'ueback':ueBack();break;
   case 'laopen':laOpen(+t.dataset.i,t.dataset.from==null?null:+t.dataset.from);window.scrollTo(0,0);break;
   case 'laplay':laPlay(S.la.i,t.dataset.p==='all'?'all':+t.dataset.p,+t.dataset.r);break;
   case 'lastop':laStop();break;
   case 'laopt':{var l0=S.la;if(l0&&!l0.done){l0.ans[+t.dataset.q]=+t.dataset.k;render();}break;}
   case 'lacheck':laCheck();break;
   case 'latx':S.la.tx=!S.la.tx;render();break;
   case 'laagain':{var f3=S.la&&S.la.from;laOpen(+t.dataset.i,f3);window.scrollTo(0,0);break;}
   case 'laback':laBack();break;
   case 'vccls':case 'vccopen':vcClsAct(a,t);break;
   case 'vcopen':vcOpen(+t.dataset.u,t.dataset.from==null?null:+t.dataset.from);window.scrollTo(0,0);break;
   case 'vcgo':vcGo();break;
   case 'vcrev':vcRev(t.dataset.from==='rev'?'rev':null);break;
   case 'vcopt':vcAnswer(+t.dataset.k);break;
   case 'vcnext':vcNext();break;
   case 'vcagain':{var v0=S.vc;if(v0){if(v0.u)vcGo();else vcBegin(vcPickRev());}break;}
   case 'vcback':vcBack();break;
   case 'wrsend':wrSend();break;
   case 'wrnew':{var e1=S.ex;if(e1){e1.res=null;e1.err='';render();window.scrollTo(0,0);}break;}
   case 'trask':S.confirmReset='treino';render();break;
   case 'vrec':case 'vstop':case 'vspeak':case 'vhands':voiceAct(a);break;
   case 'pmic':case 'prec':case 'pstop':case 'pclose':psAct(a,t);break;
   case 'rpstart':case 'rprec':case 'rpstop':case 'rpskip':case 'rpnext':case 'rpback':rpAct(a,t);break;
   case 'trzero':trainReset();break;
   case 'icsave':{var k=document.getElementById('icKey'),m=document.getElementById('icModel'),q=document.getElementById('icQuick'),o={};
     if(k&&k.value.trim())o.key=k.value.trim();if(m&&m.value.trim())o.model=m.value.trim();if(q&&q.value.trim())o.quick=q.value.trim();
     IC.saveCfg(o);if(k)k.value='';flash('Ajustes salvos.');S.pending=false;render();break;}
   case 'icinstall':{IC.install().then(function(ok){flash(ok?'App instalado.':'Instalação cancelada.');render();});break;}
   case 'ictest':{flash('Testando…');IC.testConnection().then(function(r){flash(r.msg);});break;}
   case 'icexp':{try{var bl=new Blob([IC.exportData()],{type:'application/json'}),u=URL.createObjectURL(bl),a2=document.createElement('a');a2.href=u;a2.download='ingles-claudio-progresso-'+today()+'.json';document.body.appendChild(a2);a2.click();document.body.removeChild(a2);setTimeout(function(){URL.revokeObjectURL(u);},2000);flash('Backup baixado.');}catch(e){flash('Não foi possível gerar o backup.');}break;}
   case 'icimp':{var f=document.getElementById('icFile');if(f)f.click();break;}
   case 'lisback':S.lis=null;try{window.speechSynthesis.cancel();}catch(e){}render();break;
   case 'pron':{var pr1=prFor(t);if(pr1)pr1.hidden=!pr1.hidden;break;}
   case 'resetask':S.confirmReset=+t.dataset.n;render();break;
   case 'resetno':S.confirmReset=null;render();break;
   case 'resetgo':{var rn=+t.dataset.n;S.confirmReset=null;
     [0,1,2,3].forEach(function(L){if(S.docs.has(cid(rn,L)))remove(cid(rn,L));if(S.docs.has(rid(rn,L)))remove(rid(rn,L));});
     errors().filter(function(e){return e.unit===rn;}).forEach(function(e){remove(e.id);});
     Object.keys(S.drafts).forEach(function(k){if(/^[xt]\d+-/.test(k)&&+k.slice(1).split('-')[0]===rn)delete S.drafts[k];});
     clearUnitExtras(rn);
     save(pid(rn),{kind:'progress',n:rn,done:[],test:null,final:null});flash(uname(rn)+' zerada.');break;}
   case 'unlockall':save('settings',Object.assign({},settings(),{kind:'settings',unlockAll:!settings().unlockAll}));break;
   case 'goal':save('settings',Object.assign({},settings(),{kind:'settings',goal:+t.dataset.g}));break;
   case 'pfpick':S.pfk=t.dataset.k||null;render();break;
   case 'askopen':S.ask={busy:false,stream:'',err:'',q:'',ctl:null,items:((S.docs.get('duvidas')||{}).items||[]).slice()};render();window.scrollTo(0,0);break;
   case 'asksend':askSend();break;
   case 'askback':if(S.ask&&S.ask.ctl&&S.ask.busy)S.ask.ctl.abort();S.ask=null;render();break;
   case 'filter':S.filter=t.dataset.f;render();break;
   case 'exdel':errors().filter(function(e){return e.example;}).forEach(function(e){remove(e.id);});break;
   case 'chatstart':vUnlock();chatStart(false);break;
   case 'chatnew':chatStart(true);break;
   case 'chatsend':chatSend();break;
   case 'chatretry':if(S.chat&&S.chat.lastKind)chatCall(S.chat.lastKind);break;
   case 'chatstop':if(S.chat&&S.chat.ctl)S.chat.ctl.abort();break;
   case 'chatend':if(S.chat&&userCount(S.chat)>=1)chatCall('end');break;
   case 'chatback':if(S.chat&&S.chat.free)go({tab:'practice',unit:null,step:null});else go({tab:'trail',unit:v.unit,step:v.step});break;
   case 'freego':freeStart(t.dataset.id,false);break;
   case 'freenew':freeStart(t.dataset.id,true);break;
   case 'frclose':S.fr=null;render();break;
   case 'rvcheck':{var inp=document.getElementById('rvin'),cur=S.rvCur();if(!inp||!cur)break;var val=inp.value.trim();inp.blur();
     if(!val){flash('Escreva a frase antes de conferir.');break;}
     S.rv={id:cur.id,val:val,res:norm(val)===norm(cur.correct)?1:0,skip:false};render();break;}
   case 'rvskip':{var c2=S.rvCur();if(!c2)break;S.rv={id:c2.id,val:'',res:0,skip:true};render();break;}
   case 'rvself':if(S.rv){S.rv.res=1;render();}break;
   case 'rvnext':if(S.rv)applyReview(S.rv.id,!!S.rv.res);break;
  }
}
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-act]');if(!t)return;var ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&ae!==t&&t.dataset.act!=='chatsend')ae.blur();act(t.dataset.act,t);});
document.addEventListener('mousedown',function(ev){var t=ev.target.closest&&ev.target.closest('[data-act=chatsend]');if(t)ev.preventDefault();});
document.addEventListener('input',function(ev){var k=ev.target&&ev.target.dataset&&ev.target.dataset.draft;if(k)S.drafts[k]=ev.target.value;if(ev.target&&ev.target.id==='wrin'){var c=document.getElementById('wrcount');if(c)c.textContent=wcount(ev.target.value)+' palavras';}});
document.addEventListener('focusout',function(){setTimeout(function(){if(S.pending)render();},0);});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t&&t.id==='icProv'){IC.saveCfg({provider:t.value});flash('Serviço: '+(t.value==='groq'?'Groq':'Gemini')+'.');S.pending=false;render();return;}
  if(!t||t.id!=='icFile'||!t.files||!t.files[0])return;
  var rd=new FileReader();rd.onload=function(){var r=IC.importData(String(rd.result||''));flash(r.ok?'Progresso importado ('+r.n+' itens).':r.msg);t.value='';};rd.onerror=function(){flash('Não consegui ler o arquivo.');};rd.readAsText(t.files[0]);
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter'||!ev.target)return;
  if(ev.target.classList&&ev.target.classList.contains('pw')){ev.preventDefault();act('pron',ev.target);return;}
  if(ev.target.id==='ditin'){ev.preventDefault();ditCheck(false);return;}
  if(/^uein\d+$/.test(ev.target.id||'')){ev.preventDefault();var ni=+ev.target.id.slice(4)+1,nx=document.getElementById('uein'+ni);if(nx)nx.focus();else ueCheck();return;}
  if(ev.target.id==='rvin'){ev.preventDefault();act('rvcheck',ev.target);return;}
  if(ev.target.id==='cmsg'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();chatSend();return;}
  if(ev.target.id==='score'){act('score',ev.target);return;}
  if(ev.target.tagName==='INPUT'&&ev.target.dataset.draft){var q=ev.target.closest('.q'),b=q&&q.querySelector('[data-act=check]');if(b){ev.preventDefault();b.click();}}
});

/* ---------- início ---------- */
render();
(async function(){
  try{S.sample=await window.claude.use('sample');}catch(e){S.sample=null;}
  S.sampleReady=true;render();
})();
(async function(){
  try{
    var user=await window.claude.use('user'),db=await window.claude.use('db');
    var uid=user?await user.id():null;
    if(!db||!uid){S.status='local';S.loaded=true;render();return;}
    S.db=db;S.uid=uid;S.base='data/users/'+uid;
    db.collection(S.base).onSnapshot(function(snap){
      var m=new Map();snap.docs.forEach(function(d){m.set(d.id,d.data());});
      S.docs=m;S.loaded=true;S.status='ok';render();
    },function(){S.status='err';S.loaded=true;render();});
  }catch(e){S.status='local';S.loaded=true;render();}
})();
})();
</script>
</body>
