<style>
/* Layout: uma coluna estreita (celular primeiro), abas fixas embaixo, barra de 16 segmentos = 16 passos de cada unidade */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface2:#E2E8EC; --ink:#111D27; --muted:#566774; --line:#D1D9DF;
  --accent:#0A6B5C; --accent-ink:#FFFFFF; --accent-soft:#D3ECE6;
  --warn:#8F4A00; --warn-soft:#FAE8CF; --crit:#B3261E;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C141B; --surface:#15212B; --surface2:#1F2E3A; --ink:#E7EEF2; --muted:#93A5B1; --line:#27394A;
    --accent:#46C9AD; --accent-ink:#04231D; --accent-soft:#12372F;
    --warn:#F0A851; --warn-soft:#3A2A12; --crit:#F2877F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C141B; --surface:#15212B; --surface2:#1F2E3A; --ink:#E7EEF2; --muted:#93A5B1; --line:#27394A;
  --accent:#46C9AD; --accent-ink:#04231D; --accent-soft:#12372F;
  --warn:#F0A851; --warn-soft:#3A2A12; --crit:#F2877F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-block:20px calc(100px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px;letter-spacing:-.01em} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:focus-visible,.item:focus-visible,#tabs button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;min-height:44px;align-self:flex-start}
.big{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;height:8px}
.seg i{background:var(--surface2);border-radius:1px}.seg i.on{background:var(--accent)}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seg4 .seg{grid-template-columns:repeat(4,1fr);height:12px}
.minis{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.minis i{height:8px;background:var(--surface2);border-radius:2px;overflow:hidden;display:block}
.minis b{display:block;height:100%;background:var(--accent)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.item.locked{opacity:.55}
.badge{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-family:var(--font-display);font-weight:700;font-size:15px}
.badge.ok{background:var(--accent);color:var(--accent-ink)}
.list{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.warnbox strong{color:var(--warn)}
.okbox{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.msg{padding:10px 12px;border-radius:12px;max-width:92%}
.msg.ia{background:var(--surface2);align-self:flex-start}.msg.me{background:var(--accent-soft);align-self:flex-end}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chat .muted{color:var(--muted)}
.corr{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:14px}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:44px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)} .opt.wrong{border-color:var(--crit)}
input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:7em}
.wrongtxt{text-decoration:line-through;text-decoration-color:var(--crit);color:var(--muted)}
.seglabel{display:flex;gap:8px}
.seglabel .btn{flex:1}.seglabel .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;background:none;border:0;padding:0;text-align:left}
.switch .box{flex:none;width:44px;height:26px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative}
.switch .box::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted)}
.switch.on .box{background:var(--accent);border-color:var(--accent)}.switch.on .box::after{left:20px;background:var(--accent-ink)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;color:var(--muted);font-size:12.5px;font-weight:600;position:relative;border-radius:10px}
#tabs button.on{color:var(--accent)}
#tabs .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:var(--surface);font-size:11px;display:grid;place-items:center;padding:0 5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:6;max-width:calc(100% - 32px)}
.prose{display:flex;flex-direction:column;gap:12px}
.prose ul,ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.plain{padding-left:18px}
.ah{font-size:17px;padding-top:6px}
.say{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin:-4px 0 -4px 6px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);vertical-align:middle;cursor:pointer;flex:none}
.say:active{transform:scale(.94)}
.wk{justify-content:space-between;gap:4px}.wd{display:flex;flex-direction:column;align-items:center;gap:4px}.wd .dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}.wd.on .dot{background:var(--accent);border-color:var(--accent)}.wd.today .dot{border-color:var(--accent)}
.dmiss{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px}
.pw{border-bottom:1px dotted var(--accent);cursor:pointer}
.pr{display:block;margin-top:2px;font-size:13.5px;font-weight:600;color:var(--accent);letter-spacing:.2px}
.pr[hidden]{display:none}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl thead th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl tbody th{font-weight:600}
.tipbox{background:var(--warn-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tipbox strong{color:var(--warn)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px}
.qp{line-height:2.1;overflow-wrap:anywhere}
.blankshow{color:var(--muted)}
input.blank{width:8.5em;max-width:100%;display:inline-block;padding:4px 10px;min-height:40px;vertical-align:middle}
input.wide,textarea.wide{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.opt[disabled]{color:var(--ink);cursor:default}
@media (prefers-reduced-motion:no-preference){.card,.item,.step{transition:border-color .15s}}
.emo{margin-right:6px;font-size:1.05em}
details.card>summary{cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:space-between}
.vbar{display:flex;flex-direction:column;gap:8px}
.vmic{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.vmic.rec{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.vlev{flex:1;min-width:80px;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.vlev i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s linear}
.vtog{cursor:pointer;font:inherit;font-size:13px;font-weight:600;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.vtog[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.say.mic{margin-left:4px}
.psheet{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:8px}
.psheet[hidden]{display:none}
</style>
</head>
<body>

<main id="app" class="wrap"></main>
<nav id="tabs" aria-label="Seções do app">
  <button data-act="tab" data-tab="home"></button>
  <button data-act="tab" data-tab="trail"></button>
  <button data-act="tab" data-tab="review"></button>
  <button data-act="tab" data-tab="practice"></button>
  <button data-act="tab" data-tab="errors"></button>
</nav>
<div id="toast" role="status" hidden></div>

<script>
/* ---------- versão independente: armazenamento local + IA por chave de API ---------- */
(function(){
  var CFG_KEY='ic_cfg',DB_KEY='ic_db';
  function lsGet(k){try{return window.localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{window.localStorage.setItem(k,v);return true;}catch(e){return false;}}
  var mem={};
  function readCfg(){try{return JSON.parse(lsGet(CFG_KEY)||'{}')||{};}catch(e){return {};}}
  var OLD_DEFAULTS=['gemini-3.8-flash'],OLD_QUICK=['gemini-3.5-flash-lite'],FALLBACK='gemini-3.6-flash';
  var GROQ_MODEL='openai/gpt-oss-120b',GROQ_FALLBACK='openai/gpt-oss-20b',OLD_GROQ=['llama-3.3-70b-versatile','llama-3.1-8b-instant'];
  function cfg(){
    var c=readCfg();
    if(c.provider==='groq'){var gm=c.groqModel,gq=c.groqQuick;if(!gm||OLD_GROQ.indexOf(gm)>=0)gm=GROQ_MODEL;if(!gq||OLD_GROQ.indexOf(gq)>=0)gq=GROQ_MODEL;return {provider:'groq',key:c.groqKey||'',model:gm,quick:gq};}
    var m=c.model,q=c.quick;if(!m||OLD_DEFAULTS.indexOf(m)>=0)m='gemini-3.5-flash';if(!q||OLD_QUICK.indexOf(q)>=0)q='gemini-3.5-flash';
    return {provider:'gemini',key:c.key||'',model:m,quick:q};
  }
  /* key/model/quick são gravados no serviço que estiver ativo (Gemini ou Groq) */
  function saveCfg(o){
    var c=readCfg();
    if(o.provider==='gemini'||o.provider==='groq')c.provider=o.provider;
    var g=c.provider==='groq';
    ['key','model','quick'].forEach(function(k){if(typeof o[k]==='string')c[g?('groq'+k.charAt(0).toUpperCase()+k.slice(1)):k]=o[k];});
    lsSet(CFG_KEY,JSON.stringify(c));
  }
  function readDb(){try{return JSON.parse(lsGet(DB_KEY)||'{}')||{};}catch(e){return {};}}
  var listeners=[];
  function snapshot(){var d=readDb();return {docs:Object.keys(d).map(function(id){return {id:id,data:function(){return JSON.parse(JSON.stringify(d[id]));}};})};}
  function notify(){var s=snapshot();listeners.forEach(function(f){try{f(s);}catch(e){}});}
  var db={collection:function(){return {
    doc:function(id){return {
      set:function(data){var d=readDb();d[id]=JSON.parse(JSON.stringify(data));if(!lsSet(DB_KEY,JSON.stringify(d)))return Promise.reject(new Error('storage'));setTimeout(notify,0);return Promise.resolve();},
      delete:function(){var d=readDb();delete d[id];lsSet(DB_KEY,JSON.stringify(d));setTimeout(notify,0);return Promise.resolve();}
    };},
    onSnapshot:function(cb){listeners.push(cb);setTimeout(function(){cb(snapshot());},0);return function(){listeners=listeners.filter(function(x){return x!==cb;});};}
  };}};
  function err(code,extra){var e={code:code};if(extra)e.message=extra;return e;}
  function toGem(input){
    var out=[];
    (typeof input==='string'?[{role:'user',content:input}]:input).forEach(function(m){
      var role=m.role==='assistant'?'model':'user',last=out[out.length-1];
      if(last&&last.role===role)last.parts[0].text+='\n\n'+m.content;else out.push({role:role,parts:[{text:String(m.content)}]});
    });
    if(out.length&&out[0].role!=='user')out.unshift({role:'user',parts:[{text:'(start)'}]});
    return out;
  }
  function httpErr(status,body){
    var msg='';try{msg=(JSON.parse(body).error||{}).message||'';}catch(e){}
    if(status===400&&/API key|API_KEY/i.test(msg))return err('bad_key',msg);
    if(status===401||status===403)return err('bad_key',msg);
    if(status===404)return err('bad_model',msg);
    if(status===400&&/model/i.test(msg)&&/(decommission|not exist|not found|does not|no longer)/i.test(msg))return err('bad_model',msg);
    if(status===400&&/json/i.test(msg))return err('invalid_json',msg);
    if(status===429)return err('rate_limited',msg);
    if(status===500||status===502||status===503||status===504)return err('busy',msg);
    if(status===413)return err('prompt_too_large',msg);
    return err('network',msg||('HTTP '+status));
  }
  function toOA(input){
    var out=[];
    (typeof input==='string'?[{role:'user',content:input}]:input).forEach(function(m){
      var role=m.role==='assistant'?'assistant':'user',last=out[out.length-1];
      if(last&&last.role===role)last.content+='\n\n'+m.content;else out.push({role:role,content:String(m.content)});
    });
    if(out.length&&out[0].role!=='user')out.unshift({role:'user',content:'(start)'});
    return out;
  }
  async function call(input,opts,json){
    var c=cfg();if(!c.key)throw err('no_key');
    var groq=c.provider==='groq';
    var model=opts&&opts.modelTier==='default'?c.model:c.quick;
    var sig=opts&&opts.signal,stream=!json&&opts&&typeof opts.onText==='function';
    var WAIT=(typeof window.IC_RETRY_MS==='number')?window.IC_RETRY_MS:2000,FIRST_BYTE=(typeof window.IC_TIMEOUT_MS==='number')?window.IC_TIMEOUT_MS:40000;
    function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
    /* monta o pedido de cada serviço */
    function build(m,think){
      if(groq){
        var msgs=toOA(input);
        /* conversa: a primeira mensagem são as instruções do professor; no Groq elas funcionam melhor como "system" */
        if(Array.isArray(input)&&msgs.length>=2&&msgs[0].role==='user')msgs[0]={role:'system',content:msgs[0].content+(json?'':'\n\nIMPORTANT: Write ONLY your own next message as the teacher. Never write the student\'s lines, never answer your own question, never continue the dialogue for the student.')};
        if(json)msgs.unshift({role:'system',content:'Respond only with one valid JSON object, no extra text.'});
        var gb={model:m,messages:msgs,max_tokens:4096,temperature:0.6};
        /* modelos de raciocínio do Groq: pouco raciocínio, para responder rápido */
        if(think)gb.reasoning_effort=/qwen3/i.test(m)?'none':'low';
        if(json)gb.response_format={type:'json_object'};
        if(stream)gb.stream=true;
        return {url:'https://api.groq.com/openai/v1/chat/completions',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},body:gb};
      }
      var body={contents:toGem(input),generationConfig:{maxOutputTokens:8192}};
      /* nos modelos 3.x o "raciocínio" gasta o mesmo limite da resposta: pedimos pouco raciocínio */
      if(think)body.generationConfig.thinkingConfig={thinkingLevel:'low'};
      if(json)body.generationConfig.responseMimeType='application/json';
      return {url:'https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+(stream?':streamGenerateContent?alt=sse':':generateContent'),headers:{'Content-Type':'application/json','x-goog-api-key':c.key},body:body};
    }
    /* uma tentativa: espera no máximo FIRST_BYTE ms pelo início da resposta */
    async function post(m,think){
      var rq=build(m,think);
      var ac=new AbortController(),timedOut=false;
      var tm=setTimeout(function(){timedOut=true;ac.abort();},FIRST_BYTE);
      var onAbort=function(){ac.abort();};
      if(sig){if(sig.aborted)ac.abort();else sig.addEventListener('abort',onAbort);}
      try{return await fetch(rq.url,{method:'POST',headers:rq.headers,body:JSON.stringify(rq.body),signal:ac.signal});}
      catch(e){
        if(timedOut)throw err('busy','sem resposta em '+Math.round(FIRST_BYTE/1000)+'s');
        if(e&&e.name==='AbortError')throw err('cancelled');
        throw err('network',String(e&&e.message||e));
      }finally{clearTimeout(tm);if(sig)sig.removeEventListener('abort',onAbort);}
    }
    async function attempt(m){
      var think=groq?/gpt-oss|qwen3/i.test(m):/^gemini-3/i.test(m);
      var r=await post(m,think);
      /* se o modelo não aceitar o ajuste de raciocínio, tenta de novo sem ele */
      if(!r.ok&&r.status===400&&think){
        var tx=await r.text();
        if(/think|reason/i.test(tx))r=await post(m,false);
        else return {ok:false,status:400,text:async function(){return tx;}};
      }
      return r;
    }
    /* 2 tentativas no modelo escolhido; se continuar sobrecarregado, 1 tentativa em cada modelo reserva */
    var models=[model];[c.quick,groq?GROQ_FALLBACK:FALLBACK].forEach(function(x){if(models.indexOf(x)<0)models.push(x);});
    var resp=null,lastErr=null;
    for(var mi=0;mi<models.length&&!resp;mi++){
      var tries=mi===0?2:1;

function unitPct(n){if(isP(n)){var p=prog(n);return ((p.test!=null&&p.test>=80?1:0)+(p.final!=null&&p.final>=7?1:0))*50;}return doneCount(n)*6.25;}
function closed(n){return isP(n)?passedP(n):doneCount(n)===16;}
function b2ok(n){return n===33?B2READY.length===10:n>=23&&n<=32?B2READY.indexOf(n)>=0:true;}
function unlocked(n){if(!b2ok(n))return false;if(n===1||settings().unlockAll)return true;if(n===21)return levelClosed(0)===10;if(n===22)return levelClosed(1)===10;if(n===33)return levelClosed(2)===10;if(n===11)return closed(21);if(n===23)return closed(22);return closed(n-1);}
function levelPct(l){var a=LVSTART[l],t=0;for(var n=a;n<a+10;n++)t+=unitPct(n);return t/10;}
function levelClosed(l){var a=LVSTART[l],c=0;for(var n=a;n<a+10;n++)if(closed(n))c++;return c;}
function currentUnit(){var n;for(n=1;n<=10;n++)if(!closed(n)&&unlocked(n))return n;if(levelClosed(0)===10&&!closed(21))return 21;for(n=11;n<=20;n++)if(!closed(n)&&unlocked(n))return n;if(levelClosed(1)===10&&closed(22)){for(n=23;n<=32;n++)if(!closed(n)&&unlocked(n))return n;if(levelClosed(2)===10&&!closed(33)&&unlocked(33))return 33;return null;}if(levelClosed(1)===10&&!closed(22))return 22;return null;}
function nextStep(n){var p=prog(n);for(var i=0;i<16;i++)if(!stepDone(p,i))return i;return null;}
function errors(){var a=[];S.docs.forEach(function(v,k){if(v&&v.kind==='error')a.push(Object.assign({id:k},v));});return a;}
function dueErrors(){var t=today();return errors().filter(function(e){return e.status==='active'&&e.due&&e.due<=t;}).sort(function(a,b){return a.due<b.due?-1:1;});}

/* ---------- gravação ---------- */
var queues=new Map();
function persist(id,data){
  if(!S.base||!S.db)return Promise.resolve();
  var prev=queues.get(id)||Promise.resolve();
  var next=prev.then(function(){return data===null?S.db.collection(S.base).doc(id).delete():S.db.collection(S.base).doc(id).set(data);})
    .catch(function(){flash('Não foi possível salvar agora. Tente de novo.');});
  queues.set(id,next);return next;
}
function save(id,data){S.docs.set(id,data);if(/^p\d/.test(id))bump();render();return persist(id,data);}
function remove(id){S.docs.delete(id);render();return persist(id,null);}

function segBar(n){var p=prog(n),h='<div class="seg" aria-hidden="true">';for(var i=0;i<16;i++)h+='<i class="'+(stepDone(p,i)?'on':'')+'"></i>';return h+'</div>';}
function statusLine(){
  if(S.status==='loading')return 'Carregando o seu progresso…';
  if(S.status==='local')return 'Não foi possível salvar neste navegador: o progresso desta visita pode se perder.';
  if(S.status==='err')return 'Não foi possível ler o progresso salvo. Recarregue a página.';
  return 'Progresso salvo neste navegador. Para levar a outro aparelho, use Exportar em Ajustes.';
}

function loadUnit(n){
  if(S.units[n]!==undefined)return;
  S.units[n]='loading';
  fetch('units/u'+pad(n)+'.json').then(function(r){if(!r.ok)throw new Error('x');return r.json();})
    .then(function(d){S.units[n]=d;render();}).catch(function(){S.units[n]=null;render();});
}
function mk(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[‘’]/g,"'").replace(/[.,!?;:"“”]/g,' ').replace(/\s+/g,' ').trim();}
function gradeQ(q,v){
  v=v||[];
  if(q.type==='fill'){
    if(q.any)return q.ans.every(function(_,i){return /^[a-z]{2,}$/.test(norm(v[i]));});
    return q.ans.every(function(alts,i){var x=norm(v[i]);return !!x&&alts.some(function(a){return norm(a)===x;});});
  }
  if(q.type==='fix'){var y=norm(v[0]);return !!y&&q.acc.some(function(a){return norm(a)===y;});}
  if(q.type==='react'){var z=norm(v[0]);return !!z&&q.acc.some(function(a){return z.indexOf(norm(a))>=0;});}
  if(q.type==='open')return norm(v[0]).length>0;
  return false;
}
function showAns(q){
  if(q.show)return q.show;
  if(q.type==='fill')return q.ans.map(function(a){return a[0];}).join(' · ');
  if(q.type==='fix')return q.acc[0]+'.';
  if(q.type==='choice')return q.correct.map(function(k){return q.options[k];}).join(' / ');
  return q.ref||'';
}
function nBlanks(q){return q.type==='fill'?q.ans.length:1;}
function draftVals(base,q){var a=[];for(var i=0;i<nBlanks(q);i++)a.push(S.drafts[base+'-'+i]||'');return a;}

function chatDef(c){return c.free?c.free:S.units[c.unit].lessons[c.L].chat;}
function teacherPromptFree(f){
  var en=f.en,map={nivel:'B1+',unidade:'free practice (Uber Black driver)',licao:'free conversation',gramatica:'natural, accurate English (any grammar the student needs)',vocabulario:en.vocab||'',cenario:en.scenario,papel_ia:en.role,meta:en.goal,erros_recorrentes:recurring(),trocas:en.trocas||'10 to 12',codigo_licao:'FREE-'+f.id};
  var s=TEACHER;Object.keys(map).forEach(function(k){s=s.split('{'+k+'}').join(map[k]);});
  return s;
}
function freeDoc(id){return S.docs.get('cf-'+id);}
async function freeStart(id,fresh){
  var f=FREE.filter(function(x){return x.id===id;})[0];if(!f)return;
  if(!S.sampleReady){flash('Verificando o professor IA, tente de novo em um instante.');return;}
  if(!S.sample){flash('O professor IA não está disponível aqui.');return;}
  var ex=freeDoc(id);
  var c={unit:0,L:0,free:f,msgs:[],busy:false,stream:'',err:'',ended:false,mode:'turn',lastKind:'',ctl:null,instr:teacherPromptFree(f)};
  if(ex&&!fresh&&!ex.ended&&ex.msgs&&ex.msgs.length){c.msgs=ex.msgs.slice();var last=c.msgs[c.msgs.length-1];if(last.role==='user')c.lastKind='turn';}
  S.chat=c;S.fr=null;S.view={tab:'practice',unit:null,step:null,chat:true};window.scrollTo(0,0);render();
  if(c.msgs.length===0)await chatCall('turn');
}
function finalizeFree(rep){
  var c=S.chat,f=c.free,t=today();
  c.ended=true;c.lastKind='';
  rep.kind='report';rep.free=f.id;rep.at=Date.now();
  saveQ('rf-'+f.id,rep);saveChatQ();
  rep.erros.forEach(function(e){
    var id='e'+hash(norm(e.escrito)+'|'+norm(e.correto)),old=S.docs.get(id),d;
    if(old&&old.kind==='error')d=Object.assign({},old,{count:(old.count||1)+1,streak:0,status:'active',due:addDays(t,1),why:e.explicacao||old.why,at:Date.now()});
    else d={kind:'error',unit:0,lesson:null,category:e.categoria,point:e.ponto,written:e.escrito,correct:e.correto,why:e.explicacao,count:1,streak:0,status:'active',due:addDays(t,1),created:Date.now(),at:Date.now()};
    saveQ(id,d);
  });
  bump();S.chat=null;S.fr={id:f.id,title:f.title,rep:rep};
  go({tab:'practice',unit:null,step:null});
}
function freeCards(){
  var h='<h2 style="padding-top:8px">Conversas do dia a dia</h2><p class="small muted">Você é o motorista e a IA faz o passageiro. Os erros vão para a Revisão. Cada mensagem usa o limite gratuito da sua chave de API.</p>';

}

function lisStore(){return S.docs.get('escuta')||{kind:'escuta',res:{}};}
function lisVoice(lang,used){
  var all=(window.speechSynthesis.getVoices()||[]).filter(function(v){return /^en/i.test(v.lang);});
  var want=('en-'+lang).toLowerCase(),pool=all.filter(function(v){return v.lang.replace('_','-').toLowerCase()===want;});
  var v=pool.filter(function(x){return used.indexOf(x)<0;})[0]||pool[0]||all.filter(function(x){return used.indexOf(x)<0;})[0]||all[0]||null;
  return v;
}
function lisPlay(id,rate){
  if(!speechOk()){flash('Este navegador não tem áudio.');return;}
  var p=LIS.filter(function(x){return x.id===id;})[0];if(!p)return;
  var ss=window.speechSynthesis;try{ss.cancel();}catch(e){}
  var used=[],vs=p.spk.map(function(s){var v=lisVoice(s.lang,used);if(v)used.push(v);return v;});
  p.lines.forEach(function(ln){
    var u=new window.SpeechSynthesisUtterance(ln.t),v=vs[ln.s];
    if(v){u.voice=v;u.lang=v.lang;}else u.lang='en-US';
    u.rate=rate;
    if(vs.length>1&&vs[0]&&vs[1]&&vs[0]===vs[1])u.pitch=ln.s===0?0.85:1.2;
    ss.speak(u);
  });
}

  var st=lisStore(),res=Object.assign({},st.res),old=res[l.id]||{};

}

var EXD={"PR":[{"u":1,"title":"Vogais curtas e longas","focus":"/ɪ/ x /iː/","explain":["Em inglês, **ship** e **sheep** são palavras diferentes só pelo tamanho da vogal. O som curto /ɪ/ é rápido e relaxado. O som longo /iː/ é mais demorado, com os lábios esticados como num sorriso.","Brasileiros costumam usar o mesmo \"i\" nos dois casos, e aí **live** (viver) e **leave** (sair) soam iguais."],"words":[{"en":"ship","pt":"chip, i curto"},{"en":"sheep","pt":"chiip, i longo"},{"en":"live","pt":"lív, i curto"},{"en":"leave","pt":"liiv, i longo"},{"en":"sit","pt":"sit, i curto"},{"en":"seat","pt":"siit, i longo"},{"en":"bit","pt":"bit, i curto"},{"en":"beat","pt":"biit, i longo"}],"sents":["The ship is big, but the sheep is small.","I live near the beach, so I never want to leave.","Please sit in this seat."],"quiz":[{"say":"ship","q":"Ouça e escolha a palavra que você ouviu.","o":["ship","sheep"],"a":0},{"say":"leave","q":"Ouça e escolha a palavra que você ouviu.","o":["live","leave"],"a":1},{"say":"seat","q":"Ouça e escolha a palavra que você ouviu.","o":["sit","seat"],"a":1},{"say":"feel","q":"Ouça e escolha a palavra que você ouviu.","o":["fill","feel"],"a":1},{"say":"bit","q":"Ouça e escolha a palavra que você ouviu.","o":["bit","beat"],"a":0}]},{"u":2,"title":"Acento nas palavras","focus":"sílaba forte","explain":["Toda palavra inglesa com mais de uma sílaba tem uma sílaba mais forte: mais longa, mais alta e mais clara. As outras ficam fracas e rápidas.","Brasileiros costumam colocar o acento onde ele ficaria em português. Duas regras ajudam: palavras terminadas em **-ity** e **-tion** têm a sílaba forte logo antes do final, como em per-so-**NAL**-i-ty e re-**LA**-tion-ship."],"words":[{"en":"family","pt":"FÉ-mi-li, 1ª forte"},{"en":"parents","pt":"PÉ-rents, 1ª forte"},{"en":"relationship","pt":"ri-LEI-shon-ship, 2ª forte"},{"en":"together","pt":"tu-GUÉ-dher, 2ª forte"},{"en":"personality","pt":"per-so-NÉ-li-ti, 3ª forte"},{"en":"engineer","pt":"en-dji-NIR, 3ª forte"},{"en":"invite","pt":"in-VÁIT, 2ª forte"},{"en":"uncomfortable","pt":"an-CÂM-for-ta-bol, 2ª forte"}],"sents":["My family is very close.","We get along well together.","She has a strong personality."],"quiz":[{"say":"family","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":0},{"say":"personality","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":2},{"say":"relationship","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":1},{"say":"engineer","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":2},{"say":"together","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":1}]},{"u":3,"title":"O som de o e or","focus":"/ɑː/ x /ɔːr/","explain":["**not** (não) e **north** (norte) têm vogais diferentes. Em **short**, **north** e **port**, o \"o\" é longo e vem seguido de um R.","Dica para brasileiros: termine em **T**, sem acrescentar um \"i\" no fim. O certo é \"short\", não \"shórtchi\"."],"words":[{"en":"not","pt":"nót, o aberto e curto"},{"en":"north","pt":"nórth, sem i no fim"},{"en":"shot","pt":"shót"},{"en":"short","pt":"shórt, sem i no fim"},{"en":"pot","pt":"pót"},{"en":"port","pt":"pórt, sem i no fim"},{"en":"spot","pt":"spót"},{"en":"sport","pt":"spórt, sem i no fim"}],"sents":["It is not far from the north.","He is short, but he is a good sport.","We left the pot near the port."],"quiz":[{"say":"north","q":"Ouça e escolha a palavra que você ouviu.","o":["not","north"],"a":1},{"say":"shot","q":"Ouça e escolha a palavra que você ouviu.","o":["shot","short"],"a":0},{"say":"port","q":"Ouça e escolha a palavra que você ouviu.","o":["pot","port"],"a":1},{"say":"sport","q":"Ouça e escolha a palavra que você ouviu.","o":["spot","sport"],"a":1},{"say":"not","q":"Ouça e escolha a palavra que você ouviu.","o":["not","north"],"a":0}]},{"u":4,"title":"Acento na frase","focus":"palavras fortes e fracas","explain":["Numa frase, as palavras de conteúdo (verbo principal, substantivo, adjetivo, advérbio) soam fortes. As palavras de função (have, been, for, the, a) soam fracas e rápidas.","Se você dá o mesmo peso a todas as palavras, a fala fica difícil de entender. Em **I've been working here for three years**, as fortes são **work**, **here** e **years**; **been** e **for** quase desaparecem."],"words":[{"en":"I've been waiting","pt":"aiv bin UEI-ting, bin fraco"},{"en":"for an hour","pt":"fer an AUER"},{"en":"since March","pt":"sins MARTCH"},{"en":"three years","pt":"thri IERS"},{"en":"a long time","pt":"a LONG TAIM"},{"en":"every day","pt":"É-vri DEI"}],"sents":["I've been working here for three years.","She's been living in Canada since March.","They've been waiting for an hour."],"quiz":[{"say":"I've been living here since March","q":"Ouça. Qual versão marca as palavras fortes?","o":["I've been LIVing here since MARCH","I've BEEN living HERE since march"],"a":0},{"say":"She has been working for three years","q":"Ouça. Qual versão marca as palavras fortes?","o":["She HAS been working FOR three years","She has been WORKing for three YEARS"],"a":1},{"say":"They have been waiting for an hour","q":"Ouça. Qual versão marca as palavras fortes?","o":["They have been WAITing for an HOUR","They HAVE been waiting FOR an hour"],"a":0},{"say":"We have been studying English","q":"Ouça. Qual versão marca as palavras fortes?","o":["We have been STUDying ENglish","WE have BEEN studying english"],"a":0}]},{"u":5,"title":"Sons de sh, ch e j","focus":"/ʃ/, /tʃ/, /dʒ/","explain":["**sh** é um \"x\" suave, como em \"xícara\": **ship**. **ch** é como o \"tch\" de \"tchau\": **chip**. **j** é como o \"dj\" de \"djalma\": **joke**.","Na fala natural, uma palavra termina e a seguinte começa ligada: **pick it up** soa como \"pi-ki-tap\". Isso é a ligação entre palavras."],"words":[{"en":"ship","pt":"chip, como xícara"},{"en":"chip","pt":"tchip"},{"en":"wash","pt":"uóch, termina em x"},{"en":"watch","pt":"uótch, termina em tch"},{"en":"joke","pt":"djôuk"},{"en":"choke","pt":"tchôuk"},{"en":"age","pt":"êidj"},{"en":"each","pt":"ítch"}],"sents":["I always wash my car on Sunday.","Watch the road, it is a long way.","Pick it up and put it in the car."],"quiz":[{"say":"watch","q":"Ouça e escolha a palavra que você ouviu.","o":["wash","watch"],"a":1},{"say":"chip","q":"Ouça e escolha a palavra que você ouviu.","o":["ship","chip"],"a":1},{"say":"joke","q":"Ouça e escolha a palavra que você ouviu.","o":["joke","choke"],"a":0},{"say":"wash","q":"Ouça e escolha a palavra que você ouviu.","o":["wash","watch"],"a":0},{"say":"each","q":"Ouça e escolha a palavra que você ouviu.","o":["age","each"],"a":1}]},{"u":6,"title":"O som fraco \"schwa\"","focus":"/ə/ e as duas formas de the","explain":["O schwa /ə/ é o som mais comum do inglês: uma vogal fraca, curta, de \"ã\" relaxado. Ele aparece em sílabas fracas, como a primeira de **about** e as duas pontas de **banana**.","**the** tem dois sons: \"dhâ\" antes de consoante (the book) e \"dhi\" antes de vogal (the apple, the end)."],"words":[{"en":"about","pt":"a-BAUT, a fraco"},{"en":"banana","pt":"ba-NÉ-na"},{"en":"the book","pt":"dhâ BUK"},{"en":"the apple","pt":"dhi É-pol"},{"en":"the end","pt":"dhi END"},{"en":"the day","pt":"dhâ DEI"},{"en":"police","pt":"pa-LIS"},{"en":"today","pt":"ta-DEI"}],"sents":["The apple is on the table.","The end of the day is the best part.","I bought a banana about an hour ago."],"quiz":[{"say":"banana","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":1},{"say":"the apple","q":"Ouça. Como soa \"the\"?","o":["dhâ","dhi"],"a":1},{"say":"the day","q":"Ouça. Como soa \"the\"?","o":["dhâ","dhi"],"a":0},{"say":"about","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba"],"a":1},{"say":"the end","q":"Ouça. Como soa \"the\"?","o":["dhâ","dhi"],"a":1}]},{"u":7,"title":"Letras que não soam","focus":"consoantes mudas","explain":["Em inglês, algumas letras aparecem na escrita e não soam. Em **knife** o k é mudo. Em **listen** o t é mudo. Em **Wednesday** o d é mudo e a palavra soa como \"uênz-dei\".","Brasileiros costumam pronunciar a letra que está escrita, e isso soa estranho. Vale decorar as mais comuns."],"words":[{"en":"knife","pt":"náif, sem k"},{"en":"know","pt":"nôu, sem k"},{"en":"write","pt":"ráit, sem w"},{"en":"listen","pt":"LI-sen, sem t"},{"en":"Wednesday","pt":"UÊNZ-dei, sem d"},{"en":"comb","pt":"côum, sem b"},{"en":"half","pt":"hééf, sem l"},{"en":"island","pt":"AI-lend, sem s"}],"sents":["I know how to write a long email.","Listen, the knife is on the table.","We will meet on Wednesday at half past two."],"quiz":[{"say":"knife","q":"Ouça. A palavra começa com som de K?","o":["Sim","Não"],"a":1},{"say":"kitchen","q":"Ouça. A palavra começa com som de K?","o":["Sim","Não"],"a":0},{"say":"listen","q":"Ouça. Você ouve o som de T no meio?","o":["Sim","Não"],"a":1},{"say":"after","q":"Ouça. Você ouve o som de T no meio?","o":["Sim","Não"],"a":0},{"say":"write","q":"Ouça. A palavra começa com som de W?","o":["Sim","Não"],"a":1}]},{"u":8,"title":"Can e can't","focus":"forma fraca e forma forte","explain":["**can** é fraco e rápido: /kən/, quase \"kân\". **can't** é forte e termina em T: /kænt/, \"quént\". É a diferença entre dizer que você consegue e que não consegue.","Brasileiros costumam dizer os dois com o mesmo som. Ouça o verbo que vem depois: ele é a parte forte da frase (I can **swim**, I can't **swim**)."],"words":[{"en":"I can swim","pt":"ai kân SUIM"},{"en":"I can't swim","pt":"ai QUÉNT suim"},{"en":"She can drive","pt":"chi kân DRAIV"},{"en":"She can't drive","pt":"chi QUÉNT draiv"},{"en":"They can come","pt":"dhei kân CAM"},{"en":"They can't come","pt":"dhei QUÉNT cam"}],"sents":["I can speak English, but I can't speak French.","He can help you, but he can't come today.","We can't park here, but we can park there."],"quiz":[{"say":"She can speak French","q":"Ouça. Qual você ouviu?","o":["can","can't"],"a":0},{"say":"I can't drive a bus","q":"Ouça. Qual você ouviu?","o":["can","can't"],"a":1},{"say":"They can't find the key","q":"Ouça. Qual você ouviu?","o":["can","can't"],"a":1},{"say":"We can start now","q":"Ouça. Qual você ouviu?","o":["can","can't"],"a":0},{"say":"He can't swim","q":"Ouça. Qual você ouviu?","o":["can","can't"],"a":1}]},{"u":9,"title":"Os sons de work e walk","focus":"/ɔː/ x /ɜːr/","explain":["**walk** (andar) e **work** (trabalhar) têm vogais diferentes. Em **walk** o \"o\" é longo e aberto. Em **work** a vogal é fechada e vem seguida de um R forte, como um \"âr\" preso na garganta.","O mesmo acontece em **born** (nascido) e **burn** (queimar), **short** e **shirt**."],"words":[{"en":"walk","pt":"uóc, o longo"},{"en":"work","pt":"uârk, vogal fechada"},{"en":"born","pt":"bórn"},{"en":"burn","pt":"bârn"},{"en":"short","pt":"shórt"},{"en":"shirt","pt":"shârt"},{"en":"word","pt":"uârd"},{"en":"ward","pt":"uórd"}],"sents":["I walk to work every day.","He was born in a small town.","This shirt is too short."],"quiz":[{"say":"work","q":"Ouça e escolha a palavra que você ouviu.","o":["walk","work"],"a":1},{"say":"burn","q":"Ouça e escolha a palavra que você ouviu.","o":["born","burn"],"a":1},{"say":"shirt","q":"Ouça e escolha a palavra que você ouviu.","o":["short","shirt"],"a":1},{"say":"word","q":"Ouça e escolha a palavra que você ouviu.","o":["word","ward"],"a":0},{"say":"walk","q":"Ouça e escolha a palavra que você ouviu.","o":["walk","work"],"a":0}]},{"u":10,"title":"Terminações com s e used to","focus":"/s/, /z/, /ɪz/ e /juːst/","explain":["O **s** final tem três sons. Depois de som surdo (likes, works) é /s/. Depois de som sonoro (loves, plays) é /z/. Depois de s, sh, ch, x, z (watches, dances) vira uma sílaba extra: /ɪz/.","**used to** (costumava) soa \"iúst tu\", com S. Não confunda com \"iúzd\"."],"words":[{"en":"likes","pt":"láics, 1 sílaba"},{"en":"loves","pt":"lavz, 1 sílaba"},{"en":"watches","pt":"UÓ-tchiz, 2 sílabas"},{"en":"dances","pt":"DÉN-siz, 2 sílabas"},{"en":"kisses","pt":"KI-siz, 2 sílabas"},{"en":"plays","pt":"pleiz, 1 sílaba"},{"en":"used to","pt":"IÚST tu"},{"en":"I used to live here","pt":"ai IÚST tu liv hir"}],"sents":["She watches TV and likes comedies.","He loves the way she dances.","We used to live near the sea."],"quiz":[{"say":"watches","q":"Ouça. Quantas sílabas?","o":["1","2"],"a":1},{"say":"loves","q":"Ouça. Quantas sílabas?","o":["1","2"],"a":0},{"say":"kisses","q":"Ouça. Quantas sílabas?","o":["1","2"],"a":1},{"say":"likes","q":"Ouça. Quantas sílabas?","o":["1","2"],"a":0},{"say":"I used to live here","q":"Ouça. Qual você ouviu?","o":["used to (iúst tu)","use to (iúz tu)"],"a":0}]},{"u":11,"title":"Terminações -ed e verbos irregulares","focus":"/t/, /d/, /ɪd/","explain":["O **-ed** do passado tem três sons. Depois de som surdo é /t/ (worked, liked). Depois de som sonoro é /d/ (played, called). Depois de t ou d vira uma sílaba extra: /ɪd/ (wanted, decided).","Brasileiros costumam dizer \"work-ed\" com duas sílabas. O certo é **workt**, uma só. Já os irregulares, como **bought** e **taught**, têm o som /ɔː/ e não terminam em -ed."],"words":[{"en":"worked","pt":"uârkt, 1 sílaba"},{"en":"played","pt":"pleid, 1 sílaba"},{"en":"wanted","pt":"UÓN-tid, 2 sílabas"},{"en":"decided","pt":"di-SAI-did, 3 sílabas"},{"en":"liked","pt":"laikt, 1 sílaba"},{"en":"visited","pt":"VI-zi-tid, 3 sílabas"},{"en":"bought","pt":"bót"},{"en":"taught","pt":"tót"}],"sents":["The film was directed and produced in Spain.","He wanted to see the movie and decided to go.","She bought the tickets and he paid for the popcorn."],"quiz":[{"say":"wanted","q":"Ouça. Quantas sílabas?","o":["1","2"],"a":1},{"say":"worked","q":"Ouça. Quantas sílabas?","o":["1","2"],"a":0},{"say":"visited","q":"Ouça. Quantas sílabas?","o":["1","2","3"],"a":2},{"say":"helped","q":"Ouça. Quantas sílabas?","o":["1","2"],"a":0},{"say":"needed","q":"Ouça. Quantas sílabas?","o":["1","2"],"a":1}]},{"u":12,"title":"Ditongos","focus":"/eɪ/, /aɪ/, /ɔɪ/, /aʊ/, /oʊ/","explain":["Ditongo é um som que começa numa vogal e termina em outra, tudo numa sílaba só. **say** é \"sei\", **buy** é \"bai\", **boy** é \"bói\", **now** é \"nau\", **go** é \"gôu\".","Brasileiros costumam encurtar o ditongo. Termine o movimento: em **know** a boca fecha em \"u\", e em **now** ela também, mas o começo é diferente (nôu x nau)."],"words":[{"en":"pay","pt":"pei"},{"en":"pie","pt":"pai"},{"en":"boy","pt":"bói"},{"en":"buy","pt":"bai"},{"en":"now","pt":"nau"},{"en":"know","pt":"nôu"},{"en":"tie","pt":"tai"},{"en":"toy","pt":"tói"}],"sents":["My boy likes to say hello to everyone.","I know that he is not at home now.","She has a nice smile and light eyes."],"quiz":[{"say":"pie","q":"Ouça e escolha a palavra que você ouviu.","o":["pay","pie"],"a":1},{"say":"buy","q":"Ouça e escolha a palavra que você ouviu.","o":["boy","buy"],"a":1},{"say":"know","q":"Ouça e escolha a palavra que você ouviu.","o":["now","know"],"a":1},{"say":"toy","q":"Ouça e escolha a palavra que você ouviu.","o":["tie","toy"],"a":1},{"say":"say","q":"Ouça e escolha a palavra que você ouviu.","o":["say","sigh"],"a":0}]},{"u":13,"title":"As vogais da letra u","focus":"/ʌ/, /ʊ/, /uː/, /juː/","explain":["A letra **u** tem vários sons. **cup** e **bus** têm /ʌ/ (um \"â\" curto). **put** e **full** têm /ʊ/ (um \"u\" curto). **blue** e **true** têm /uː/ (um \"u\" longo). **student** e **university** têm /juː/ (\"iu\").","O erro comum é ler **put** como \"pât\" ou **bus** como \"bús\". Ouça a diferença entre **put** e **but**."],"words":[{"en":"cup","pt":"câp"},{"en":"bus","pt":"bâs"},{"en":"put","pt":"put, u curto"},{"en":"full","pt":"ful, u curto"},{"en":"blue","pt":"blu, u longo"},{"en":"true","pt":"tru, u longo"},{"en":"student","pt":"STIU-dent"},{"en":"university","pt":"iu-ni-VÂR-si-ti"}],"sents":["The student put the cup on the bus.","It is true that the blue bus is full.","She studies at the university."],"quiz":[{"say":"put","q":"Ouça e escolha a palavra que você ouviu.","o":["but","put"],"a":1},{"say":"luck","q":"Ouça e escolha a palavra que você ouviu.","o":["look","luck"],"a":1},{"say":"fool","q":"Ouça e escolha a palavra que você ouviu.","o":["full","fool"],"a":1},{"say":"pull","q":"Ouça e escolha a palavra que você ouviu.","o":["pull","pool"],"a":0},{"say":"but","q":"Ouça e escolha a palavra que você ouviu.","o":["but","put"],"a":0}]},{"u":14,"title":"A letra c","focus":"/k/ x /s/","explain":["A letra **c** soa como \"k\" na maioria das palavras: **cat**, **coffee**, **cake**. Antes de **e**, **i** e **y** ela soa como \"s\": **city**, **cinema**, **centre**, **cycle**.","Para brasileiros isso é parecido com o português (casa x cidade). O cuidado é com palavras como **ice** e **face**, em que o c final é \"s\", e não \"k\"."],"words":[{"en":"cake","pt":"quêik"},{"en":"coffee","pt":"CÓ-fi"},{"en":"city","pt":"SI-ti"},{"en":"cinema","pt":"SI-ni-ma"},{"en":"centre","pt":"SEN-ter"},{"en":"cycle","pt":"SAI-col"},{"en":"ice","pt":"ais"},{"en":"face","pt":"feis"}],"sents":["I live in the centre of the city.","There is a nice cinema near my flat.","Would you like ice in your coffee?"],"quiz":[{"say":"city","q":"Ouça. A letra c soa como…","o":["K","S"],"a":1},{"say":"cake","q":"Ouça. A letra c soa como…","o":["K","S"],"a":0},{"say":"cinema","q":"Ouça. A primeira letra c soa como…","o":["K","S"],"a":1},{"say":"coffee","q":"Ouça. A primeira letra c soa como…","o":["K","S"],"a":0},{"say":"face","q":"Ouça. A última letra c soa como…","o":["K","S"],"a":1}]},{"u":15,"title":"Acento em palavras de trabalho","focus":"sílaba forte","explain":["Nas palavras de trabalho o acento muda o sentido e a clareza. Em **interview** a 1ª sílaba é forte. Em **career** e **experience** é a 2ª. Em **employee** e **engineer** é a última.","Palavras terminadas em **-tion** (application, education) têm a sílaba forte logo antes do -tion. Brasileiros costumam dizer \"in-ter-VIEW\" e \"ca-RIER\" com o acento errado."],"words":[{"en":"interview","pt":"ÍN-ter-viu, 1ª forte"},{"en":"salary","pt":"SÉ-la-ri, 1ª forte"},{"en":"career","pt":"ca-RIR, 2ª forte"},{"en":"experience","pt":"ik-SPI-ri-ens, 2ª forte"},{"en":"employee","pt":"em-ploi-Í, 3ª forte"},{"en":"engineer","pt":"en-dji-NIR, 3ª forte"},{"en":"application","pt":"a-pli-QUEI-shon, 3ª forte"},{"en":"manager","pt":"MÉ-ni-djer, 1ª forte"}],"sents":["I have a job interview next week.","She has a lot of experience in this career.","The manager read my application."],"quiz":[{"say":"interview","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":0},{"say":"career","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":1},{"say":"employee","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":2},{"say":"experience","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":1},{"say":"application","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba","3ª sílaba"],"a":2}]},{"u":16,"title":"A combinação ai e outras vogais","focus":"ai, ay, ea","explain":["A combinação **ai** costuma soar como \"êi\": **wait**, **mail**, **paid**, **main**. Mas há exceções: **said** soa \"sed\", **again** soa \"a-guén\" e **aisle** soa \"ail\".","Para brasileiros o erro é ler **said** como \"sêid\". Decore as exceções e ouça cada uma."],"words":[{"en":"wait","pt":"uêit"},{"en":"mail","pt":"mêil"},{"en":"paid","pt":"pêid"},{"en":"main","pt":"mêin"},{"en":"said","pt":"sed, exceção"},{"en":"again","pt":"a-GUEN"},{"en":"aisle","pt":"ail, o s é mudo"},{"en":"certain","pt":"SÂR-ten, fraco no fim"}],"sents":["I paid and waited for the mail.","She said she would come again.","The main aisle is on the left."],"quiz":[{"say":"said","q":"Ouça e escolha a palavra que você ouviu.","o":["said","sad"],"a":0},{"say":"paid","q":"Ouça e escolha a palavra que você ouviu.","o":["paid","pad"],"a":0},{"say":"main","q":"Ouça e escolha a palavra que você ouviu.","o":["man","main"],"a":1},{"say":"wait","q":"Ouça e escolha a palavra que você ouviu.","o":["wet","wait"],"a":1},{"say":"mail","q":"Ouça e escolha a palavra que você ouviu.","o":["mail","mile"],"a":0}]},{"u":17,"title":"Forma fraca de have","focus":"would have, could have","explain":["Na fala rápida, **would have**, **could have** e **should have** viram \"wudâv\", \"cudâv\" e \"shudâv\". O **have** fica fraco, /əv/.","Por isso muita gente escreve errado **could of** em vez de **could have**. O certo é sempre **have**. Brasileiros costumam dizer \"have\" forte, com \"rév\", e isso quebra o ritmo da frase."],"words":[{"en":"would have","pt":"WUD-av"},{"en":"could have","pt":"CUD-av"},{"en":"should have","pt":"SHUD-av"},{"en":"must have","pt":"MÂS-tav"},{"en":"I wish I had","pt":"ai UICH ai HED"},{"en":"if I had known","pt":"if ai hed NOUN"}],"sents":["If I had left earlier, I would have caught the train.","You should have called me yesterday.","She could have won, but she was unlucky."],"quiz":[{"say":"She could have called","q":"Ouça. Como se escreve?","o":["could have","could of"],"a":0},{"say":"I should have gone","q":"Ouça. Como se escreve?","o":["should of","should have"],"a":1},{"say":"We would have won","q":"Ouça. Como se escreve?","o":["would have","would of"],"a":0},{"say":"He must have forgotten","q":"Ouça. Como se escreve?","o":["must have","must of"],"a":0}]},{"u":18,"title":"Sons de ough e augh","focus":"ough, augh","explain":["A combinação **ough** tem vários sons e é um dos maiores problemas da escrita em inglês: **enough** (inâf), **through** (thru), **though** (dhôu), **thought** (thót).","Aprenda por rima: **through** rima com **blue**, **though** com **go**, **enough** com **stuff**, **thought** com **caught**."],"words":[{"en":"enough","pt":"i-NÂF"},{"en":"tough","pt":"tâf"},{"en":"through","pt":"thru"},{"en":"though","pt":"dhôu"},{"en":"thought","pt":"thót"},{"en":"laugh","pt":"léf"},{"en":"caught","pt":"cót"},{"en":"daughter","pt":"DÓ-ter"}],"sents":["I thought it was tough, but I laughed.","He walked through the door and said goodnight.","It is cold, though, and I have had enough."],"quiz":[{"say":"through","q":"Ouça. Com qual palavra rima?","o":["blue","go"],"a":0},{"say":"though","q":"Ouça. Com qual palavra rima?","o":["go","blue"],"a":0},{"say":"enough","q":"Ouça. Com qual palavra rima?","o":["stuff","cow"],"a":0},{"say":"laugh","q":"Ouça. Com qual palavra rima?","o":["half","safe"],"a":0},{"say":"thought","q":"Ouça. Com qual palavra rima?","o":["caught","boat"],"a":0}]},{"u":19,"title":"Acento em substantivos compostos","focus":"1ª sílaba forte","explain":["Nos substantivos compostos (duas palavras que formam uma), a 1ª sílaba é a mais forte: **TOOTHpaste**, **AIRport**, **BOOKshop**. Já numa palavra normal de duas sílabas o acento varia: **hoTEL**, **maCHINE**.","Brasileiros costumam acentuar a segunda parte, como em português (aero-PORTO). Em inglês é o contrário."],"words":[{"en":"toothpaste","pt":"TUTH-peist"},{"en":"airport","pt":"ÉR-pórt"},{"en":"bookshop","pt":"BUK-chóp"},{"en":"bus stop","pt":"BÂS-stóp"},{"en":"swimming pool","pt":"SUÍ-ming pul"},{"en":"hotel","pt":"rô-TÉL, 2ª forte"},{"en":"police","pt":"pa-LIS, 2ª forte"},{"en":"machine","pt":"ma-CHIN, 2ª forte"}],"sents":["The airport is next to the hotel.","I left my toothpaste at the bookshop.","Meet me at the bus stop."],"quiz":[{"say":"toothpaste","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba"],"a":0},{"say":"hotel","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba"],"a":1},{"say":"airport","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba"],"a":0},{"say":"machine","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba"],"a":1},{"say":"bookshop","q":"Ouça. Qual sílaba é a mais forte?","o":["1ª sílaba","2ª sílaba"],"a":0}]},{"u":20,"title":"Entonação das question tags","focus":"voz que sobe e voz que desce","explain":["Nas **question tags** (isn't it?, didn't he?), a voz pode subir ou descer, e isso muda o sentido. Se a voz **sobe**, você realmente pergunta e não sabe a resposta. Se a voz **desce**, você tem quase certeza e só quer confirmar.","Em português fazemos o mesmo com \"né?\". Em **He's the murderer, isn't he?**, voz descendo é \"tenho certeza\", e voz subindo é \"será?\"."],"words":[{"en":"isn't it?","pt":"IZ-nt it"},{"en":"aren't you?","pt":"ARNT iu"},{"en":"didn't he?","pt":"DI-dnt hi"},{"en":"don't they?","pt":"DONT dhei"},{"en":"wasn't she?","pt":"UÓ-znt chi"},{"en":"can't you?","pt":"KÉNT iu"}],"sents":["It's a mystery, isn't it?","You saw the thief, didn't you?","She isn't the criminal, is she?"],"quiz":[{"say":null,"q":"Você tem quase certeza de que ele é o culpado e só quer confirmar: \"He's guilty, isn't he?\" A voz no final…","o":["sobe","desce"],"a":1},{"say":null,"q":"Você realmente não sabe se ele saiu de casa: \"He left home, didn't he?\" A voz no final…","o":["sobe","desce"],"a":0},{"say":null,"q":"Você viu o crime e só quer concordância: \"It was a terrible crime, wasn't it?\" A voz no final…","o":["sobe","desce"],"a":1},{"say":null,"q":"Você não sabe se ele vem e pergunta de verdade: \"He is coming, isn't he?\" A voz no final…","o":["sobe","desce"],"a":0}]},{"u":23,"title":"O som de th","focus":"/θ/ (think) e /ð/ (this)","explain":["O **th** não existe em português. Ponha a ponta da língua entre os dentes e sopre: **think** não é \"sink\" nem \"fink\". Em **this**, a língua está na mesma posição, mas a garganta vibra.","Sem vibração (**/θ/**): think, three, bath, month, thank. Com vibração (**/ð/**): this, that, the, mother, weather."],"words":[{"en":"think","pt":"θink"},{"en":"three","pt":"θri"},{"en":"thank","pt":"θenk"},{"en":"bath","pt":"bæθ"},{"en":"this","pt":"ðis"},{"en":"that","pt":"ðæt"},{"en":"mother","pt":"mâðer"},{"en":"weather","pt":"uéðer"}],"sents":["Thank you for the three thick books.","This weather is the worst this month.","My mother thinks that the bath is too hot."],"quiz":[{"say":"thin","q":"Ouça e escolha a palavra que você ouviu.","o":["thin","tin"],"a":0},{"say":"three","q":"Ouça e escolha a palavra que você ouviu.","o":["free","three"],"a":1},{"say":"then","q":"Ouça e escolha a palavra que você ouviu.","o":["then","den"],"a":0},{"say":"bath","q":"Ouça e escolha a palavra que você ouviu.","o":["bath","bass"],"a":0},{"say":"thank","q":"Ouça e escolha a palavra que você ouviu.","o":["tank","thank"],"a":1}]},{"u":24,"title":"O som de h","focus":"/h/ no início das palavras","explain":["Em inglês, o **h** inicial é um sopro suave, como quando você embaça um vidro. Não é o \"rr\" do português: **hot** não é \"rrót\".","Muitos brasileiros trocam o h por silêncio ou por um som áspero. Pratique o sopro: **head, hurt, health, hospital, heart**. Em **hour** e **honest**, o h é mudo."],"words":[{"en":"head","pt":"hed"},{"en":"hurt","pt":"hârt"},{"en":"health","pt":"hélθ"},{"en":"hospital","pt":"róspital"},{"en":"heart","pt":"hárt"},{"en":"hour","pt":"áuer (h mudo)"},{"en":"honest","pt":"ónist (h mudo)"},{"en":"hungry","pt":"hângri"}],"sents":["My head hurts and my heart is beating fast.","Her health is better than it was last year.","He had an honest talk with the doctor for an hour."],"quiz":[{"say":"hair","q":"Ouça e escolha a palavra que você ouviu.","o":["hair","air"],"a":0},{"say":"hat","q":"Ouça e escolha a palavra que você ouviu.","o":["hat","at"],"a":0},{"say":"hear","q":"Ouça e escolha a palavra que você ouviu.","o":["ear","hear"],"a":1},{"say":"heat","q":"Ouça e escolha a palavra que você ouviu.","o":["heat","eat"],"a":0},{"say":"high","q":"Ouça e escolha a palavra que você ouviu.","o":["high","eye"],"a":0}]},{"u":25,"title":"V e W","focus":"/v/ (very) e /w/ (water)","explain":["O **v** inglês é como o v português: dentes de cima tocam o lábio de baixo. O **w** é feito só com os lábios arredondados, como um \"u\" rápido: **water** é \"uóter\".","Cuidado com os pares: **vine / wine**, **vest / west**, **very / wary**. Em **well** os lábios arredondam; em **veil** os dentes tocam o lábio."],"words":[{"en":"very","pt":"véri"},{"en":"vine","pt":"vain"},{"en":"wine","pt":"uain"},{"en":"vest","pt":"vest"},{"en":"west","pt":"uest"},{"en":"water","pt":"uóter"},{"en":"value","pt":"vélhiu"},{"en":"window","pt":"uíndou"}],"sents":["We have very good value for the wine.","The west window is wide open.","They will negotiate when we visit the venue."],"quiz":[{"say":"vine","q":"Ouça e escolha a palavra que você ouviu.","o":["wine","vine"],"a":1},{"say":"west","q":"Ouça e escolha a palavra que você ouviu.","o":["vest","west"],"a":1},{"say":"very","q":"Ouça e escolha a palavra que você ouviu.","o":["wary","very"],"a":1},{"say":"wail","q":"Ouça e escolha a palavra que você ouviu.","o":["veil","wail"],"a":1},{"say":"wet","q":"Ouça e escolha a palavra que você ouviu.","o":["wet","vet"],"a":0}]},{"u":26,"title":"R e L","focus":"/r/ (right) e /l/ (light)","explain":["O **r** inglês não vibra nem \"raspa\": a ponta da língua se curva para trás sem encostar no céu da boca. **Right** é \"ráit\", com a língua enrolada.","O **l** inicial encosta a ponta da língua atrás dos dentes de cima: **light**. No final, o **l** é \"escuro\", quase um \"u\": **people, full, feel**."],"words":[{"en":"right","pt":"rait"},{"en":"light","pt":"lait"},{"en":"read","pt":"rid"},{"en":"lead","pt":"lid"},{"en":"rock","pt":"rók"},{"en":"lock","pt":"lók"},{"en":"really","pt":"rili"},{"en":"lately","pt":"léitli"}],"sents":["The newspaper really led the right story.","I read that the light is too low.","It was a long, rainy road to the lake."],"quiz":[{"say":"right","q":"Ouça e escolha a palavra que você ouviu.","o":["light","right"],"a":1},{"say":"row","q":"Ouça e escolha a palavra que você ouviu.","o":["low","row"],"a":1},{"say":"rock","q":"Ouça e escolha a palavra que você ouviu.","o":["rock","lock"],"a":0},{"say":"reed","q":"Ouça e escolha a palavra que você ouviu.","o":["lead","reed"],"a":1},{"say":"lane","q":"Ouça e escolha a palavra que você ouviu.","o":["lane","rain"],"a":0}]},{"u":27,"title":"Consoantes finais: b/p, d/t, g/k","focus":"Final sonoro x surdo","explain":["No final da palavra, o inglês distingue consoantes sonoras (**b, d, g**) das surdas (**p, t, k**): **bed / bet**, **cab / cap**, **bag / back**.","Dica útil: a vogal antes de uma consoante sonora é mais longa. Em **bad** a vogal se estende; em **bat** ela é curta e cortada. Não acrescente um \"i\" depois (nada de \"bédi\")."],"words":[{"en":"bed","pt":"bed"},{"en":"bet","pt":"bet"},{"en":"cab","pt":"kéb"},{"en":"cap","pt":"kép"},{"en":"bag","pt":"bég"},{"en":"back","pt":"bék"},{"en":"card","pt":"kárd"},{"en":"cart","pt":"kárt"}],"sents":["Please put the red bag in the cab.","I bet the bed is back in the hotel.","We had a good trip, but the cap was lost."],"quiz":[{"say":"bed","q":"Ouça e escolha a palavra que você ouviu.","o":["bet","bed"],"a":1},{"say":"cab","q":"Ouça e escolha a palavra que você ouviu.","o":["cab","cap"],"a":0},{"say":"bag","q":"Ouça e escolha a palavra que você ouviu.","o":["back","bag"],"a":1},{"say":"pig","q":"Ouça e escolha a palavra que você ouviu.","o":["pick","pig"],"a":1},{"say":"code","q":"Ouça e escolha a palavra que você ouviu.","o":["code","coat"],"a":0}]},{"u":28,"title":"Vogais /æ/, /ʌ/ e /ɑː/","focus":"cat, cut e cart","explain":["Três vogais que o português confunde: **/æ/** (cat) é aberta, entre \"é\" e \"a\". **/ʌ/** (cut) é curta e relaxada, quase um \"â\". **/ɑː/** (cart) é longa, como o \"a\" de \"pá\".","Pares úteis: **bad / bud**, **ran / run**, **hat / hut / heart**. Treine olhando no espelho: em /æ/ a boca abre bastante."],"words":[{"en":"cat","pt":"két"},{"en":"cut","pt":"kât"},{"en":"cart","pt":"kárt"},{"en":"ran","pt":"rén"},{"en":"run","pt":"rân"},{"en":"hat","pt":"hét"},{"en":"hut","pt":"hât"},{"en":"heart","pt":"hárt"}],"sents":["The bus can run fast and the van can't.","My cat jumped on the hot hat in the hut.","The staff are hard at work on the new app."],"quiz":[{"say":"cat","q":"Ouça e escolha a palavra que você ouviu.","o":["cut","cat"],"a":1},{"say":"run","q":"Ouça e escolha a palavra que você ouviu.","o":["ran","run"],"a":1},{"say":"hut","q":"Ouça e escolha a palavra que você ouviu.","o":["hat","hut"],"a":1},{"say":"heart","q":"Ouça e escolha a palavra que você ouviu.","o":["hat","heart"],"a":1},{"say":"bud","q":"Ouça e escolha a palavra que você ouviu.","o":["bud","bad"],"a":0}]},{"u":29,"title":"J e Y","focus":"/dʒ/ (job) e /j/ (yes)","explain":["O **j** inglês é um som de \"dj\", como em \"dia\" no sotaque de algumas regiões: **job, joke, just**. O **y** inicial é um \"i\" rápido: **yes, year, young**.","Os pares **jet / yet**, **jam / yam** e **joke / yolk** são traiçoeiros: no primeiro a língua toca o céu da boca, no segundo não."],"words":[{"en":"job","pt":"djób"},{"en":"joke","pt":"djôuk"},{"en":"just","pt":"djâst"},{"en":"jet","pt":"djét"},{"en":"yet","pt":"iét"},{"en":"yes","pt":"iés"},{"en":"year","pt":"iir"},{"en":"young","pt":"iâng"}],"sents":["My job is just to give feedback every year.","Yes, the young manager made a joke.","They haven't started the project yet."],"quiz":[{"say":"jet","q":"Ouça e escolha a palavra que você ouviu.","o":["jet","yet"],"a":0},{"say":"jam","q":"Ouça e escolha a palavra que você ouviu.","o":["jam","yam"],"a":0},{"say":"joke","q":"Ouça e escolha a palavra que você ouviu.","o":["yolk","joke"],"a":1},{"say":"jell","q":"Ouça e escolha a palavra que você ouviu.","o":["jell","yell"],"a":0},{"say":"year","q":"Ouça e escolha a palavra que você ouviu.","o":["jeer","year"],"a":1}]},{"u":30,"title":"Vogais /əʊ/ e /ɔː/","focus":"boat x bought","explain":["**/əʊ/** (low, boat, coat) é um ditongo que termina em \"u\": \"lôu\". **/ɔː/** (law, bought, caught) é uma vogal longa e redonda, tipo \"ó\" prolongado.","Pares para treinar: **low / law**, **boat / bought**, **coat / caught**, **so / saw**. Em /ɔː/ os lábios ficam arredondados e parados."],"words":[{"en":"low","pt":"lôu"},{"en":"law","pt":"lóo"},{"en":"boat","pt":"bôut"},{"en":"bought","pt":"bóot"},{"en":"coat","pt":"kôut"},{"en":"caught","pt":"kóot"},{"en":"so","pt":"sôu"},{"en":"saw","pt":"sóo"}],"sents":["I bought a ticket for the show and caught the bus.","She wrote a long poem about the old boat.","He thought the low door was too small."],"quiz":[{"say":"low","q":"Ouça e escolha a palavra que você ouviu.","o":["low","law"],"a":0},{"say":"boat","q":"Ouça e escolha a palavra que você ouviu.","o":["boat","bought"],"a":0},{"say":"coat","q":"Ouça e escolha a palavra que você ouviu.","o":["caught","coat"],"a":1},{"say":"so","q":"Ouça e escolha a palavra que você ouviu.","o":["so","saw"],"a":0},{"say":"owe","q":"Ouça e escolha a palavra que você ouviu.","o":["awe","owe"],"a":1}]},{"u":31,"title":"Final -ng e -n","focus":"/ŋ/ (sing) e /n/ (sin)","explain":["O **ng** inglês é um som nasal só: o fundo da língua toca o céu da boca, e **não se pronuncia um g separado**. **Sing** é \"síng\", sem \"gui\".","Compare **sin / sing**, **ran / rang**, **thin / thing**. Em **-n** a língua encosta atrás dos dentes de cima; em **-ng** ela fica atrás."],"words":[{"en":"sin","pt":"sin"},{"en":"sing","pt":"sing"},{"en":"ran","pt":"rén"},{"en":"rang","pt":"réng"},{"en":"thin","pt":"θin"},{"en":"thing","pt":"θing"},{"en":"win","pt":"uín"},{"en":"wing","pt":"uíng"}],"sents":["Everything is changing and nothing is wrong.","The young singer rang the bell.","We are having a meeting on the housing law."],"quiz":[{"say":"sin","q":"Ouça e escolha a palavra que você ouviu.","o":["sing","sin"],"a":1},{"say":"rang","q":"Ouça e escolha a palavra que você ouviu.","o":["ran","rang"],"a":1},{"say":"thing","q":"Ouça e escolha a palavra que você ouviu.","o":["thin","thing"],"a":1},{"say":"wing","q":"Ouça e escolha a palavra que você ouviu.","o":["win","wing"],"a":1},{"say":"sun","q":"Ouça e escolha a palavra que você ouviu.","o":["sun","sung"],"a":0}]},{"u":32,"title":"P, T, K com sopro","focus":"/p/, /t/, /k/ aspirados","explain":["No início de uma sílaba acentuada, **p, t, k** saem com um pequeno sopro de ar: **pin, tie, cap**. Segure a mão diante da boca e sinta o ar. Em **b, d, g** quase não há sopro.","Isso ajuda o ouvinte a diferenciar **pin / bin**, **tie / die**, **coal / goal**. Sem o sopro, o p pode parecer um b."],"words":[{"en":"pin","pt":"pin"},{"en":"bin","pt":"bin"},{"en":"tie","pt":"tai"},{"en":"die","pt":"dai"},{"en":"coal","pt":"kôul"},{"en":"goal","pt":"gôul"},{"en":"cap","pt":"kép"},{"en":"gap","pt":"gép"}],"sents":["Please keep a copy of the contract in the bin.","Take the time to talk to the team.","The goal is to get the best career path."],"quiz":[{"say":"pin","q":"Ouça e escolha a palavra que você ouviu.","o":["pin","bin"],"a":0},{"say":"tie","q":"Ouça e escolha a palavra que você ouviu.","o":["tie","die"],"a":0},{"say":"coal","q":"Ouça e escolha a palavra que você ouviu.","o":["coal","goal"],"a":0},{"say":"cap","q":"Ouça e escolha a palavra que você ouviu.","o":["cap","gap"],"a":0},{"say":"pack","q":"Ouça e escolha a palavra que você ouviu.","o":["back","pack"],"a":1}]}],"RD":[{"u":1,"title":"A Sunday in my kitchen","level":"B1","text":["On Sundays I usually cook for my whole family. I wake up early, go to the market and buy fresh vegetables, fish and fruit. My mother thinks I spend too much money, but I believe good food is worth it. I never eat fast food at home, and I rarely buy ready meals.","Right now it is Sunday morning and I am making a big lunch. My sister is helping me this week because her oven is broken. She is cutting the onions and crying, and we are both laughing. This month I am trying a new recipe from Italy: a vegetable lasagna. I am also learning to cook without much salt, because my father is on a diet. He is not enjoying it, but he is eating everything on his plate."],"gloss":[{"en":"worth it","pt":"vale a pena"},{"en":"fresh","pt":"fresco"},{"en":"fast food","pt":"comida rápida"},{"en":"ready meals","pt":"pratos prontos"},{"en":"oven","pt":"forno"},{"en":"on a diet","pt":"de dieta"}],"qs":[{"q":"What does the writer usually do on Sundays?","o":["Work at the market","Eat in a restaurant","Cook for the whole family"],"a":2},{"q":"Why is the sister helping this week?","o":["Her oven is broken","She wants to learn Italian","She is on holiday"],"a":0},{"q":"What new recipe is the writer trying this month?","o":["A chocolate cake","A fish soup","A vegetable lasagna"],"a":2},{"q":"Why is the writer cooking with less salt?","o":["The mother does not like salt","The writer is on a diet","The father is on a diet"],"a":2},{"q":"What are \"ready meals\"?","o":["Dishes cooked by the family","Meals served exactly at noon","Food already prepared and sold in a shop"],"a":2}]},{"u":2,"title":"A busy family weekend","level":"B1","text":["This weekend is going to be busy. My cousins are arriving on Friday evening, and I am picking them up at the bus station at seven. My parents are going to cook a big dinner for everyone, and my brother has promised that he will bring dessert. I think it will probably be noisy, because my cousin Tom talks a lot and loves telling jokes.","On Saturday we are going to visit my grandmother. She is eighty-two and very independent and stubborn. She says she will not move to a smaller house, even though she lives alone. I believe she will change her mind one day, but I will not push her. My aunt is organising a surprise party for Sunday, so we must not tell Grandma. She is turning eighty-three, and she hates surprises, but we are sure that she will like this one."],"gloss":[{"en":"pick up","pt":"buscar alguém"},{"en":"stubborn","pt":"teimoso"},{"en":"independent","pt":"independente"},{"en":"change her mind","pt":"mudar de ideia"},{"en":"surprise party","pt":"festa surpresa"},{"en":"turn (83)","pt":"completar (83 anos)"}],"qs":[{"q":"Where is the writer picking up the cousins?","o":["At the airport","At the grandmother's house","At the bus station"],"a":2},{"q":"What is the brother going to bring?","o":["Some jokes","A big dinner","Dessert"],"a":2},{"q":"Why will the dinner probably be noisy?","o":["There will be many children","The parents love music","Cousin Tom talks a lot"],"a":2},{"q":"What does the grandmother refuse to do?","o":["Go to the party","Move to a smaller house","Visit her family"],"a":1},{"q":"What is planned for Sunday?","o":["A trip to the beach","A visit to the cousins","A surprise party for Grandma"],"a":2}]},{"u":3,"title":"Saving for a trip","level":"B1","text":["I have always loved travelling, but I have never been abroad. Last year I decided to change that. I opened a savings account in March, and I have saved about two hundred euros every month since then. I have not bought new clothes for six months, and I have stopped eating out. Last week I cancelled my gym membership because I did not use it much.","So far I have saved enough for the flights. I bought the tickets two days ago: I paid three hundred and fifty euros for a return flight to Lisbon. I have also found a cheap hostel near the beach. I have not booked it yet because I am waiting for a discount. My friend Ana has already offered to lend me some money, but I said no. I want to pay for this trip with my own money."],"gloss":[{"en":"abroad","pt":"no exterior"},{"en":"savings account","pt":"conta poupança"},{"en":"gym membership","pt":"mensalidade da academia"},{"en":"so far","pt":"até agora"},{"en":"lend","pt":"emprestar"},{"en":"return flight","pt":"passagem de ida e volta"}],"qs":[{"q":"When did the writer open the savings account?","o":["In March","Last week","Two days ago"],"a":0},{"q":"What has the writer stopped doing to save money?","o":["Working","Travelling","Eating out"],"a":2},{"q":"How much did the flight to Lisbon cost?","o":["Three hundred and fifty euros","Six hundred euros","Two hundred euros"],"a":0},{"q":"Has the writer booked the hostel?","o":["No, because the writer is waiting for a discount","No, because Ana will pay for it","Yes, near the beach"],"a":0},{"q":"What did the writer say to Ana's offer?","o":["No","Maybe later","Yes, thank you"],"a":0}]},{"u":4,"title":"A new life in Portugal","level":"B1+","text":["Daniel has lived in Porto since 2019. Before that he worked in an office in São Paulo for ten years, and he was exhausted. One day he decided that he needed a change, so he sold his car, packed two suitcases and moved to Portugal. He has been taking Portuguese classes every week, and he says that European Portuguese is harder than he expected.","He has been working as a tour guide since last spring. At first he was terrified because he did not know the city, but he has been studying its history every evening. Now his tours are very popular. He has made many friends and he has not missed his old job for a single day. He says that moving was the best decision of his life, although he sometimes feels homesick when he hears Brazilian music."],"gloss":[{"en":"exhausted","pt":"exausto"},{"en":"pack","pt":"fazer as malas"},{"en":"tour guide","pt":"guia de turismo"},{"en":"terrified","pt":"apavorado"},{"en":"homesick","pt":"com saudade de casa"},{"en":"expected","pt":"esperava"}],"qs":[{"q":"Since when has Daniel lived in Porto?","o":["For ten years","Since 2019","Since last spring"],"a":1},{"q":"What did Daniel do before he moved?","o":["He worked in an office in São Paulo","He was a tour guide","He studied in Portugal"],"a":0},{"q":"What has Daniel been doing every evening?","o":["Studying the history of the city","Cooking Brazilian food","Looking for a new job"],"a":0},{"q":"Why does Daniel sometimes feel homesick?","o":["His tours are not popular","He hears Brazilian music","He has no friends"],"a":1},{"q":"What does \"exhausted\" mean?","o":["Very happy","Very angry","Very tired"],"a":2}]},{"u":5,"title":"Bus, bike or car?","level":"B1","text":["Getting to work in my city is not easy. The bus is the cheapest way, but it is also the slowest. It takes fifty minutes, while the car takes thirty. The car is more comfortable than the bus, but it is much more expensive because of petrol and parking. Last month I spent more than two hundred euros on parking alone.","So I decided to try the bike. At first I thought it was the most dangerous option, but there is a new bike lane that is safer than the old road. Now I get to work in thirty-five minutes, and I arrive less tired than before. It is the best choice for my health and my wallet. The only problem is the rain: it is not as pleasant to ride when the weather is bad. On those days I take the bus, which is not as bad as I remember."],"gloss":[{"en":"petrol","pt":"gasolina"},{"en":"parking","pt":"estacionamento"},{"en":"bike lane","pt":"ciclovia"},{"en":"wallet","pt":"carteira"},{"en":"ride","pt":"pedalar"},{"en":"option","pt":"opção"}],"qs":[{"q":"Which way to work is the cheapest?","o":["The car","The bus","The bike"],"a":1},{"q":"How long does the car take?","o":["Fifty minutes","Thirty-five minutes","Thirty minutes"],"a":2},{"q":"Why is the new bike lane important?","o":["It is safer than the old road","It is only for tourists","It is shorter than the bus route"],"a":0},{"q":"What is the only problem with the bike?","o":["The rain","The parking","The price"],"a":0},{"q":"What does the writer do when the weather is bad?","o":["Takes the car","Takes the bus","Stays at home"],"a":1}]},{"u":6,"title":"Young people and old people","level":"B1","text":["People often say that young people are lazy and that old people are boring. In my experience, both ideas are wrong. My grandfather, for example, is seventy-five and he plays the guitar in a band. The people in his band are all over seventy, and they play in the park on Saturdays. They are much more energetic than many teenagers I know.","On the other hand, my little sister is sixteen and she volunteers at a hospital twice a week. She is afraid of blood, but she is good at talking to patients. She says that the best part of the job is listening to the stories of the elderly. I think we should be careful with generalisations. It is true that some people are lazy, but it is not true of everyone. Every person is different, and that is what makes life interesting."],"gloss":[{"en":"lazy","pt":"preguiçoso"},{"en":"boring","pt":"chato"},{"en":"volunteer","pt":"ser voluntário"},{"en":"the elderly","pt":"os idosos"},{"en":"generalisation","pt":"generalização"},{"en":"energetic","pt":"cheio de energia"}],"qs":[{"q":"What does the grandfather do?","o":["He plays the guitar in a band","He volunteers at a hospital","He teaches music"],"a":0},{"q":"When does the band play?","o":["Every day","On Sundays","On Saturdays"],"a":2},{"q":"What does the sister do twice a week?","o":["She volunteers at a hospital","She plays the guitar","She goes to the park"],"a":0},{"q":"What does the writer think about generalisations?","o":["We should be careful with them","They are useful for teenagers","They are always true"],"a":0},{"q":"What is the sister afraid of?","o":["Old people","Blood","Hospitals"],"a":1}]},{"u":7,"title":"Rules at the new office","level":"B1","text":["Last Monday I started working at a design company. On my first day, my manager gave me a list of rules. You have to arrive before nine, and you must wear your badge at all times. You mustn't use your phone in meetings, and you can't park in the front car park, because it is only for visitors. You don't have to wear a suit, but you should dress neatly.","Some rules are surprising. For example, you should leave your desk and walk around for five minutes every hour. Everyone has to take a lunch break, and you mustn't eat at your desk. At first, I thought these rules were strange, but my colleague Ana explained that they help people stay healthy. Now I think they make sense. The only rule I don't like is the coffee rule: you must wash your own cup. I really should buy a bigger one!"],"gloss":[{"en":"badge","pt":"crachá"},{"en":"visitors","pt":"visitantes"},{"en":"neatly","pt":"de forma arrumada"},{"en":"colleague","pt":"colega de trabalho"},{"en":"make sense","pt":"fazer sentido"},{"en":"desk","pt":"mesa de trabalho"}],"qs":[{"q":"What time do employees have to arrive?","o":["Before nine","At ten","At noon"],"a":0},{"q":"Who can use the front car park?","o":["Everyone","Only visitors","Only the manager"],"a":1},{"q":"Do employees have to wear a suit?","o":["No, but they should dress neatly","Yes, always","No, and they can wear anything"],"a":0},{"q":"Why does the company want people to walk every hour?","o":["To help them stay healthy","To save electricity","To meet visitors"],"a":0},{"q":"Which rule does the writer not like?","o":["Wearing the badge","Washing his or her own cup","Taking a lunch break"],"a":1}]},{"u":8,"title":"Learning to code at fifty","level":"B1+","text":["When Marcos was young, he couldn't afford to go to university. He started working at a supermarket at seventeen, and he was a cashier for thirty-three years. He was good with numbers, but he had never been able to use a computer well. Last year the supermarket closed, and he had to look for a new job.","At fifty, he decided to learn to code. He joined an online course and studied every night after his daughter went to bed. In the beginning he wasn't able to understand even the simplest exercises, and he nearly gave up. But he kept going, and after six months he could build a small website. Now he is able to work from home as a junior developer. He says that anyone can learn new skills at any age. He is not rich, but he is happier than before, and he can finally help his daughter with her homework."],"gloss":[{"en":"afford","pt":"ter dinheiro para"},{"en":"cashier","pt":"caixa"},{"en":"give up","pt":"desistir"},{"en":"keep going","pt":"continuar"},{"en":"junior developer","pt":"programador júnior"},{"en":"skill","pt":"habilidade"}],"qs":[{"q":"Why did Marcos not go to university?","o":["He did not like studying","He lived abroad","He could not afford it"],"a":2},{"q":"How long was he a cashier?","o":["Seventeen years","Thirty-three years","Six months"],"a":1},{"q":"Why did he have to look for a new job?","o":["The supermarket closed","He wanted more money","He was too old"],"a":0},{"q":"What could Marcos do after six months?","o":["Build a small website","Write a book","Teach a course"],"a":0},{"q":"What does Marcos say about learning new skills?","o":["Anyone can learn at any age","It is only for young people","It is too difficult"],"a":0}]},{"u":9,"title":"The match that changed everything","level":"B1","text":["It was a cold Saturday in November, and the stadium was almost empty. The young goalkeeper, Pedro, was sitting on the bench because the main goalkeeper had broken his arm the day before. Pedro had never played in a professional match. While the teams were warming up, he was feeling very nervous, and his hands were shaking.","The match started badly. After ten minutes, the other team scored, and the crowd was shouting at Pedro. Then something strange happened: it began to rain, and Pedro suddenly stopped thinking about the crowd. He saved three goals in a row. When the final whistle blew, his team had won two to one. A journalist who had been watching the game asked him for an interview. Pedro said that he would never forget that day, because it was the day he stopped being afraid."],"gloss":[{"en":"goalkeeper","pt":"goleiro"},{"en":"bench","pt":"banco de reservas"},{"en":"warm up","pt":"aquecer"},{"en":"score","pt":"marcar gol"},{"en":"crowd","pt":"multidão, torcida"},{"en":"whistle","pt":"apito"}],"qs":[{"q":"Why was Pedro playing?","o":["The main goalkeeper had broken his arm","He was the captain","The coach liked him"],"a":0},{"q":"How did Pedro feel before the match?","o":["Very angry","Very nervous","Very tired"],"a":1},{"q":"What happened after ten minutes?","o":["Pedro saved a goal","The other team scored","The rain stopped the game"],"a":1},{"q":"What was the final result?","o":["Pedro's team won two to one","Pedro's team lost","The match was a draw"],"a":0},{"q":"Why
